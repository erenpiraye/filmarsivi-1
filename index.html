/* ===================== SÜRÜKLE-BIRAK (kart taşıma) ===================== */
// SADECE FARE (masaüstü tarayıcı) ile çalışır. Telefonda/dokunmatikte kart
// sürükleme KAPATILDI: parmakla basılı tutup sürüklemeye çalışırken sayfanın
// aynı anda kayması (scroll ile çakışması) yüzünden verimsiz/kontrolsüz
// çalışıyordu, bu yüzden dokunmatik sürükleme tamamen devre dışı bırakıldı.
// Telefonda kartlar artık normal şekilde kaydırılabilir (scroll), taşıma
// işlemi yapılamaz; taşımak için "izlendi" (✔) veya "sil" (✕) butonları,
// ya da PC'den (fare ile) sürükleme kullanılabilir.
const LONG_PRESS_MS=300;
const DRAG_MOVE_THRESHOLD=8; // fare: düz tıkla sürüklemeyi ayırt etmek için (fare titremez, dar tutulabilir)
const TOUCH_CANCEL_THRESHOLD=20; // (artık kullanılmıyor, dokunmatik sürükleme kapalı)

function canReorderList(type){
 if(sortState[type]!=="added-desc" && sortState[type]!=="added-asc") return false;
 if(genreState[type]!=="all" || directorState[type]!=="all" || actorState[type]!=="all") return false;
 if(searchActive[type]) return false;
 return true;
}

function getSortedDisplayIds(type){
 let indexed=allData[type].map((m,i)=>({m,i}));
 indexed=sortIndexed(indexed,sortState[type]);
 return indexed.map(x=>x.m.imdbID);
}

// displayIds (o listede GÖRÜNECEK yeni sıra) dizisine göre allData[type]'ı
// fiilen o sıraya sokar (added-desc ise ters çevirip saklıyoruz, added-asc
// ise doğrudan - dizinin kendi konumu = sıralama anahtarı). movedId verilirse
// SADECE o filmin _addedAt/_updatedAt alanı newAddedAt ile güncellenir; diğer
// hiçbir filme dokunulmaz.
function applyDisplayOrder(type,displayIds,movedId,newAddedAt){
 const sort=sortState[type];
 const map=new Map(allData[type].map(m=>[m.imdbID,m]));
 let newArray=(sort==="added-desc")
   ?displayIds.slice().reverse().map(id=>map.get(id)).filter(Boolean)
   :displayIds.map(id=>map.get(id)).filter(Boolean);
 if(movedId!=null){
   const now=Date.now();
   newArray=newArray.map(m=>m.imdbID===movedId?{...m,_addedAt:newAddedAt,_updatedAt:now}:m);
 }
 allData[type]=newArray;
}

function getListEl(type){
 return type==="watchlist"?watchList:watchedList;
}

function getInsertIndex(listEl,clientY){
 const cards=Array.from(listEl.querySelectorAll(".movie:not(.dragging-source)"));
 for(let i=0;i<cards.length;i++){
   const rect=cards[i].getBoundingClientRect();
   if(clientY<rect.top+rect.height/2) return i;
 }
 return cards.length;
}

let dropIndicatorEl=null;
let dropGapEl=null;
let dropGapMode=null;

function clearDropVisuals(){
 if(dropIndicatorEl && dropIndicatorEl.parentNode) dropIndicatorEl.remove();
 dropIndicatorEl=null;
 if(dropGapEl){
   dropGapEl.classList.remove("drop-gap-before","drop-gap-after");
   dropGapEl=null;
   dropGapMode=null;
 }
}

function showDropVisual(listEl,insertIndex){
 clearDropVisuals();
 const cards=Array.from(listEl.querySelectorAll(".movie:not(.dragging-source)"));
 dropIndicatorEl=document.createElement("div");
 dropIndicatorEl.className="drop-indicator";
 if(insertIndex>=cards.length){
   listEl.appendChild(dropIndicatorEl);
   if(cards.length){
     dropGapEl=cards[cards.length-1];
     dropGapMode="after";
     dropGapEl.classList.add("drop-gap-after");
   }
 }else{
   listEl.insertBefore(dropIndicatorEl,cards[insertIndex]);
   dropGapEl=cards[insertIndex];
   dropGapMode="before";
   dropGapEl.classList.add("drop-gap-before");
 }
}

// Bırakılan yerdeki iki komşu arasına denk gelecek TEK bir _addedAt değeri
// hesaplar (idsExcludingMoved: sürüklenen film çıkarılmış hedef sıradaki id
// listesi, k: o listede bırakılacağı konum). Gerçek "şu an"ı ASLA geçmez -
// eskiden burada tüm listenin zaman damgası yeniden yazılıyordu ve üst
// sıradaki filmler dakikalarca "gelecek" bir tarihe sahip oluyordu; az sonra
// eklenen yeni bir film o yüzden en üste değil, onların altına düşüyordu.
function computeNeighborAddedAt(type,idsExcludingMoved,k){
 const mode=sortState[type];
 const map=new Map(allData[type].map(m=>[m.imdbID,m]));
 const getAt=m=>(m&&typeof m._addedAt==="number")?m._addedAt:0;
 const beforeM=k>0?map.get(idsExcludingMoved[k-1]):null;
 const afterM=k<idsExcludingMoved.length?map.get(idsExcludingMoved[k]):null;

 if(beforeM && afterM) return Math.round((getAt(beforeM)+getAt(afterM))/2);

 // "en yeni" ucu: added-desc'te üst uç (after var, before yok);
 // added-asc'te alt uç (before var, after yok).
 const becomesNewest=(mode==="added-desc"&&afterM&&!beforeM)||(mode==="added-asc"&&beforeM&&!afterM);
 if(becomesNewest) return Math.max(Date.now(),getAt(afterM||beforeM)+1);
 if(afterM) return getAt(afterM)-1000;
 if(beforeM) return getAt(beforeM)-1000;
 return Date.now();
}

function persistMovedItem(type,id,newAddedAt){
 saveToCache();
 db.collection(type).doc(id).update({_addedAt:newAddedAt,_updatedAt:Date.now()}).catch(e=>console.error(e));
}

function reorderInList(type,id,toDisplayIndex){
 if(!canReorderList(type)) return;
 const ids=getSortedDisplayIds(type);
 const fromIdx=ids.indexOf(id);
 if(fromIdx===-1) return;
 const adjustedIndex=fromIdx<toDisplayIndex?toDisplayIndex-1:toDisplayIndex;
 if(adjustedIndex===fromIdx) return;

 const others=ids.filter(x=>x!==id);
 const k=Math.max(0,Math.min(adjustedIndex,others.length));
 const newAddedAt=computeNeighborAddedAt(type,others,k);

 ids.splice(fromIdx,1);
 ids.splice(adjustedIndex,0,id);
 applyDisplayOrder(type,ids,id,newAddedAt);
 render();
 persistMovedItem(type,id,newAddedAt);
}

async function moveToListAt(id,fromType,toType,toDisplayIndex){
 const idx=allData[fromType].findIndex(m=>m.imdbID===id);
 if(idx===-1) return;
 const movie=allData[fromType][idx];

 let newAddedAt=Date.now();
 let targetIds=null;
 if(canReorderList(toType)){
   targetIds=getSortedDisplayIds(toType); // hedefte henüz "id" yok
   const k=Math.max(0,Math.min(toDisplayIndex,targetIds.length));
   newAddedAt=computeNeighborAddedAt(toType,targetIds,k);
   targetIds=targetIds.slice();
   targetIds.splice(k,0,id); // yeni film, bırakıldığı tam konuma ekleniyor
 }

 allData[fromType]=allData[fromType].filter(m=>m.imdbID!==id);
 const now=Date.now();
 allData[toType]=[...allData[toType],{...movie,_addedAt:newAddedAt,_updatedAt:now}];
 if(targetIds) applyDisplayOrder(toType,targetIds,null,null);
 render();
 saveToCache();

 try{
   const srcSnap=await db.collection(fromType).doc(id).get();
   if(!srcSnap.exists) return;
   const data=srcSnap.data();
   data._addedAt=newAddedAt;
   data._updatedAt=now;
   await db.collection(toType).doc(id).set(data);
   await db.collection(fromType).doc(id).delete();
 }catch(e){
   console.error(e);
   allData[toType]=allData[toType].filter(m=>m.imdbID!==id);
   allData[fromType]=[...allData[fromType],movie];
   render();
   saveToCache();
 }
}


document.addEventListener("dragstart",e=>{ if(e.target.closest(".movie")) e.preventDefault(); });

function attachDragHandlers(cardEl,id,type){
 let dragging=false, longPressTimer=null, ghost=null, startX=0, startY=0, capturedPointerId=null;
 let lastTargetType=null, lastInsertIndex=0, lastClientX=0, lastClientY=0;

 function positionGhost(x,y){
   if(!ghost) return;
   ghost.style.left=(x-ghost.offsetWidth/2)+"px";
   ghost.style.top=(y-ghost.offsetHeight/2)+"px";
 }

 function getColumnAt(x,y){
   if(ghost) ghost.style.visibility="hidden";
   const el=document.elementFromPoint(x,y);
   if(ghost) ghost.style.visibility="";
   const col=el&&el.closest(".column");
   return col?col.dataset.type:null;
 }

 function updateDropTarget(clientX,clientY){
   const targetType=getColumnAt(clientX,clientY);
   lastTargetType=targetType;
   if(!targetType){
     clearDropVisuals();
     return;
   }
   const sameColumn=targetType===type;
   const canPlace=sameColumn?canReorderList(type):canReorderList(targetType);
   if(!canPlace){
     clearDropVisuals();
     lastInsertIndex=0;
     return;
   }
   const listEl=getListEl(targetType);
   lastInsertIndex=getInsertIndex(listEl,clientY);
   showDropVisual(listEl,lastInsertIndex);
 }

 function startDrag(e){
   dragging=true;
   ghost=cardEl.cloneNode(true);
   ghost.className="movie drag-ghost";
   ghost.style.width=cardEl.offsetWidth+"px";
   document.body.appendChild(ghost);
   positionGhost(e.clientX,e.clientY);
   cardEl.classList.add("dragging-source");
   updateDropTarget(e.clientX,e.clientY);
 }

 function onMove(e){
   lastClientX=e.clientX; lastClientY=e.clientY;
   if(!dragging){
     const moved=Math.abs(e.clientX-startX)>DRAG_MOVE_THRESHOLD||Math.abs(e.clientY-startY)>DRAG_MOVE_THRESHOLD;
     if(!moved) return;
     // Fare: gerçekten birkaç piksel hareket etmeden sürükleme başlamasın -
     // yoksa düz bir TIK bile "sürükleme" sayılıp kartı yanlış yere taşıyordu.
     startDrag(e);
   }
   e.preventDefault();
   positionGhost(e.clientX,e.clientY);
   updateDropTarget(e.clientX,e.clientY);
 }

 function cleanup(){
   clearTimeout(longPressTimer);
   cardEl.removeEventListener("pointermove",onMove);
   cardEl.removeEventListener("pointerup",onUp);
   cardEl.removeEventListener("pointercancel",onUp);
   if(capturedPointerId!==null && cardEl.releasePointerCapture){
     try{ cardEl.releasePointerCapture(capturedPointerId); }catch(err){}
   }
   capturedPointerId=null;
   clearDropVisuals();
   cardEl.classList.remove("dragging-source");
   if(ghost){ ghost.remove(); ghost=null; }
 }

 function onUp(e){
   const wasDragging=dragging;
   const targetType=wasDragging?lastTargetType:null;
   const insertIndex=lastInsertIndex;
   dragging=false;
   cleanup();
   if(!wasDragging || !targetType) return;
   if(targetType===type){
     if(canReorderList(type)) reorderInList(type,id,insertIndex);
   }else if(canReorderList(targetType)){
     moveToListAt(id,type,targetType,insertIndex);
   }else if(targetType==="watched"){
     move(id);
   }else{
     moveToWatchlist(id);
   }
 }

 cardEl.addEventListener("pointerdown",e=>{
   if(e.pointerType && e.pointerType!=="mouse") return; // dokunmatikte sürükleme kapalı - sayfa normal kayar
   if(e.button!==undefined && e.button!==0) return;
   if(e.target.closest(".delete-btn,.tick-btn,.poster-link,.person-link")) return;
   e.preventDefault();
   startX=e.clientX; startY=e.clientY;
   lastClientX=e.clientX; lastClientY=e.clientY;
   lastTargetType=null;
   lastInsertIndex=0;
   capturedPointerId=e.pointerId;
   if(cardEl.setPointerCapture){
     try{ cardEl.setPointerCapture(capturedPointerId); }catch(err){}
   }
   cardEl.addEventListener("pointermove",onMove);
   cardEl.addEventListener("pointerup",onUp);
   cardEl.addEventListener("pointercancel",onUp);
   // Fare: sürükleme burada başlamıyor artık, sadece pointer kilitleniyor;
   // gerçek sürükleme onMove()'da eşik aşılınca başlar - düz tık artık taşımaz.
 });
}

function sortIndexed(indexed,mode){
 const arr=indexed.slice();
 switch(mode){
   case "added-asc": arr.sort((a,b)=>a.i-b.i); break;
   case "az": arr.sort((a,b)=>(a.m.Title||"").localeCompare(b.m.Title||"","tr")); break;
   case "za": arr.sort((a,b)=>(b.m.Title||"").localeCompare(a.m.Title||"","tr")); break;
   case "year-desc": arr.sort((a,b)=>(parseInt(b.m.Year)||0)-(parseInt(a.m.Year)||0)); break;
   case "year-asc": arr.sort((a,b)=>(parseInt(a.m.Year)||0)-(parseInt(b.m.Year)||0)); break;
   case "rating-desc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.imdbRating); const ra=parseFloat(a.m.imdbRating);
     return (isNaN(rb)?-1:rb)-(isNaN(ra)?-1:ra);
   }); break;
   case "rating-asc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.imdbRating); const ra=parseFloat(a.m.imdbRating);
     return (isNaN(ra)?999:ra)-(isNaN(rb)?999:rb);
   }); break;
   case "myrating-desc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.myRating); const ra=parseFloat(a.m.myRating);
     return (isNaN(rb)?-1:rb)-(isNaN(ra)?-1:ra);
   }); break;
   case "myrating-asc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.myRating); const ra=parseFloat(a.m.myRating);
     return (isNaN(ra)?999:ra)-(isNaN(rb)?999:rb);
   }); break;
   case "added-desc":
   default: arr.sort((a,b)=>b.i-a.i); break;
 }
 return arr;
}

/* ---- ORTAK YARDIMCILAR: isim/etiket tekilleştirme ----
   TMDB kadro listesinde aynı kişi iki kez geçebiliyor (çift rol, "Director"
   görevinin iki kez yazılması vb.) ve aynı isim bazen farklı boşluk/büyük-küçük
   harfle geliyor. Bu yüzden istatistikler aynı filmi bir kişi için iki kez
   sayabiliyor ("5 film" yazan bir oyuncunun listesinde 4 film çıkıyordu) veya
   aynı kişi iki ayrı isimmiş gibi bölünüyordu. Aşağıdaki fonksiyonlar tüm
   sayımların TEK bir tekilleştirme kuralı kullanmasını sağlar. ---- */
function cleanName(s){
 return String(s==null?"":s).replace(/[\u00A0\u2007\u202F]/g," ").replace(/\s+/g," ").trim();
}
function normNameKey(s){
 return cleanName(s).toLocaleLowerCase("tr-TR");
}
function uniqueNames(list){
 const seen=new Set(), out=[];
 (list||[]).forEach(raw=>{
   const name=cleanName(raw);
   if(!name || name==="N/A") return;
   const key=normNameKey(name);
   if(seen.has(key)) return;
   seen.add(key); out.push(name);
 });
 return out;
}
function nameListHas(list,name){
 const key=normNameKey(name);
 return (list||[]).some(x=>normNameKey(x)===key);
}
/* Aynı film listeye iki kez eklenmişse (aynı imdbID) bütün istatistikleri
   şişiriyordu - sayımlardan önce tekilleştiriliyor.
   Performans: renderStats() içindeki AYNI "movies" dizisi 10'dan fazla bölüm
   fonksiyonuna geçiliyor ve her biri bu fonksiyonu TEKRAR çağırıyordu - aynı
   tekilleştirme işini istatistik penceresi her açıldığında/yenilendiğinde
   10 kez yapmak gereksiz yavaşlığa sebep oluyordu. Aynı dizi referansı için
   sonuç WeakMap'te önbelleğe alınır (içerik hiç değişmez, sadece tekrar
   hesaplanmaz); veri güncellenip yeni bir dizi oluşturulduğunda otomatik
   olarak yeniden hesaplanır. Hiçbir film/veri eksiltilmez ya da değiştirilmez. */
const _statsUniqueCache=new WeakMap();
function statsUniqueMovies(list){
 if(!list) return [];
 const cached=_statsUniqueCache.get(list);
 if(cached) return cached;
 const seen=new Set(), out=[];
 list.forEach(m=>{
   if(!m) return;
   const id=m.imdbID;
   if(id){ if(seen.has(id)) return; seen.add(id); }
   out.push(m);
 });
 _statsUniqueCache.set(list,out);
 return out;
}
/* Sayım listelerinde sıralama her zaman aynı çıksın diye ortak karşılaştırma:
   önce sayı (çoktan aza), eşitlikte isim (Türkçe alfabetik). Böylece "En'ler"
   bölümündeki "En Çok İzlenen Oyuncu/Yönetmen/Tür" kartı ile aşağıdaki
   listelerin ilk sırası HER ZAMAN aynı kişiyi gösterir. */
function statsByCountThenName(a,b){
 return (b.count-a.count) || a.name.localeCompare(b.name,"tr");
}
/* TMDB bilgisi (tam kadro) henüz inmemiş izlenen film sayısı - istatistikler
   eksik veriyle hesaplanıyorsa kullanıcıya bunu söylemek için. */
function statsPendingInfoCount(movies){
 return (movies||[]).filter(m=>{
   const c=turkishCache[m.imdbID];
   return !c || !c._checked || !c._v7 || !c._v8;
 }).length;
}

function movieGenres(m){
 return (m.Genre||"").split(",").map(g=>g.trim()).filter(g=>g&&g!=="N/A");
}
// OMDb'nin İngilizce tür isimleri için sabit çeviri tablosu - TMDB'den
// tür eşleşmesi hiç bulunamazsa (film TMDB'de yoksa ya da ağ hatası kalıcıysa)
// kategori sonsuza kadar İngilizce takılı kalmasın diye son çare olarak kullanılır.
const GENRE_EN_TR={
 "Action":"Aksiyon","Adventure":"Macera","Animation":"Animasyon","Comedy":"Komedi",
 "Crime":"Suç","Documentary":"Belgesel","Drama":"Dram","Family":"Aile",
 "Fantasy":"Fantastik","History":"Tarih","Horror":"Korku","Music":"Müzik",
 "Musical":"Müzikal","Mystery":"Gizem","Romance":"Romantik","Sci-Fi":"Bilim Kurgu",
 "Science Fiction":"Bilim Kurgu","TV Movie":"TV Filmi","Thriller":"Gerilim","War":"Savaş",
 "Western":"Vahşi Batı","Biography":"Biyografi","Sport":"Spor","Film-Noir":"Kara Film",
 "News":"Haber","Short":"Kısa Film","Adult":"Yetişkin","Reality-TV":"Gerçeklik TV",
 "Talk-Show":"Talk Show","Game-Show":"Yarışma Programı"
};
function movieGenresTr(m){
 const info=turkishCache[m.imdbID];
 // Türkçe adları HER SEFERİNDE güncel genreMap'ten türet (genreIds'ten) -
 // böylece önbelleğe yazıldığı anda TMDB tür listesi (genreMap) henüz
 // yüklenmemiş olsa bile (ör. ağ hatası/rate limit) film daha sonra doğru
 // Türkçe kategoriye düşer; kalıcı olarak İngilizce (OMDb) isme takılıp
 // kalmaz ve aynı tür iki farklı adla (örn. "Komedi" / "Comedy") bölünmez.
 if(info && info.genreIds && info.genreIds.length){
   const names=uniqueNames(info.genreIds.map(id=>genreMap[id]).filter(Boolean));
   if(names.length) return names;
 }
 if(info && info.genres && info.genres.length) return uniqueNames(info.genres); // eski önbellek (genreIds'siz) için yedek
 return uniqueNames(movieGenres(m).map(g=>GENRE_EN_TR[g]||g));
}
// TMDB'den çekilen tam kadro/yönetmen listesi (turkishCache) varsa o kullanılır -
// bu, OMDb'nin sınırlı Actors/Director alanından farklı olarak başrolde
// olmayan ama filmde oynayan oyuncuları da içerir. TMDB verisi henüz
// önbellekte yoksa (ör. ilk yükleme sırasında) OMDb alanına geri düşülür.
function movieDirectors(m){
 const info=turkishCache[m.imdbID];
 if(info && info.directorNames && info.directorNames.length) return uniqueNames(info.directorNames);
 return uniqueNames((m.Director||"").split(","));
}
function movieActors(m){
 const info=turkishCache[m.imdbID];
 if(info && info.castNames && info.castNames.length) return uniqueNames(info.castNames);
 return uniqueNames((m.Actors||"").split(","));
}

 allData[type].forEach(m=>movieActors(m).slice(0,5).forEach(a=>set.add(a)));

 if(current!=="all" && !nameListHas(Array.from(set),current) && allData[type].some(m=>nameListHas(movieActors(m),current))){

/* ===================== LİSTEDE BUL ===================== */

let findState={watched:{matches:[],index:-1},watchlist:{matches:[],index:-1}};

// Listedeki filmleri "Listede ara" kutusuna göre gerçekten filtreler (eşleşmeyenleri
// gizler). Hem kullanıcı yazarken hem de liste sıralama/filtre değişikliği ile
// yeniden çizildiğinde (renderColumn içinden) çağrılır, böylece arama aktifken
// liste her yeniden çizildiğinde filtre kaybolmaz.
function applyFindFilter(type){
 const inputEl=document.getElementById(type==="watchlist"?"findWatch":"findWatched");
 const q=inputEl?inputEl.value.trim().toLowerCase():"";
 const listEl=type==="watchlist"?watchList:watchedList;
 const st=findState[type];
 if(!q){
   st.matches=[];
   st.index=-1;
   updateFindCount(type);
   listEl.querySelectorAll(".movie.find-hidden").forEach(el=>el.classList.remove("find-hidden"));
   return;
 }
 const cards=Array.from(listEl.querySelectorAll(".movie"));
 st.matches=[];
 cards.forEach(c=>{
   const titleEl=c.querySelector("b");
   const trEl=c.querySelector(".tr-title");
   const text=((titleEl?titleEl.textContent:"")+" "+(trEl?trEl.textContent:"")).toLowerCase();
   const isMatch=text.includes(q);
   c.classList.toggle("find-hidden",!isMatch);
   if(isMatch) st.matches.push(c);
 });
 st.index=st.matches.length?0:-1;
 updateFindCount(type);
}

// Performans: eskiden kutuya yazılan HER harfte, o anki listedeki TÜM
// kartlar (querySelectorAll(".movie")) taranıp başlık metni karşılaştırılıyor
// ve eşleşmeyenler classList.toggle ile gizleniyordu - büyük listelerde bu
// tam tarama + toplu görünürlük değişikliği (reflow) her tuş vuruşunda
// tekrarlandığı için hızlı yazarken kutuya yazının GERİDEN gelmesine
// (girdinin gecikmeli görünmesine) sebep oluyordu. Artık gerçek filtreleme
// kullanıcı yazmayı ~140ms durdurunca çalışıyor (arama sonucu yine de anlık
// hissettiriyor); kutunun kendisi (değerin görünmesi) tarayıcının normal,
// anında input davranışına bırakılıyor - hiçbir filtreleme/veri kaybı yok.
let findDebounceTimer={watched:null,watchlist:null};
function findInList(input,type){
 const q=input.value.trim().toLowerCase();
 const st=findState[type];
 const listEl=type==="watchlist"?watchList:watchedList;
 clearTimeout(findDebounceTimer[type]);
 if(!q){
   st.matches=[];
   st.index=-1;
   updateFindCount(type);
   listEl.querySelectorAll(".movie.highlight").forEach(el=>el.classList.remove("highlight"));
   // Arama kutusu boşaltılınca listedeki tüm filmler tekrar görünür olsun.
   listEl.querySelectorAll(".movie.find-hidden").forEach(el=>el.classList.remove("find-hidden"));
   return;
 }

 findDebounceTimer[type]=setTimeout(()=>{
   let changed=false;
   if(genreState[type]!=="all"){genreState[type]="all";changed=true;}
   if(directorState[type]!=="all"){directorState[type]="all";changed=true;}
   if(actorState[type]!=="all"){actorState[type]="all";changed=true;}
   if(changed) renderColumn(type);

   applyFindFilter(type);
   goToFindMatch(type);
 },140);
}

function findKeydown(e,type){
 if(e.key==="Enter"){
   e.preventDefault();
   // Kullanıcı yazdıktan hemen sonra (140ms'lik gecikme dolmadan) Enter'a
   // basarsa, filtre henüz o anki metne göre güncellenmemiş olabilir - bu
   // yüzden bekleyen filtrelemeyi burada hemen (gecikmesiz) tamamlıyoruz,
   // ki "Enter = ilk eşleşmeye git" her zaman DOĞRU sonuca göre çalışsın.
   if(findDebounceTimer[type]){
     clearTimeout(findDebounceTimer[type]);
     findDebounceTimer[type]=null;
     let changed=false;
     if(genreState[type]!=="all"){genreState[type]="all";changed=true;}
     if(directorState[type]!=="all"){directorState[type]="all";changed=true;}
     if(actorState[type]!=="all"){actorState[type]="all";changed=true;}
     if(changed) renderColumn(type);
     applyFindFilter(type);
   }
   findNext(type,e.shiftKey?-1:1);
 }
}

function findNext(type,dir){
 const st=findState[type];
 if(!st.matches.length)return;
 st.index=(st.index+dir+st.matches.length)%st.matches.length;
 goToFindMatch(type);
}

function updateFindCount(type){
 const st=findState[type];
 const el=document.getElementById(type==="watchlist"?"findCountWatch":"findCountWatched");
 if(!el)return;
 el.textContent = st.matches.length ? `${st.index+1}/${st.matches.length}` : "";
 const row=el.closest(".find-row");
 if(row) row.classList.toggle("has-matches", st.matches.length>0);
}

function goToFindMatch(type){
 const st=findState[type];
 updateFindCount(type);
 if(st.index<0 || !st.matches[st.index])return;
 const match=st.matches[st.index];
 const listEl=type==="watchlist"?watchList:watchedList;

 listEl.querySelectorAll(".movie.highlight").forEach(el=>el.classList.remove("highlight"));
 match.classList.add("highlight");

 requestAnimationFrame(()=>{
   const container=listEl.closest(".column");
   if(isScrollContainer(container)){
     const containerRect=container.getBoundingClientRect();
     const matchRect=match.getBoundingClientRect();
     const offset=matchRect.top-containerRect.top+container.scrollTop-(container.clientHeight/2)+(matchRect.height/2);
     const prevBehavior=container.style.scrollBehavior;
     container.style.scrollBehavior="auto";
     container.scrollTop=Math.max(offset,0);
     container.style.scrollBehavior=prevBehavior||"";
   } else {
     match.scrollIntoView({behavior:"auto",block:"center"});
   }
 });
}

function renderColumn(type){
 if(searchActive[type]) return; // arama sonuçları ekranda gösteriliyor, üzerine yazma
 const isWatchlist=type==="watchlist";
 const listEl=isWatchlist?watchList:watchedList;
 const countEl=isWatchlist?watchCount:watchedCount;
 const timeEl=isWatchlist?watchTime:watchedTime;

 populateGenreSelect(type);
 populateDirectorSelect(type);
 populateActorSelect(type);

 let indexed=allData[type].map((m,i)=>({m,i}));
 if(genreState[type]!=="all"){
   indexed=indexed.filter(x=>movieGenresTr(x.m).includes(genreState[type]));
 }
 if(directorState[type]!=="all"){
   indexed=indexed.filter(x=>nameListHas(movieDirectors(x.m),directorState[type]));
 }
 if(actorState[type]!=="all"){
   indexed=indexed.filter(x=>nameListHas(movieActors(x.m),actorState[type]));
 }
 indexed=sortIndexed(indexed,sortState[type]);

 listEl.innerHTML="";
 listEl.classList.toggle("grid-view",viewState[type]==="grid");
 let totalMin=0;
 indexed.forEach((x,displayIdx)=>{
   totalMin+=runtimeMin(x.m.Runtime);
   listEl.appendChild(card(x.m,displayIdx,isWatchlist));
 });

 countEl.textContent=indexed.length;
 timeEl.textContent=formatTime(totalMin);

 // Liste yeniden çizildiğinde "Listede ara" filtresi aktifse (kutuda hâlâ
 // metin varsa) filtreyi yeni kartlara da uygula - aksi halde sıralama/kategori
 // değişince ya da liste yenilenince filtre sıfırlanmış gibi görünürdü.
 applyFindFilter(type);
}

function refreshCardsInPlace(force){
 // Performans düzeltmesi: eskiden HER kart için allData.watched+watchlist
 // baştan BİRLEŞTİRİLİP (concat, yeni dizi kopyası) baştan sona TARANIYORDU
 // (find). Bu, kart sayısı * film sayısı kadar işlem demekti (karesel
 // büyüme) - TMDB verisi arka planda akarken bu fonksiyon saniyede birkaç
 // kez çalıştığından, büyük kütüphanelerde ana thread'i uzun süre kilitleyip
 // TÜM arayüzü (arama kutularına yazmak dahil) dondurmasının asıl
 // sebeplerinden biri buydu. Artık film->kart eşleşmesi TEK SEFERDE bir
 // Map'e kuruluyor, her kart için bakış O(1); toplamda karesel değil
 // doğrusal (O(n)) çalışıyor. Davranış ve sonuçlar birebir aynı.
 const movieById=new Map();
 (allData.watched||[]).forEach(m=>{ if(m && m.imdbID) movieById.set(m.imdbID,m); });
 (allData.watchlist||[]).forEach(m=>{ if(m && m.imdbID) movieById.set(m.imdbID,m); });
 document.querySelectorAll(".movie[data-id]").forEach(el=>{
   const id=el.dataset.id;
   const info=turkishCache[id];
   if(!info) return;
   if(info.title){
     const trEl=el.querySelector(".tr-title");
     if(trEl && !trEl.textContent) trEl.textContent=info.title;
   }
   const budgetEl=el.querySelector(".money-budget");
   if(budgetEl){
     const lines=moneyLines(budgetEl.dataset.boxoffice,info);
     if(lines.budget) budgetEl.innerHTML=lines.budget;
     const revEl=el.querySelector(".money-revenue");
     if(revEl && lines.revenue) revEl.innerHTML=lines.revenue;
   }
   // TMDB'den tam kadro/yönetmen geldiyse (castNames/directorNames), kart
   // üzerindeki oyuncu/yönetmen satırlarını da güncelle - böylece OMDb'nin
   // sınırlı listesi yerine (ana kartta 5 oyuncuya kadar) tam liste görünür.
   const m=movieById.get(id);
   if(m){
     const metas=el.querySelectorAll(".meta .meta-icon");
     metas.forEach(iconEl=>{
       if(iconEl.textContent==="🎬" && info.directorNames && info.directorNames.length){
         iconEl.parentElement.innerHTML=`<span class="meta-icon">🎬</span> ${personLinksHtmlList(movieDirectors(m),"director")}`;
       }
       if(iconEl.textContent==="🎭" && info.castNames && info.castNames.length){
         iconEl.parentElement.innerHTML=`<span class="meta-icon">🎭</span> ${personLinksHtmlList(movieActors(m),"actor",5)}`;
       }
     });
   }
 });
 // Kategori/Yönetmen/Oyuncu açılır listelerini yeniden kurmak listenin
 // TAMAMINI tarayıp sıralamayı gerektirdiği için ucuz değil. TMDB verisi
 // akış hâlinde gelirken (preloadInfo döngüsü) bu HER partide - saniyede
 // birkaç kez - tetikleniyordu; büyük kütüphanelerde donma/"sürekli
 // yenileniyormuş gibi görünme" hissinin asıl kaynaklarından biri buydu.
 // Artık en fazla ~1.5 saniyede bir çalışır; veri akışı bittiğinde
 // (force=true, bkz. preloadInfo) son hâlin eksik kalmaması için her zaman
 // çalıştırılır.
 const now=Date.now();
 if(force || now-_lastFilterSelectRefreshAt>1500){
   _lastFilterSelectRefreshAt=now;
   populateGenreSelect("watched");
   populateGenreSelect("watchlist");
   populateDirectorSelect("watched");
   populateDirectorSelect("watchlist");
   populateActorSelect("watched");
   populateActorSelect("watchlist");
 }
}

async function fetchOmdbById(imdbId){

async function searchOmdb(query){
 query=String(query).trim();
 if(query.length<2) return {Response:"False"};
 try{
   const url=query.toLowerCase().startsWith("tt")
     ? `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&i=${query}&plot=short`
     : `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(query)}&type=movie`;
   const r=await fetch(url);
   return await r.json();
 }catch(e){console.error("OMDb arama hatası:",e);return {Response:"False"};}
}

const LOCAL_CACHE_KEY="filmarsivi_cache";

function saveToCache(){
 try{
   localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({watched:allData.watched,watchlist:allData.watchlist}));
 }catch(e){}
}

function loadFromCache(){
 try{
   const raw=localStorage.getItem(LOCAL_CACHE_KEY);
   if(raw){
     const cached=JSON.parse(raw);
     if(cached && Array.isArray(cached.watched) && Array.isArray(cached.watchlist)){
       allData=cached;
       render();
       preloadInfo().then(()=>{ refreshCardsInPlace(true); });

let isReloading=false;
async function reload(){
 if(isReloading) return;
 isReloading=true;
 const statusEl=document.getElementById("syncStatus");
 const btns=document.querySelectorAll(".refresh-btn");
 btns.forEach(b=>{b.style.pointerEvents="none";b.style.opacity="0.4";});
 try{
   await authReady;
   if(statusEl) statusEl.textContent="Yükleniyor…";
   const [watchedSnap,watchlistSnap]=await Promise.all([
     db.collection("watched").get(),
     db.collection("watchlist").get()
   ]);
   const sortByAdded=arr=>arr.slice().sort((a,b)=>(a._addedAt||0)-(b._addedAt||0));
   allData={
     watched: sortByAdded(watchedSnap.docs.map(d=>d.data())),
     watchlist: sortByAdded(watchlistSnap.docs.map(d=>d.data()))
   };
   render();
   if(statusEl) statusEl.textContent="";

async function getPersonImdbId(personId){
 if(personExternalIdCache[personId]!==undefined) return personExternalIdCache[personId];
 try{

// window.open() yerine gerçek bir <a target="_blank"> öğesine tıklama simüle
// ediyoruz - iOS Safari'de (özellikle ana ekrana eklenmiş PWA modunda)
// window.open() bazen sekmeyi güvenilir açamıyor/döngüde takılı kalıyor;
// gerçek bir bağlantı tıklaması tarayıcı tarafından çok daha güvenilir bir
// "yeni sekme aç" isteği olarak işleniyor.
function openExternalLink(url){
 const a=document.createElement("a");
 a.href=url;
 a.target="_blank";
 a.rel="noopener noreferrer";
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
}


async function openPersonPage(personId){
 // Kadro yüklenince arka planda önceden çekilmiş olabilir (bkz.
 // prefetchPersonImdbIds) - öyleyse hiç beklemeden HEMEN (senkron) açabiliriz,
 // ki bu Safari'nin güvenilir kabul ettiği tek yoldur.
 if(personExternalIdCache[personId]!==undefined){
   const cachedId=personExternalIdCache[personId];
   openExternalLink(cachedId?`https://www.imdb.com/name/${cachedId}/`:`https://www.themoviedb.org/person/${personId}`);
   return;
 }
 // Henüz önbellekte yok (ör. kadro yeni yüklendi, prefetch bu kişiye daha
 // sıra gelmeden dokunuldu): window.open() bir "await"ten SONRA çağrılırsa
 // Safari bunu artık kullanıcı etkileşimiyle senkron sayılan bir açılış
 // olarak görmüyor. Çözüm: sekmeyi HEMEN boş olarak aç, adres bilgisini
 // async sorgu bitince yerleştir.
 const win=window.open("about:blank","_blank");
 const imdbId=await getPersonImdbId(personId);
 const url=imdbId?`https://www.imdb.com/name/${imdbId}/`:`https://www.themoviedb.org/person/${personId}`;
 if(win) win.location.href=url;
 else openExternalLink(url);
}

// Filmin oyuncu kadrosunu/yönetmen-senarist listesini TMDB'den çeker
// (SADECE bu film açıldığında, bir kereye mahsus - toplu ön-yüklemeye dahil değil).
async function loadCastForDetail(tmdbId){
 if(!tmdbId) return null;
 if(castCache[tmdbId]) return castCache[tmdbId];
 try{
   const data=await fetchJson(`https://api.themoviedb.org/3/movie/${tmdbId}/credits?api_key=${TMDB_KEY}&language=tr-TR`);
   const cast=(data.cast||[]).slice(0,12);
   const crew=data.crew||[];
   const director=crew.filter(c=>c.job==="Director");
   const writers=crew.filter(c=>["Screenplay","Writer","Story"].includes(c.job));
   const result={cast,director,writers};
   castCache[tmdbId]=result;
   return result;
 }catch(e){ return null; }
}

// tmdb film id -> {imdbId, imdbRating}: benzer/öneri kartları için bir kereliğine
// çekilir ve bellekte saklanır (TMDB external_ids + OMDb puanı). İmkansız
// durumlar da (null) kaydedilir ki aynı kartı tekrar açınca istek yinelenmesin.
const similarEnrichCache={};
async function getSimilarMovieInfo(movieId){
 if(similarEnrichCache[movieId]!==undefined) return similarEnrichCache[movieId];
 let info={imdbId:null,imdbRating:null};
 try{
   const ext=await fetchJson(`https://api.themoviedb.org/3/movie/${movieId}/external_ids?api_key=${TMDB_KEY}`);
   info.imdbId=(ext&&ext.imdb_id)?ext.imdb_id:null;
 }catch(e){ info.imdbId=null; }
 if(info.imdbId){
   try{
     const om=await fetchOmdbById(info.imdbId);
     if(om && om.imdbRating && om.imdbRating!=="N/A") info.imdbRating=om.imdbRating;
   }catch(e){ info.imdbRating=null; }
 }
 similarEnrichCache[movieId]=info;
 return info;
}

/* ---- Detay kartının arka plan görseli ve film logosu ----
   upgradeBackdropUrl: önbellekte adres w780 olarak tutuluyor; ekranda çok
   daha net dursun diye w1280 sürümü isteniyor (inmezse w780'e geri dönülür).
   setDetailBackdrop: görsel önce arka planda indirilir, ancak indikten sonra
   yerine konup yumuşakça açılır - böylece yarım inmiş/bozuk görsel görünmez. */
function upgradeBackdropUrl(url){
 return url ? String(url).replace("/t/p/w780","/t/p/w1280") : url;
}
let _detailBackdropToken=0;
function setDetailBackdrop(backdrop,posterFallback){
 const el=document.getElementById("detailBackdrop");
 if(!el) return;
 const isPoster=!backdrop;
 const url=isPoster?posterFallback:upgradeBackdropUrl(backdrop);
 if(url && el.dataset.src===url && el.classList.contains("loaded")) return; // aynı görsel - baştan açma
 const token=++_detailBackdropToken;
 el.classList.remove("loaded");
 el.classList.toggle("detail-backdrop--poster",!!isPoster);
 el.dataset.src=url||"";
 if(!url){ el.style.backgroundImage="none"; return; }
 const probe=new Image();
 probe.onload=()=>{
   if(token!==_detailBackdropToken) return;
   el.style.backgroundImage=`url('${url}')`;
   requestAnimationFrame(()=>{ if(token===_detailBackdropToken) el.classList.add("loaded"); });
 };
 probe.onerror=()=>{
   if(token!==_detailBackdropToken) return;
   if(backdrop && url!==backdrop){ el.style.backgroundImage=`url('${backdrop}')`; el.dataset.src=backdrop; el.classList.add("loaded"); }
   else { el.style.backgroundImage="none"; el.dataset.src=""; }
 };
 probe.src=url;
}

/* TMDB'nin images uç noktasındaki "logos" listesi, filmin afişindeki özgün
   yazı tipiyle hazırlanmış şeffaf arka planlı başlık görselini verir.
   ÖNCELİK: Türkçe logo (varsa) - Netflix'teki gibi kendi özel yazı tipiyle
   Türkçe başlık; yoksa filmin orijinal dilindeki logo, o da yoksa İngilizce,
   o da yoksa dilsiz (null) sürüm. */
function titleLogoUrl(path){
 if(!path) return null;
 return /\.svg$/i.test(path)
   ? `https://image.tmdb.org/t/p/original${path}`
   : `https://image.tmdb.org/t/p/w500${path}`;
}
async function fetchTitleLogo(tmdbId,originalLang){
 const orig=originalLang||"en";
 try{
   const langs=["tr",orig,"en","null"].filter((v,i,a)=>a.indexOf(v)===i).join(",");
   const d=await fetchJson(`https://api.themoviedb.org/3/movie/${tmdbId}/images?api_key=${TMDB_KEY}&include_image_language=${langs}`);
   const logos=(d&&d.logos)||[];
   if(!logos.length) return null;
   const rank=l=>{
     const lang=l.iso_639_1;
     if(lang==="tr") return 0;   // Türkçe logo - öncelikli
     if(lang===orig) return 1;   // filmin orijinal dili - afişteki hali
     if(lang==="en") return 2;
     if(!lang) return 3;         // dilsiz (yazısız/evrensel) sürüm
     return 4;
   };
   const best=logos.slice().sort((a,b)=>
     rank(a)-rank(b) || (b.vote_average||0)-(a.vote_average||0) || (b.width||0)-(a.width||0)
   )[0];
   return best?best.file_path:null;
 }catch(e){ return null; }
}
let _logoPendingTimer=null;
function clearDetailTitleLogo(){
 const img=document.getElementById("detailTitleLogo");
 const box=document.getElementById("detailTopInfo");
 if(img){ img.classList.remove("show"); img.removeAttribute("src"); }
 if(box) box.classList.remove("has-logo","logo-pending");
 clearTimeout(_logoPendingTimer);
}
// Logo olup olmadığı henüz bilinmiyorsa metin başlığı geçici olarak gizle -
// böylece "önce yazı, sonra logo" şeklindeki çirkin geçiş hiç yaşanmaz.
function markDetailTitlePending(){
 const box=document.getElementById("detailTopInfo");
 if(!box) return;
 box.classList.add("logo-pending");
 clearTimeout(_logoPendingTimer);
 _logoPendingTimer=setTimeout(resolveDetailTitlePending,2500); // ağ yavaşsa yazı yine de gelsin
}
function resolveDetailTitlePending(){
 const box=document.getElementById("detailTopInfo");
 if(box) box.classList.remove("logo-pending");
 clearTimeout(_logoPendingTimer);
}
function showDetailTitleLogo(path,title){
 const url=titleLogoUrl(path);
 if(!url){ resolveDetailTitlePending(); return; }
 const img=document.getElementById("detailTitleLogo");
 const box=document.getElementById("detailTopInfo");
 if(!img||!box) return;
 const probe=new Image();
 probe.onload=()=>{
   img.src=url; img.alt=title||"";
   box.classList.add("has-logo");      // metin başlık tamamen gizlenir
   box.classList.remove("logo-pending");
   clearTimeout(_logoPendingTimer);
   requestAnimationFrame(()=>img.classList.add("show"));
 };
 probe.onerror=()=>{ clearDetailTitleLogo(); }; // logo inmezse düz metin başlık kalır
 probe.src=url;
}
// Logo adresi önbelleğe yazılır (_logoV3), böylece aynı film ikinci kez
// açıldığında ek istek atılmadan ANINDA görünür (geçiş de olmaz); logosu
// olmayan filmler için de bir daha sorulmaz. _logoV3: önceki sürümde Türkçe
// logo tercih ediliyordu - o kayıtlar bir kereliğine yeniden seçiliyor.
async function ensureDetailTitleLogo(imdbId,tmdbId,title,originalLang){
 const cached=turkishCache[imdbId];
 if(cached && cached._logoV3){
   if(cached.logo) showDetailTitleLogo(cached.logo,title);
   else resolveDetailTitlePending();
   return;
 }
 if(!tmdbId){ resolveDetailTitlePending(); return; }
 const path=await fetchTitleLogo(tmdbId,originalLang);
 const rec=turkishCache[imdbId];
 if(rec){ rec.logo=path||null; rec._logoV3=true; delete rec._logoChecked; persistTmdbCacheSoon(); }
 if(!detailState || detailState.id!==imdbId) return;
 if(path) showDetailTitleLogo(path,title);
 else resolveDetailTitlePending();
}
// Önbelleği diske yazma yolu iki sürümde farklı (tarayıcıda localStorage,
// masaüstünde pywebview) - hangisi varsa o kullanılır.
function persistTmdbCacheSoon(){
 try{ if(typeof scheduleTmdbCacheSave==="function"){ scheduleTmdbCacheSave(); return; } }catch(e){}
 try{
   if(window.pywebview && window.pywebview.api && window.pywebview.api.save_turkish_cache){
     window.pywebview.api.save_turkish_cache(turkishCache).catch(()=>{});
   }
 }catch(e){}
}

function openDetail(id,type,fromHistory){

 if(!movie) return;
 detailState={id,type};

 const posterForBackdrop=(movie.Poster&&movie.Poster!=="N/A")?movie.Poster:(info.poster||null);
 setDetailBackdrop(info.backdrop||null,posterForBackdrop);
 clearDetailTitleLogo();
 // Önbellekte logo bilgisi varsa doğrudan doğru hâlde açılır (hiç geçiş yok);
 // yoksa logo bilgisi gelene kadar metin başlık geçici gizlenir.
 if(info._logoV3){ if(info.logo) showDetailTitleLogo(info.logo,movie.Title); }
 else markDetailTitlePending();
 document.getElementById("detailYear").textContent=movie.Year||"";
 document.getElementById("detailRuntime").textContent=(movie.Runtime&&movie.Runtime!=="N/A")?movie.Runtime:"";
 document.getElementById("detailImdbLink").onclick=()=>{openImdb(id);return false;};
 const tmdbLinkEl=document.getElementById("detailTmdbLink");
 tmdbLinkEl.style.display=info.tmdbId?"":"none";
 tmdbLinkEl.onclick=()=>{if(info.tmdbId) openExternalLink(`https://www.themoviedb.org/movie/${info.tmdbId}`);return false;};
 document.getElementById("detailTitle").textContent=movie.Title||"";
 document.getElementById("detailMyRatingIcon").innerHTML=MY_STAR_SVG_BIG;
 document.getElementById("detailImdbRating").textContent=(movie.imdbRating&&movie.imdbRating!=="N/A")?`${movie.imdbRating} / 10`:"—";
 document.getElementById("detailTrailerLink").onclick=()=>{openTrailer(id);return false;};
 document.getElementById("detailMyRating").value=(movie.myRating!=null&&movie.myRating!=="")?Number(movie.myRating).toFixed(1):"";
 document.getElementById("detailAddedDate").textContent=formatTrDate(movie._addedAt);

 document.getElementById("detailPlot").textContent=info.overview||((movie.Plot&&movie.Plot!=="N/A")?movie.Plot:"Özet bulunamadı.");

 fillDetailMoney(movie,info);

 document.getElementById("detailDirector").textContent=(movie.Director&&movie.Director!=="N/A")?movie.Director:"—";
 document.getElementById("detailWriter").textContent=(movie.Writer&&movie.Writer!=="N/A")?movie.Writer:"—";
document.getElementById("detailCastRow").innerHTML="";
  document.getElementById("detailProductionRow").innerHTML="";
  document.getElementById("detailProductionSection").style.display="none";

  document.getElementById("detailSimilarSection").style.display="none";

 const genres=movieGenresTr(movie);
 document.getElementById("detailGenres").innerHTML=genres.length?genres.map(g=>`<span class="detail-genre-tag">${escapeHtml(g)}</span>`).join(""):"";

 document.getElementById("detailModalBox").style.transform="";
 document.getElementById("detailOverlay").classList.add("open");

 // Tarayıcı geçmişine bu kartın açık olduğunu kaydet - böylece kullanıcı
 // oyuncu/IMDb/TMDB sayfasına gidip GERİ döndüğünde (telefonun geri tuşu/
 // kaydırması ile) ana sayfaya değil, tam olarak bu açık karta dönsün.
 // (fromHistory=true ise zaten bir popstate'e cevaben açıyoruzdur, tekrar
 // pushState YAPMAYIZ - yoksa geçmiş sonsuz büyür.)
 if(!fromHistory){
   history.pushState({filmDetay:{id,type}}, "");
 }

 // TMDB bilgisi (Türkçe özet/backdrop/bütçe) önbellekte yoksa açılışta bir kere çek.
 // _v7 kontrolü: PC sürümünde önbellek diske kaydedilip bir sonraki açılışta
 // geri yükleniyor - bu özellikten (tam kadro/yönetmen) ÖNCE kaydedilmiş eski
 // kayıtlarda _checked=true olsa bile _v7 yok, bu yüzden yeni veri hiç
 // gelmiyordu. _v7 eksikse karta bakılırken bir kereliğine sessizce tazelenir;
 // sonrasında normal şekilde önbellekten okunur.
 const infoPromise=(!turkishCache[id] || !turkishCache[id]._checked || !turkishCache[id]._v7 || !turkishCache[id]._v8)
   ? getTurkishInfo(id,movie.Title,movie.Year)
   : Promise.resolve(info);

 infoPromise.then(freshInfo=>{
   if(detailState.id!==id) return; // kullanıcı bu arada kapattı/başka filme geçti
   if(freshInfo.backdrop) setDetailBackdrop(freshInfo.backdrop,posterForBackdrop);
   ensureDetailTitleLogo(id,freshInfo.tmdbId,movie.Title,freshInfo.originalLanguage);
   if(freshInfo.overview) document.getElementById("detailPlot").textContent=freshInfo.overview;
     fillDetailMoney(movie,freshInfo);
   tmdbLinkEl.style.display=freshInfo.tmdbId?"":"none";
   tmdbLinkEl.onclick=()=>{if(freshInfo.tmdbId) openExternalLink(`https://www.themoviedb.org/movie/${freshInfo.tmdbId}`);return false;};
   renderCompanyRow(freshInfo.productionCompanies);

   if(!freshInfo.tmdbId){document.getElementById("detailSimilarSection").style.display="none";return;}
   loadCastForDetail(freshInfo.tmdbId).then(castInfo=>{
     if(detailState.id!==id || !castInfo) return;
     renderPersonPhotoRow("detailDirector",castInfo.director,false);
     renderPersonPhotoRow("detailWriter",castInfo.writers,false);
     renderCastRow(castInfo.cast);
     prefetchPersonImdbIds(castInfo);
   });
   loadSimilarMovies(freshInfo.tmdbId);
 }).catch(()=>{});
}

// Oyuncu/yönetmen/senarist kartlarına dokununca IMDb sayfasının HEMEN (senkron)
// açılabilmesi için, kadro yüklenir yüklenmez bu kişilerin IMDb kimliklerini
// arka planda sessizce önceden çekip önbelleğe alır. Böylece kullanıcı bir
// karta dokunduğunda artık "await" beklemeye gerek kalmıyor - Safari'nin bunu
// güvenilir bir kullanıcı hareketi olarak görmesi için kritik olan senkron
// window açma şartı sağlanmış oluyor (bkz. openPersonPage).
async function prefetchPersonImdbIds(castInfo){
 const people=[...(castInfo.cast||[]),...(castInfo.director||[]),...(castInfo.writers||[])];
 for(const p of people){
   if(personExternalIdCache[p.id]!==undefined) continue;
   await getPersonImdbId(p.id);
   await new Promise(res=>setTimeout(res,60)); // TMDB'yi art arda çok hızlı yormamak için ufak bir ara
 }
}

// Kullanıcı Kapat/X/kaydırma ile kapatıyor: SADECE bir geri gidiyoruz,
// gerçek kapanma (arayüzü gizleme) popstate olayında, syncOverlaysToHistory
// içinde tek bir yerden yapılıyor - böylece "X'e basarak kapatma" ile
// "telefonun geri tuşuyla kapatma" arasında hiçbir fark kalmıyor, ikisi de
// aynı kod yolundan geçiyor.
function closeDetail(){
 if(history.state && history.state.filmDetay && history.state.filmDetay.id===detailState.id){
   history.back();
 }else{
   closeDetailUI();
 }
}

function closeDetailUI(){
 document.getElementById("detailOverlay").classList.remove("open");
 detailState={id:null,type:null};
 const modal=document.getElementById("detailModalBox");
 if(modal){ modal.style.transition="none"; modal.style.transform=""; modal.style.opacity=""; }
}

// Tarayıcı geçmişi ile açık kart arayüzünü senkronize eder. Hem telefonun
// geri tuşuna/kaydırmasına basıldığında hem de sayfa IMDb/TMDB ziyaretinden
// SONRA sıfırdan yeniden yüklendiğinde (bfcache kaçırıldığında) çalışır.
function syncOverlaysToHistory(){
 const wanted=history.state && history.state.filmDetay;
 if(wanted){
   if(detailState.id!==wanted.id){
     // Film verisi henüz gelmediyse (ör. Firestore/localStorage yüklenmeden
     // önce geri tuşuna basıldıysa) veri gelince tekrar denenecek - bkz. init.
     const exists=(allData[wanted.type]||[]).some(m=>m.imdbID===wanted.id);
     if(exists) openDetail(wanted.id, wanted.type, true);
   }
 }else if(document.getElementById("detailOverlay").classList.contains("open")){
   closeDetailUI();
 }
}
window.addEventListener("popstate", syncOverlaysToHistory);

function saveDetailChanges(){
 const {id,type}=detailState;
 if(!id) return;
 const rawRating=document.getElementById("detailMyRating").value.trim();

 let myRating=null;
 if(rawRating){
   const r=parseFloat(rawRating.replace(",","."));
   if(!isNaN(r)) myRating=Math.max(0,Math.min(10,r));
 }

 // Optimistic: yerel veriyi hemen güncelle, listeyi tazele (Kendi Puanım sıralaması etkilenebilir).

 if(movie){
   movie.myRating=myRating;

 db.collection(type).doc(id).update({myRating,_updatedAt:movie?movie._updatedAt:Date.now()}).catch(e=>console.error(e));
}

// iOS benzeri: detay ekranında sağa kaydırarak kapatma.
// Tamamen kendi JS'imizle yapılıyor ve yatay hareket kesinleşince
// preventDefault() ile tarayıcının/telefonun kendi "kenardan geri" jestini
// devre dışı bırakıyoruz - önceki sürümdeki kısa kararma/boşluk sıçraması
// bu iki animasyonun (bizimki + tarayıcının) aynı anda çalışmasından kaynaklanıyordu.
(function(){
 const modal=document.getElementById("detailModalBox");
 if(!modal) return;
 let startX=null,startY=null,dragging=false,horizontal=false;

 modal.addEventListener("touchstart",e=>{
   if(e.touches.length!==1) return;
   startX=e.touches[0].clientX; startY=e.touches[0].clientY;
   dragging=true; horizontal=false;
   modal.style.transition="none";
 },{passive:true});

 modal.addEventListener("touchmove",e=>{
   if(!dragging||startX===null) return;
   const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
   if(!horizontal && Math.abs(dx)>8){
     horizontal = Math.abs(dx)>Math.abs(dy);
   }
   if(horizontal && dx>0){
     e.preventDefault(); // native geri-kaydırma jestiyle çakışmayı önler
     const clamped=Math.min(dx,window.innerWidth);
     modal.style.transform=`translateX(${clamped}px)`;
     modal.style.opacity=String(Math.max(1-clamped/(window.innerWidth*0.9),0.15));
   }
 },{passive:false});

 modal.addEventListener("touchend",e=>{
   if(!dragging||startX===null){ dragging=false; return; }
   const dx=(e.changedTouches[0].clientX-startX);
   const dy=(e.changedTouches[0].clientY-startY);
   dragging=false; startX=null; startY=null;
   if(horizontal && dx>90 && Math.abs(dy)<120){
     closeDetail(); // anında kapat, ekstra animasyon/karartma yok
   }else{
     modal.style.transition="transform .18s ease,opacity .18s ease";
     modal.style.transform=""; modal.style.opacity="";
     setTimeout(()=>{ if(modal) modal.style.transition="none"; },200);
   }
   horizontal=false;
 },{passive:true});
})();

async function backfillGenres(){
 let changed=false;
 for(const type of ["watched","watchlist"]){
   for(const m of allData[type]){
     if((!m.Genre || m.Genre==="N/A") && m.imdbID){
       try{
         const info=await fetchOmdbById(m.imdbID);
         if(info.Response==="True" && info.Genre && info.Genre!=="N/A"){
           m.Genre=info.Genre;
           await db.collection(type).doc(m.imdbID).update({Genre: info.Genre});
           changed=true;
         }
       }catch(e){}
     }
   }
 }
 if(changed){ render(); saveToCache(); }
}

/* ===================== İÇE / DIŞA AKTAR ===================== */

async function handleImportFile(file){
 if(!file) return;
 const statusEl=document.getElementById("syncStatus");
 try{
   const text=await file.text();
   const data=JSON.parse(text);
   const items=[];
   for(const type of ["watched","watchlist"]){
     (data[type]||[]).forEach((m,i)=>{ if(m.imdbID) items.push({type,m,i}); });
   }
   const base=Date.now()-items.length*1000;
   let n=0;
   for(let i=0;i<items.length;i+=400){
     const chunk=items.slice(i,i+400);
     const batch=db.batch();
     chunk.forEach((item,idx)=>{
       item.m._addedAt=base+(i+idx)*1000;
       batch.set(db.collection(item.type).doc(item.m.imdbID), item.m);
     });
     await batch.commit();
     n+=chunk.length;
     if(statusEl) statusEl.textContent=`İçe aktarılıyor… ${n}/${items.length}`;
   }
   alert(`İçe aktarma tamamlandı: ${n} film eklendi.`);
   reload();
 }catch(e){
   console.error(e);
   alert("İçe aktarma başarısız oldu: "+e.message);
 }
}

function exportData(){
 const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url; a.download="movies_backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

function isScrollContainer(el){
 return el && el.scrollHeight > el.clientHeight + 2;
}

function scrollToTop(type){
 const container=(type==="watchlist"?watchList:watchedList).closest(".column");
 if(isScrollContainer(container)){
   container.scrollTo({top:0,behavior:"smooth"});
 } else {
   container.scrollIntoView({behavior:"smooth",block:"start"});
 }
}

// Tek liste odak modu: her zaman ya İzlenen ya da İzlenecek gösterilir,
// "ikisi birden" diye bir ara durum yok. Buton tek tıkla direkt diğerine geçirir.
function currentFocus(){
 const html=document.documentElement;
 if(html.classList.contains("focus-watchlist")) return "watchlist";
 return "watched"; // varsayılan / bilinmeyen durum
}

function toggleFocus(){
 // PC'de bölünmüş ekran her zaman korunur; bu buton (ve tek liste modu)
 // sadece dar/mobil ekranda anlamlıdır.
 if(!window.matchMedia("(max-width:700px)").matches) return;
 const html=document.documentElement;
 const next=currentFocus()==="watched"?"watchlist":"watched";
 html.classList.remove("focus-watched","focus-watchlist");
 html.classList.add("single-focus","focus-"+next);
 localStorage.setItem("filmarsivi_focus",next);
}

function toggleView(type){
 // Mobilde kartları yan yana (2'li) gösteren "ızgara" görünümü dar ekrana
 // sığmadığından bu buton mobilde zaten gizli; yine de programatik bir
 // çağrı gelirse (örn. eski bir kısayol) burada da no-op yapıyoruz.
 if(window.matchMedia("(max-width:700px)").matches) return;
 viewState[type]=viewState[type]==="list"?"grid":"list";
 const listEl=type==="watchlist"?watchList:watchedList;
 listEl.classList.toggle("grid-view",viewState[type]==="grid");
}

// Açılışta önce önbellekten (localStorage) ANINDA göster - buluta hiç
// dokunmadan. Firestore okuma kotasını boşuna tüketmemek için otomatik
// yenileme tamamen kaldırıldı; buluta sadece 🔄'ye basınca dokunuluyor.
// (Hiç önbellek yoksa - ilk açılış - bir kereliğine buluttan çekiyoruz.)
// TMDB bilgilerini diskten (localStorage) yükle - film listesinden ÖNCE,
// böylece ilk çizimde ve istatistiklerde tam kadro/tür bilgisi hazır olur.
loadTmdbCache();
if(!loadFromCache()){
 reload().then(()=>{ syncOverlaysToHistory(); });
}else{
 const statusEl=document.getElementById("syncStatus");
 if(statusEl) statusEl.textContent="";
 // Sayfa, açık bir film kartıyla history state'i varken (ör. IMDb/TMDB
 // ziyaretinden dönüşte) sıfırdan yeniden yüklenmiş olabilir - veri artık
 // hazır olduğuna göre ilgili kartı hemen geri aç.
 syncOverlaysToHistory();
}
