<script>
// Tek liste odak modu SADECE telefonda (dar ekran) uygulanır: telefonda HER
// ZAMAN sadece "İzlenen" ya da sadece "İzlenecek" listesi tam ekran gösterilir
// (ikisi birden dar telefon ekranında çok küçük kalıyordu). PC'de bu mod hiç
// devreye girmez - iki liste her zaman yan yana (bölünmüş ekran) gösterilir.
// "İkisi birden" diye bir ara durum YOK (mobilde) - üstteki ⇄ butonu direkt
// diğerine geçirir. Seçim localStorage'da saklanır, bir dahaki açılışta hatırlanır.
(function(){
 var MOBILE_QUERY="(max-width:700px)";
 function isMobile(){ return window.matchMedia(MOBILE_QUERY).matches; }
 function apply(){
   var html=document.documentElement;
   if(isMobile()){
     var params=new URLSearchParams(location.search);
     var focus=localStorage.getItem("filmarsivi_focus");
     if(params.get("buyuk")==="izlenen") focus="watched"; // eski kısayol - hâlâ çalışır
     if(focus!=="watched" && focus!=="watchlist") focus="watched"; // varsayılan
     html.classList.add("single-focus","focus-"+focus);
   } else {
     html.classList.remove("single-focus","focus-watched","focus-watchlist");
   }
 }
 apply();
 // Pencere mobil<->masaüstü eşiğini geçecek şekilde yeniden boyutlanırsa
 // (örn. tarayıcı penceresi daraltılıp genişletilirse) modu canlı güncelle.
 if(window.matchMedia){
   var mq=window.matchMedia(MOBILE_QUERY);
   if(mq.addEventListener) mq.addEventListener("change",apply);
   else if(mq.addListener) mq.addListener(apply); // eski tarayıcı desteği
 }
})();
</script>
<title>Film Arşivi</title>
<style>
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain}
body{font-family:Arial;background:#111;color:#eee;margin:0}
/* İstatistik penceresi (veya üstündeki film/kişi listesi) açıkken arka
   plandaki ana sayfanın telefonda AYNI ANDA kaymasını engeller - bkz.
   _lockBackgroundScroll/_unlockBackgroundScroll. PC'de zaten .column kendi
   içinde kaydığından (body kaymaz) bu kuralın PC'de görünür bir etkisi yok. */
html.stats-modal-open,html.stats-modal-open body{overflow:hidden}
.container{display:flex;height:100vh}
/* scrollbar-gutter:stable: PC'de iki sütun yan yanayken, biri kaydırma
   çubuğu gerektirip diğeri gerektirmediğinde (örn. biri diğerinden uzun
   liste), kaydırma çubuğunun kapladığı ~15px genişlik yüzünden kartlar
   (width:95%) iki sütunda farklı boyut görünüyordu. Her iki sütunda da bu
   alan hep ayrılınca kartlar her zaman eşit boyutta kalır. */
.column{width:50%;padding:0;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sticky-header{position:sticky;top:0;padding:20px 20px 10px 20px;background:#111;z-index:5;border-bottom:1px solid #222}
.list-wrap{padding:0 20px 20px 20px}
.column:first-child{border-right:2px solid #444}
h2{text-align:center;margin-bottom:10px;font-size:20px}
.list-header{display:flex;align-items:center;width:95%;margin:0 auto 14px auto;padding:13px 16px;border-radius:10px;background:#222}
.list-header-brand{display:flex;align-items:center}
.stat-icon{width:38px;height:38px;border-radius:50%;background:var(--acc-bg);color:var(--acc-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px}
.stat-icon svg{width:19px;height:19px}
.list-header-title{font-weight:700;color:#eee;font-size:17px;white-space:nowrap;margin-right:12px}
.list-header-meta{color:#999;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-header-meta b{color:#ccc;font-weight:700}
.list-header-meta svg{width:13px;height:13px;vertical-align:-1px;margin:0 1px 0 8px;opacity:.8}
.list-header--watched{--acc-bg:rgba(217,164,65,0.16);--acc-fg:#e8c877}
.list-header--watchlist{--acc-bg:rgba(79,168,232,0.16);--acc-fg:#7ec1f2}
.header-icons{display:flex;align-items:center;flex-shrink:0;margin-left:10px}
.header-icons .icon-btn{margin-left:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#2c2c2c;color:#999;cursor:pointer;user-select:none;transition:background .15s ease,color .15s ease}
.icon-btn:hover,.icon-btn:active{background:#383838;color:#e8c877}
.icon-btn svg{width:18px;height:18px;pointer-events:none}
.icon-btn.spinning svg{animation:icon-spin 0.8s linear infinite}
@keyframes icon-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.search{width:95%;padding:10px;margin:0 auto 8px auto;display:block;background:#333;color:#eee;border:1px solid #555;border-radius:4px;font-size:16px}
.sort-select{padding:6px 8px;font-size:13px;background:#222;color:#ccc;border:1px solid #444;border-radius:4px}
.movie{width:95%;display:flex;align-items:center;margin:0 auto 15px auto;background:#222;padding:12px 16px;border-radius:8px;position:relative}
.movie img{width:110px;height:165px;object-fit:cover;margin-right:15px;border-radius:4px}
.movie img.poster-link{cursor:pointer}
.btn{margin-top:6px;padding:6px 12px;background:#555;color:#fff;border:none;border-radius:4px;cursor:pointer}
.add-poster{cursor:pointer}
.add-hint{font-size:11px;color:#888;margin-top:4px}
.movie{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.movie img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;user-drag:none;-webkit-touch-callout:none}
.dragging-source{opacity:0.35}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:0.9;box-shadow:0 6px 18px rgba(0,0,0,0.6);margin:0 !important}
.drop-indicator{width:95%;height:3px;margin:6px auto;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(217,164,65,0.25),#d9a441,#fff,#d9a441,rgba(217,164,65,0.25),transparent);background-size:200% 100%;animation:drop-shimmer 1.2s linear infinite;box-shadow:0 0 8px rgba(217,164,65,0.45)}
@keyframes drop-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.movie.drop-gap-before{margin-top:28px !important;transition:margin-top 0.12s ease}
.movie.drop-gap-after{margin-bottom:28px !important;transition:margin-bottom 0.12s ease}
.tick-btn{position:absolute;top:38px;right:10px;background:#333;color:#0f0;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.delete-btn{position:absolute;top:10px;right:10px;background:#333;color:#bbb;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.meta{font-size:13px;color:#bbb;margin-top:3px}
.money-budget,.money-revenue{color:#bbb}
.money-budget:empty,.money-revenue:empty{display:none}
.my-rating-line:empty{display:none}
.my-rating-line .my-star{color:#4fa8e8}
.meta-icon{display:inline-flex;width:16px;justify-content:center;align-items:center;vertical-align:-3px}
.tr-title{color:#888;font-size:13px;margin-top:2px}
.controls{width:95%;margin:0 auto 10px auto;display:flex;flex-wrap:wrap;gap:8px}
.controls .sort-select{flex:1 1 130px;min-width:110px}
.findbox{width:95%;padding:8px;margin:0 auto 12px auto;display:block;background:#222;color:#eee;border:1px solid #444;border-radius:4px;font-size:14px}
.find-row{width:95%;margin:0 auto 12px auto;position:relative;display:flex;align-items:center;gap:6px}
.find-row .findbox{width:auto;flex:1;margin:0}
.find-count{font-size:12px;color:#888;white-space:nowrap;padding:0 2px;display:none}
.find-nav-btn{flex-shrink:0;width:28px;height:28px;border-radius:5px;background:#2a2a2a;border:1px solid #444;color:#ccc;display:none;align-items:center;justify-content:center;font-size:14px;cursor:pointer;user-select:none}
.find-nav-btn:active{background:#3a3a3a}
.find-row.has-matches .find-nav-btn{display:flex}
.find-row.has-matches .find-count{display:inline-block}
.movie.highlight{outline:3px solid #ffd700;box-shadow:0 0 14px #ffd700}
.movie.find-hidden{display:none!important}
.person-link{color:inherit;text-decoration:none;cursor:pointer}
.person-link:hover{color:#d9a441;text-decoration:underline}

#watchedList.grid-view,#watchList.grid-view{width:95%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 15px;align-items:start}
.grid-view .movie{width:100%;margin:0;min-width:0;overflow:hidden}
.grid-view .movie img{width:72px;height:108px;margin-right:10px;flex-shrink:0}
.grid-view .movie>div{min-width:0;overflow-wrap:break-word}

.sync-bar{width:95%;margin:0 auto 10px auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-bar button{padding:6px 10px;background:#333;color:#eee;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:12px}
.sync-bar button:hover{opacity:0.8}
.sync-status{font-size:12px;color:#888}
@media (max-width:700px){
 .container{display:block;height:auto;min-height:100vh}
 .column{width:100%;overflow:visible}
 .column:first-child{border-right:none;border-bottom:2px solid #444}
 .sticky-header{padding:6px 12px 5px 12px}
 .list-header{padding:11px 14px;margin-bottom:10px}
 .list-header-title{font-size:16px}
 .stat-icon{width:34px;height:34px;margin-right:10px}
 .stat-icon svg{width:17px;height:17px}
 .list-header-meta{font-size:13px}
 .icon-btn{width:32px;height:32px}
 .icon-btn svg{width:16px;height:16px}
 /* Kartları yan yana (2'li) gösteren ızgara görünümü dar telefon ekranında
    sığmadığı için mobilde bu özelliği tamamen kaldırıyoruz: buton gizli,
    liste her zaman tek sütun (normal) görünümde kalıyor. */
 .grid-toggle-btn{display:none}
 #watchedList.grid-view,#watchList.grid-view{display:block}
 .grid-view .movie{width:95%;margin:0 auto 10px auto}
 .grid-view .movie img{width:92px;height:138px;margin-right:10px}
 h2{font-size:13px;margin-bottom:4px}
 .search{padding:5px 8px;font-size:14px;margin-bottom:4px}
 .controls{gap:4px;margin-bottom:4px}
 .controls .sort-select{flex:1 1 47%;min-width:0;font-size:11px;padding:3px 5px}
 .findbox{padding:4px 8px;font-size:12px;margin-bottom:0}
 .list-wrap{padding:0 12px 12px 12px}
 .movie{padding:8px 10px;margin:0 auto 10px auto}
 .movie img{width:92px;height:138px;margin-right:10px}
 .sync-bar{padding:5px 12px 0 12px!important;gap:6px}
 .sync-bar button{font-size:11px;padding:4px 7px}
 .sync-status{font-size:11px}
}
/* Yatay (landscape) telefon: dikey alan az, üst bloğu daha da sıkıştır */
@media (max-width:700px) and (orientation:landscape){
 .sticky-header{padding:4px 12px 3px 12px}
 h2{font-size:12px;margin-bottom:3px}
 .search{padding:3px 6px;font-size:13px;margin-bottom:3px}
 .controls{gap:3px;margin-bottom:3px}
 .controls .sort-select{font-size:10px;padding:2px 4px}
 .findbox{padding:3px 6px;font-size:11px}
 .sync-bar{padding:3px 12px 0 12px!important}
}
/* ===================== TEK LİSTE ODAK MODU (SADECE mobilde, ikisi birden küçük kaldığında) =====================
   Bu kurallar bilinçli olarak 700px altı ekranla sınırlı: PC'de bölünmüş
   (iki sütunlu) görünüm her zaman korunur, tek liste moduna hiç geçilmez. */
@media (max-width:700px){
 /* header'daki ⇄ butonuna basınca ya da eski ?buyuk=izlenen linkiyle aktif olur */
 html.focus-watched .column[data-type="watchlist"]{display:none}
 html.focus-watchlist .column[data-type="watched"]{display:none}
 html.single-focus .column{width:100%}
 html.single-focus h2{font-size:22px}
 html.single-focus .search{font-size:20px;padding:12px}
 html.single-focus .findbox{font-size:18px;padding:10px}
 html.single-focus .controls .sort-select{font-size:16px;padding:8px 10px}
 html.single-focus .movie{padding:16px 14px}
 html.single-focus .movie img{width:130px;height:195px}
 html.single-focus .movie b{font-size:19px}
 html.single-focus .movie .meta{font-size:16px}
 html.single-focus .movie .tr-title{font-size:16px}
 .list-header-brand{cursor:pointer}
}

/* ===================== DETAY MODALI (afişe/karta tıklayınca açılır) ===================== */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.detail-overlay.open{display:flex}
.detail-modal{position:relative;width:100%;max-width:820px;background:#181818;border:1px solid #3a3222;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);touch-action:pan-y}
/* Arka plan görseli: eskiden TMDB'nin w780 sürümü blur(2px)+brightness(0.5)
   ile hem bulanıklaştırılıp hem karartılıyordu - sonuç soluk ve netliksizdi.
   Artık yüksek çözünürlüklü (w1280) sürüm çekiliyor, bulanıklık kaldırıldı,
   renk hafif doygunlaştırıldı; karartma yerine Netflix'teki gibi alta ve
   kenarlara doğru yumuşak geçişli degradeler var (yazı okunurluğu korunuyor).
   Görsel indiğinde yumuşakça belirip çok yavaş bir yakınlaşma yapıyor. */
.detail-backdrop{position:absolute;top:0;left:0;right:0;height:380px;background-size:cover;background-position:center 20%;z-index:0;opacity:0;transform:scale(1.07);transition:opacity .6s ease;filter:saturate(1.15) contrast(1.04)}
/* Görsel yüklenince belirir ve GIF gibi durmadan, göz ardı edilemeyecek
   kadar belirgin biçimde yavaşça yakınlaşıp-uzaklaşır ve hafifçe kayar -
   "canlı" bir arka plan hissi. Öncekinden (22s, %8) daha hızlı ve daha
   geniş bir harekete çekildi çünkü eski hâli neredeyse fark edilmiyordu. */
.detail-backdrop.loaded{opacity:1;animation:detailBackdropBreathe 13s ease-in-out infinite}
@keyframes detailBackdropBreathe{
 0%{transform:scale(1) translate(0,0)}
 50%{transform:scale(1.13) translate(-1.6%,-1.1%)}
 100%{transform:scale(1) translate(0,0)}
}
/* TMDB'de geniş görsel yoksa afişin kendisine düşülüyor; dikey afiş enine
   gerilince çirkin durduğu için SADECE o durumda güçlü bulanıklık uygulanır -
   bu sürümde nefes animasyonu yok, sabit büyütülmüş kalır. */
.detail-backdrop--poster{filter:blur(26px) saturate(1.25) brightness(.72)}
.detail-backdrop--poster.loaded{animation:none;transform:scale(1.18)}
.detail-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,24,24,0) 0%,rgba(24,24,24,0.30) 42%,rgba(24,24,24,0.82) 78%,#181818 100%),linear-gradient(90deg,rgba(24,24,24,0.72) 0%,rgba(24,24,24,0.10) 48%,rgba(24,24,24,0.50) 100%)}
/* Filmin kendi logosu (TMDB "title treatment" görseli): her filmin afişindeki
   özgün yazı tipiyle hazırlanmış, arka planı şeffaf logo. Varsa düz metin
   başlığın yerine bu gösterilir - Netflix'teki gibi her film kendi fontuyla. */
.detail-title-logo{display:none;max-width:min(100%,380px);max-height:110px;object-fit:contain;object-position:left bottom;margin:6px 0 4px 0;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.8));opacity:0;transition:opacity .3s ease}
.detail-title-logo.show{display:block;opacity:1}
.detail-top-info.has-logo .detail-title{display:none}
/* Logo olup olmadığı BELLİ OLANA KADAR düz metin başlık gizli tutulur (yeri
   korunur) - eskiden önce normal font görünüp sonra logoya dönüşüyordu ve bu
   geçiş kötü duruyordu. Logosu olmayan filmlerde metin anında geri gelir;
   ağ yavaşsa emniyet zamanlayıcısı 2.5 sn sonra metni yine de gösterir. */
.detail-top-info.logo-pending .detail-title{visibility:hidden}
.detail-title{min-height:34px}
/* Kapat butonu: poster kalkıp backdrop görüntüsü tam ekran öne çıkınca
   görselin üstünde çıplak kalmasın diye hafif bulanık/camsı bir zemin var. */
.detail-close{position:absolute;top:14px;right:16px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#eee;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .15s ease}
.detail-close:hover{background:rgba(0,0,0,0.7)}
/* Üst blok: afiş kaldırıldı (ana sayfada zaten görünüyor). SADECE film adı
   (ve varsa logosu) görselin üstünde, en altına yaslı duruyor - tıpkı
   eskiden olduğu gibi. .detail-hero, backdrop ile AYNI yükseklikte ve normal
   akışta (position:relative) olduğu için kendinden sonra gelen içeriği
   (yıl/süre/butonlar, puanlar vb.) görselin ALTINA iter; hiçbir şey görselin
   üzerine bindirilmez. */
.detail-hero{position:relative;z-index:1;height:380px;display:flex;align-items:flex-end;padding:0 24px 22px 24px}
.detail-top-info{width:100%;min-width:0}
/* Yıl/süre/Fragman/IMDb/TMDB satırı artık görselin DIŞINDA, normal koyu
   gövde renginde - .detail-body içine taşındı (bkz. HTML). */
.detail-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 4px 0}
.detail-badge{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#ccc;padding:5px 11px;border-radius:5px;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center}
/* Fragman: birincil "oynat" hissi veren dolu buton. IMDb/TMDB ise onun
   yanında daha sakin, ikincil ikon-metin butonlar olarak duruyor. */
/* Fragman metni ("▶ Fragman") IMDb/TMDB'den daha uzun olduğu için, aynı
   padding olsa bile kutu doğal olarak daha geniş çıkıyordu. Üçü de sabit
   min-width ile ortalanmış metinle aynı boyuta getirildi. */
.detail-link-btn{text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:bold;border:1px solid transparent;transition:filter .15s ease,transform .1s ease;min-width:92px}
.detail-link-btn:active{transform:scale(0.97)}
.detail-trailer-link{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);color:#e8c877}
.detail-trailer-link:hover{background:rgba(255,255,255,0.14)}
.detail-imdb-link{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);color:#e8c877}
.detail-imdb-link:hover{background:rgba(255,255,255,0.14)}
.detail-tmdb-link{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);color:#5fc8ee}
.detail-tmdb-link:hover{background:rgba(255,255,255,0.14)}
.detail-title{margin:0 0 2px 0;font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.7);text-align:left}
.detail-body{position:relative;z-index:1;padding:0 24px 24px 24px}
.detail-ratings-row{display:flex;gap:14px;margin-bottom:16px}
.detail-rating-box{flex:1;display:flex;align-items:center;gap:10px;background:#222;border:1px solid #3a3222;border-radius:8px;padding:10px 14px}
.detail-rating-icon{font-size:20px;width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(217,164,65,0.14);color:#e8c877}
.detail-rating-icon.my-rating-icon{background:rgba(79,168,232,0.14);color:#4fa8e8}
.detail-rating-label{font-size:12px;color:#999}
.detail-rating-value{font-size:19px;font-weight:bold;color:#e8c877}
.detail-my-rating-col{flex:1;min-width:0}
.detail-my-rating-wrap{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.detail-my-rating{width:56px;background:#181818;color:#4fa8e8;border:1px solid #4fa8e8;border-radius:6px;padding:5px 6px;font-size:18px;font-weight:bold;text-align:center}
.detail-my-rating:focus{outline:none;border-color:#7cc3f0;box-shadow:0 0 0 2px rgba(79,168,232,0.3)}
.detail-my-rating::placeholder{color:#4a6a80;font-weight:normal}
.detail-my-rating::-webkit-inner-spin-button,.detail-my-rating::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.stats-nav-wrap{flex-shrink:0;background:#181818;border-bottom:1px solid #2a2a2a;padding:10px 24px 0 24px}

/* Üstteki 30px boşluk overlay'in kendi padding'inden geliyordu; sticky topbar
   (bir alt satırdaki .stats-list-topbar) kayan kapsayıcının padding'ine göre
   sabitlendiği için bu boşluğu asla geçemiyor, aşağı kaydırınca da üstte
   kalıcı bir boşluk bırakıp arkadaki film kartlarının kesik görünmesine yol
   açıyordu. Boşluğu overlay'in padding'inden değil, modal'ın margin'inden

   ekranın en tepesine tam yaslanır. */

function statsYearOf(m){

function statsInitials(name){

// TMDB'den çekilen yapım ülkesi listesi (turkishCache) varsa o kullanılır -
// OMDb'nin "Country" alanı bazen eksik/tek ülkeyle sınırlı kalabiliyor.
// TMDB verisi henüz önbellekte yoksa OMDb alanına geri düşülür; o da yoksa
// (eski kayıtlar) böyle filmler ülkeyle ilgili istatistiklerde sessizce atlanır.
function movieCountries(m){

 if(info && info.countryNames && info.countryNames.length) return uniqueNames(info.countryNames);
 return uniqueNames((m.Country||"").split(","));

function imdbVotesNum(m){
 if(!m.imdbVotes||m.imdbVotes==="N/A") return null;
 const n=parseInt(String(m.imdbVotes).replace(/[^0-9]/g,""),10);
 return isNaN(n)?null:n;
}
// Sıralı bir sayı dizisinde p. yüzdelik (lineer enterpolasyonlu) değeri.
function statsPercentile(sortedVals,p){
 const n=sortedVals.length;
 if(!n) return null;
 if(n===1) return sortedVals[0];
 const idx=(p/100)*(n-1);
 const lo=Math.floor(idx), hi=Math.ceil(idx);
 if(lo===hi) return sortedVals[lo];
 return sortedVals[lo]+(sortedVals[hi]-sortedVals[lo])*(idx-lo);
}
function statsScrollTo(id){

function renderStats(){
 // statsPeopleData/statsBreakdownData önbellekleri HER renderStats() çağrısının
 // başında sıfırlanır: bu veriler turkishCache'e (TMDB'den akan oyuncu/yönetmen/
 // tür bilgisi) bağlıdır ve turkishCache, allData.watched'ın dizi referansı
 // DEĞİŞMEDEN de arka planda güncellenebilir (preloadInfo). Önbellek renderStats
 // çağrıları ARASINDA taşınırsa sayılar bayatlar/güncellenmez; bu yüzden sadece
 // AYNI render içindeki tekrarlı çağrılar (En'ler + Oyuncular/Yönetmenler/Türler
 // bölümlerinin aynı veriyi 2'şer kez hesaplaması) paylaşılır, sonraki render
 // her zaman taze veriyle çalışır.
 _statsPeopleDataCache=new WeakMap();
 _statsBreakdownDataCache=new WeakMap();
 // İstatistikler AYNI filmi iki kez saymasın diye izlenen listesi imdbID'ye
 // göre tekilleştirilir (yanlışlıkla iki kez eklenmiş kayıtlar vardı).
 const movies=statsUniqueMovies(allData.watched||[]);
 const body=document.getElementById("statsBody");
 if(!movies.length){
   body.innerHTML='<div class="stats-empty stats-empty--main">Henüz izlenen film yok - istatistikler burada görünecek.</div>';
   return;
 }
 // Bölümler arası tıklanabilir film listesi haritalarının önceki render'dan
 // kalma veri taşımaması için her renderStats çağrısında sıfırlanır; ilgili
 // bölüm fonksiyonları kendi anahtarlarını (genre/country/runtimeCategory)
 // aşağıda TEK TEK atar (nesnenin tamamını DEĞİŞTİRMEZLER), böylece aynı
 // render turunda birbirlerinin verisini silmezler.
 statsBreakdownMoviesMap={};
 const sections=[
   {id:"stats-sec-super",label:"En'ler",html:statsSectionSuperlatives(movies)},
   {id:"stats-sec-ratingdist",label:"Puan Dağılımı",html:statsSectionRatingDistribution(movies)},
   {id:"stats-sec-decades",label:"On Yıllar",html:statsSectionDecades(movies)},
   {id:"stats-sec-runtime",label:"Süre",html:statsSectionRuntime(movies)},
   {id:"stats-sec-genres",label:"Türler",html:statsSectionBreakdown(movies)},
   {id:"stats-sec-taste",label:"Zevk Analizi",html:statsSectionTasteInsights(movies)},
   {id:"stats-sec-dna",label:"Film DNA",html:statsSectionDNA(movies)},
   {id:"stats-sec-directors",label:"Yönetmenler",html:statsSectionPeople(movies,"director")},
   {id:"stats-sec-actors",label:"Oyuncular",html:statsSectionPeople(movies,"actor")},
   {id:"stats-sec-pairs",label:"İkililer",html:statsSectionPairs(movies)},
   {id:"stats-sec-companies",label:"Yapım Şirketleri",html:statsSectionCompanies(movies)}
 ].filter(s=>s.html && s.html.trim());
 const nav = sections.length>1
   ? `<div class="stats-nav">`+sections.map(s=>`<span class="stats-nav-btn" onclick="statsScrollTo('${s.id}')">${escapeHtml(s.label)}</span>`).join("")+`</div>`
   : "";
 const navWrap=document.getElementById("statsNavWrap");
 if(navWrap) navWrap.innerHTML=nav;
 // TMDB'den tam kadro/yönetmen bilgisi henüz inmemiş film varsa sayılar
 // eksik kalır (ve veri indikçe değişir) - kullanıcıya bunu açıkça söylüyoruz.
 const pending=statsPendingInfoCount(movies);
 // TMDB'de eşleşmeyen filmlerde tam kadro yerine OMDb'nin sadece birkaç
 // başrol ismini veren listesi kullanılıyor - bu filmlerde küçük roller
 // (ör. konuk oyuncular) hiç sayılamıyor. Sayılar beklenmedik çıktığında
 // sebebi genelde budur, o yüzden açıkça yazıyoruz.
 const limited=movies.filter(m=>{
   const c=turkishCache[m.imdbID];
   return !(c && c.castNames && c.castNames.length);
 }).length;
 const pendingNote = (pending
   ? `<div class="stats-pending-note">⏳ ${pending} filmin tam kadro/yönetmen bilgisi henüz yükleniyor - sayılar yükleme bitince kendiliğinden güncellenecek.</div>`
   : "") + ((!pending && limited)
   ? `<div class="stats-pending-note">ℹ️ ${limited} film TMDB'de eşleşmediği için tam kadrosu yok; bu filmlerde yalnızca başroldeki birkaç oyuncu sayılabiliyor (küçük roller/konuk oyuncular sayılmıyor).</div>`
   : "");
 body.innerHTML = pendingNote + sections.map(s=>s.html).join("");
 _statsPhotosRunning=false;
 lazyLoadStatsPhotos();

}

/* ---- İstatistiklerdeki afişler de ana sayfadakiyle AYNI kaynaktan gelsin:
   OMDb'de afiş yoksa ya da yüklenemezse (kırık URL) ana sayfadaki gibi
   TMDB fallback'i (fetchPoster) devreye giriyor. ---- */
function lazyLoadStatsPosterImgs(container){
 container.querySelectorAll('.stats-movie-poster[data-imdb-id],.stat-highlight-poster[data-imdb-id]').forEach(imgEl=>{
   const imdbID=imgEl.dataset.imdbId;
   const hasPoster=imgEl.dataset.hasPoster==="1";
   const title=imgEl.dataset.title||"";
   const year=imgEl.dataset.year||"";
   imgEl.onerror=()=>fetchPoster(imdbID,imgEl,title,year);
   if(!hasPoster) fetchPoster(imdbID,imgEl,title,year);
 });
}

   bars+=`<div class="year-bar-wrap" data-year="${y}" data-count="${c}"><div class="year-bar" style="height:${h}%"></div></div>`;

let _statsBreakdownDataCache=new WeakMap();
function statsBreakdownData(movies,field){
 let byField=_statsBreakdownDataCache.get(movies);
 if(byField && byField[field]) return byField[field];
 const counts={}, ratingSums={}, moviesMap={};
 statsUniqueMovies(movies).forEach(m=>{
   const items = uniqueNames(field==="genre" ? movieGenresTr(m) : []);
   const r=statsRatingOf(m);
   items.forEach(it=>{
     counts[it]=(counts[it]||0)+1;
     if(r!=null){ ratingSums[it]=ratingSums[it]||{sum:0,n:0}; ratingSums[it].sum+=r; ratingSums[it].n++; }
     (moviesMap[it]=moviesMap[it]||[]).push(m);
   });
 });
 const result={counts,ratingSums,moviesMap};
 if(!byField){ byField={}; _statsBreakdownDataCache.set(movies,byField); }
 byField[field]=result;
 return result;
}
function statsBreakdownList(data,mode){
 const {counts,ratingSums}=data;
 let items=Object.keys(counts).map(k=>({
   name:k, count:counts[k],
   avg: (ratingSums[k]&&ratingSums[k].n)?ratingSums[k].sum/ratingSums[k].n:null
 }));
 items = mode==="rating"
   ? items.filter(x=>x.avg!=null && x.count>=2).sort((a,b)=>b.avg-a.avg || b.count-a.count || a.name.localeCompare(b.name,"tr"))
   : items.sort(statsByCountThenName);
 return items; // ana sayfadaki Kategori açılır menüsünde kaç tür varsa burada da hepsi listelensin - üst sınır yok
}
function statsBarListHtml(items,mode,colorClass,field){
 if(!items.length) return '<div class="stats-empty">Yeterli veri yok</div>';
 const maxVal = mode==="rating" ? 10 : Math.max(...items.map(x=>x.count));
 return items.map(x=>{
   const val = mode==="rating" ? x.avg : x.count;
   const pct = Math.max((val/maxVal)*100,3);
   const label = mode==="rating" ? `★ ${x.avg.toFixed(2)}` : `${x.count}`;
   return `<div class="bar-row" data-field="${field}" data-name="${escapeHtml(x.name)}">
    <div class="bar-row-top"><span>${escapeHtml(x.name)}</span><span class="bar-val">${label}</span></div>
    <div class="bar-track"><div class="bar-fill ${colorClass}" style="width:${pct}%"></div></div>
   </div>`;
 }).join("");
}
function statsSectionBreakdown(movies){

 // Kullanıcı isteği üzerine tek sütunda, alt alta gösteriliyor (önceden liste

/* ---- Oyuncular / Yönetmenler ---- */
// Performans: "En'ler" bölümü (statsSectionSuperlatives) director/actor
// sayımını statsPeopleData ile hesaplıyor, SONRA "Oyuncular"/"Yönetmenler"
// bölümü (statsSectionPeople) AYNI movies dizisi için AYNI hesaplamayı
// tekrar yapıyordu (her renderStats çağrısında 2 kez director + 2 kez
// actor = 4 tam geçiş). Aynı dizi referansı + kind için sonuç önbelleğe
// alınıyor; içerik/davranış birebir aynı kalıyor, sadece tekrar hesaplanmıyor.
let _statsPeopleDataCache=new WeakMap();
function statsPeopleData(movies,kind){
 let byKind=_statsPeopleDataCache.get(movies);
 if(byKind && byKind[kind]) return byKind[kind];
 const byKey={};
 statsUniqueMovies(movies).forEach(m=>{
   const items = kind==="actor" ? movieActors(m) : movieDirectors(m);
   const r=statsRatingOf(m);
   uniqueNames(items).forEach(name=>{
     const key=normNameKey(name);
     if(!key) return;
     const rec = byKey[key] || (byKey[key]={variants:{},count:0,sum:0,n:0,movies:[],seen:new Set()});
     rec.variants[name]=(rec.variants[name]||0)+1;
     // Aynı film aynı kişi için (mükerrer kayıt vb.) ikinci kez sayılmasın.
     const movieKey=m.imdbID||(m.Title+"|"+(m.Year||""));
     if(rec.seen.has(movieKey)) return;
     rec.seen.add(movieKey);
     rec.count++;
     rec.movies.push(m);
     if(r!=null){ rec.sum+=r; rec.n++; }
   });
 });
 const counts={}, ratingSums={}, moviesMap={};
 Object.keys(byKey).forEach(key=>{
   const rec=byKey[key];
   const display=Object.keys(rec.variants).sort((a,b)=>(rec.variants[b]-rec.variants[a])||a.localeCompare(b,"tr"))[0];
   counts[display]=rec.count;
   moviesMap[display]=rec.movies;
   if(rec.n) ratingSums[display]={sum:rec.sum,n:rec.n};
 });
 const result={counts,ratingSums,moviesMap};
 if(!byKind){ byKind={}; _statsPeopleDataCache.set(movies,byKind); }
 byKind[kind]=result;
 return result;
}
function statsPeopleList(data,mode){
 const {counts,ratingSums}=data;
 let items=Object.keys(counts).map(k=>({
   name:k, count:counts[k],
   avg: (ratingSums[k]&&ratingSums[k].n)?ratingSums[k].sum/ratingSums[k].n:null
 }));
 items = mode==="rating"
   ? items.filter(x=>x.avg!=null && x.count>=3).sort((a,b)=>b.avg-a.avg || b.count-a.count || a.name.localeCompare(b.name,"tr"))
   : items.sort(statsByCountThenName);
 return items.slice(0,18);
}
function statsPeopleHtml(items,mode,kind){
 if(!items.length) return '<div class="stats-empty">'+(mode==="rating"?"Yeterli veri yok (ortalama puan sıralaması için en az 3 film gerekir)":"Henüz kişi bilgisi yok - TMDB verisi yüklendikçe burası dolacak.")+'</div>';
 return `<div class="people-grid">`+items.map(x=>{
   const label = mode==="rating" ? `★ ${x.avg.toFixed(2)}` : `${x.count} film`;
   return `<div class="people-item" data-kind="${kind}" data-person-name="${escapeHtml(x.name)}">
    <div class="people-avatar" data-person-name="${escapeHtml(x.name)}">${escapeHtml(statsInitials(x.name))}</div>
    <div class="people-name">${escapeHtml(x.name)}</div>
    <div class="people-count">${label}</div>
   </div>`;
 }).join("")+`</div>`;
}
function statsSectionPeople(movies,kind){
 const data=statsPeopleData(movies,kind);
 statsPeopleMoviesMap[kind]=data.moviesMap;
 const mode="count";
 const title=kind==="actor"?"Oyuncular":"Yönetmenler";
 const items=statsPeopleList(data,mode);
 return `<div class="stats-section" id="stats-sec-${kind==="actor"?"actors":"directors"}">
  <div class="stats-section-head">
   <span class="stats-section-title stats-section-title--clickable" onclick="openAllPeopleList('${kind}')">${title}</span>
  </div>
  ${statsPeopleHtml(items,mode,kind)}
 </div>`;
}

/* ---- Yapım Şirketleri: oyuncular/yönetmenler bölümüyle aynı görünüm, ama
   avatar yerine TMDB'den gelen şirket logosu (varsa) gösterilir. Veri, "İzlenen"
   listesindeki her film için önceden çekilmiş TMDB detayından (turkishCache
   içindeki productionCompanies) geliyor - bütçe/hasılat istatistikleriyle
   aynı kaynak. ---- */
function statsCompanyData(movies){
 const counts={}, moviesMap={}, logos={};
 statsUniqueMovies(movies).forEach(m=>{
   const c=turkishCache[m.imdbID];
   const companies=(c&&c.productionCompanies)||[];
   // Aynı şirket TMDB verisinde bazen iki kez listeleniyor - film başına tek sayılır.
   const seenHere=new Set();
   companies.forEach(co=>{
     if(!co||!co.name) return;
     const name=cleanName(co.name);
     if(!name) return;
     const key=normNameKey(name);
     if(seenHere.has(key)) return;
     seenHere.add(key);
     counts[name]=(counts[name]||0)+1;
     (moviesMap[name]=moviesMap[name]||[]).push(m);
     if(co.logo_path && !logos[name]) logos[name]=co.logo_path;
   });
 });
 return {counts,moviesMap,logos};
}
function statsSectionCompanies(movies){
 const data=statsCompanyData(movies);
 statsPeopleMoviesMap.company=data.moviesMap;
 const items=Object.keys(data.counts)
   .map(k=>({name:k,count:data.counts[k],logo:data.logos[k]||null}))
   .sort(statsByCountThenName)
   .slice(0,18);
 if(!items.length) return "";
 return `<div class="stats-section" id="stats-sec-companies">
  <div class="stats-section-head">
   <span class="stats-section-title">Yapım Şirketleri</span>
  </div>
  <div class="people-grid">`+items.map(x=>{
    const avatarInner = x.logo
      ? `<img src="https://image.tmdb.org/t/p/w185${x.logo}" loading="lazy" onerror="this.onerror=null;this.src='${COMPANY_PLACEHOLDER}'">`
      : `<img src="${COMPANY_PLACEHOLDER}" loading="lazy">`;
    return `<div class="people-item" data-kind="company" data-person-name="${escapeHtml(x.name)}">
     <div class="people-avatar people-avatar--company">${avatarInner}</div>
     <div class="people-name">${escapeHtml(x.name)}</div>
     <div class="people-count">${x.count} film</div>
    </div>`;
  }).join("")+`</div>
 </div>`;
}

function statsSectionPairs(movies){

 statsUniqueMovies(movies).forEach(m=>{

   directors.forEach(d=>{
     actors.forEach(a=>{

/* ---- Film DNA: tür ağırlıklı radar profili + rozetler + otomatik özet ---- */
function statsBuildRadarSvg(axes,clickable){
 const n=axes.length;
 const size=300, cx=size/2, cy=size/2, R=80;
 const labelGap=14, labelR=R+labelGap;
 const maxVal=Math.max(...axes.map(a=>a.value));
 const angleFor=i=>(-Math.PI/2)+(i*2*Math.PI/n);
 const pointFor=(i,val)=>{
   const ang=angleFor(i);
   const r=maxVal?(val/maxVal)*R:0;
   return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];
 };
 let rings="";
 [0.25,0.5,0.75,1].forEach(f=>{
   const pts=axes.map((a,i)=>{ const ang=angleFor(i); return `${cx+R*f*Math.cos(ang)},${cy+R*f*Math.sin(ang)}`; }).join(" ");
   rings+=`<polygon points="${pts}" fill="none" stroke="#333" stroke-width="1"/>`;
 });
 // Her eksen (tür) için tıklanabilir dilim: filme değil ekseni çevreleyen
 // görünmez pasta dilimine tıklandığında o türün filmleri açılır. En son
 // (diğer her şeyin üstünde) çizilir ki tıklama her zaman bu dilime düşsün.
 let wedges="";
 if(clickable){
   axes.forEach((a,i)=>{
     const a0=angleFor(i)-(Math.PI/n), a1=angleFor(i)+(Math.PI/n);
     const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
     const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
     wedges+=`<path class="dna-radar-wedge" data-genre="${escapeHtml(a.label)}" d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0,1 ${x1},${y1} Z"/>`;
   });
 }
 let axisLines="", labels="";
 axes.forEach((a,i)=>{
   const ang=angleFor(i);
   const x2=cx+R*Math.cos(ang), y2=cy+R*Math.sin(ang);
   axisLines+=`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="1"/>`;
   const lx=cx+labelR*Math.cos(ang), ly=cy+labelR*Math.sin(ang);
   const cosA=Math.cos(ang);
   const anchor = Math.abs(cosA)<0.25 ? "middle" : (cosA>0?"start":"end");
   // Uzun/çift kelimeli etiketler taşmasın diye satıra bölünüyor ve
   // gerekirse yazı boyutu küçültülüyor; kenar boşluğu her cihazda sabit
   // kaldığı için mobil/masaüstü arasında farklı kırpılma olmuyor.
   const words=String(a.label).split(" ");
   const longest=Math.max(...words.map(w=>w.length));
   const fontSize = longest<=6?11:(longest<=8?10:(longest<=10?9:8.2));
   if(words.length>1){
     const line1=words.slice(0,Math.ceil(words.length/2)).join(" ");
     const line2=words.slice(Math.ceil(words.length/2)).join(" ");
     const lh=fontSize+2;
     labels+=`<text x="${lx}" y="${ly}" fill="#bbb" font-size="${fontSize}" text-anchor="${anchor}">`
       + `<tspan x="${lx}" dy="${-lh/2+2}">${escapeHtml(line1)}</tspan>`
       + `<tspan x="${lx}" dy="${lh}">${escapeHtml(line2)}</tspan>`
       + `</text>`;
   } else {
     labels+=`<text x="${lx}" y="${ly}" fill="#bbb" font-size="${fontSize}" text-anchor="${anchor}" dominant-baseline="middle">${escapeHtml(a.label)}</text>`;
   }
 });
 const dataPts=axes.map((a,i)=>pointFor(i,a.value).join(",")).join(" ");
 const dots=axes.map((a,i)=>{ const [x,y]=pointFor(i,a.value); return `<circle cx="${x}" cy="${y}" r="3" fill="#d9a441"/>`; }).join("");
 // Kendi ortalama profiliniz: grafikteki eksenlerin (en çok izlediğiniz
 // türlerin) ortalama değerine denk gelen kesikli referans çizgisi - hangi
 // türde ortalamanızın belirgin şekilde üstünde/altında olduğunuzu gösterir.
 // Eksenler eşit açılarla yerleştiği için sabit bir değer, düzenli bir
 // çokgen (görsel olarak neredeyse bir daire) oluşturur.
 const avgVal=axes.reduce((s,a)=>s+a.value,0)/n;
 const refPts=axes.map((a,i)=>{ const ang=angleFor(i); const r=maxVal?(avgVal/maxVal)*R:0; return `${cx+r*Math.cos(ang)},${cy+r*Math.sin(ang)}`; }).join(" ");
 const refPolygon=`<polygon points="${refPts}" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.85"/>`;
 return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="auto">
  ${rings}${axisLines}
  ${refPolygon}
  <polygon points="${dataPts}" fill="rgba(217,164,65,0.28)" stroke="#d9a441" stroke-width="2"/>
  ${dots}
  ${labels}
  ${wedges}
 </svg>`;
}
function statsSectionDNA(movies){
 if(movies.length<5){
   return `<div class="stats-section" id="stats-sec-dna">
    <div class="stats-section-head"><span class="stats-section-title">Film DNA</span></div>
    <div class="stats-empty">Profil oluşturmak için yeterli film yok (en az 5 film gerekir)</div>
   </div>`;
 }
 const genreData=statsBreakdownData(movies,"genre");
 const genreEntries=Object.keys(genreData.counts).map(k=>({name:k,count:genreData.counts[k]})).sort(statsByCountThenName).slice(0,6);
 const genreTagged=movies.filter(m=>movieGenresTr(m).length).length || movies.length;
 // Radar eksenlerine tıklanınca o türün filmlerini açabilmek için, aynı
 // genreData'nın film haritasını (statsBreakdownData zaten hesaplıyor)
 // global bir değişkende tutuyoruz - statsSectionBreakdown ile birebir aynı
 // veriden geldiği için sayılar (Türler bölümüyle) her zaman tutarlı kalır.
 statsDnaGenreMoviesMap=genreData.moviesMap;
 const radarSvg = genreEntries.length>=3 ? statsBuildRadarSvg(genreEntries.map(g=>({label:g.name,value:g.count})),true) : "";

 const badges=[];
 const withYear=movies.map(m=>statsYearOf(m)).filter(y=>y!=null);
 let topDec=null;
 if(withYear.length){
   const decCounts={};
   withYear.forEach(y=>{ const d=Math.floor(y/10)*10; decCounts[d]=(decCounts[d]||0)+1; });
   topDec=Object.keys(decCounts).map(Number).sort((a,b)=>decCounts[b]-decCounts[a])[0];
   const pct=Math.round(decCounts[topDec]/withYear.length*100);
   badges.push({label:"Baskın Dönem",value:`${decadeLabel(topDec)} (%${pct})`});
   const avgYear=Math.round(withYear.reduce((s,v)=>s+v,0)/withYear.length);
   badges.push({label:"Ortalama Yapım Yılı",value:String(avgYear)});
 }
 const dirData=statsPeopleData(movies,"director");
 const dirEntries=Object.keys(dirData.counts).map(k=>({name:k,count:dirData.counts[k]})).sort(statsByCountThenName);
 if(dirEntries.length && dirEntries[0].count>=2){
   const pct=Math.round(dirEntries[0].count/movies.length*100);
   badges.push({label:"Yönetmen Sadakati",value:`${escapeHtml(dirEntries[0].name)} (%${pct})`});
 }
 const withRuntime=movies.map(m=>runtimeMin(m.Runtime)).filter(m=>m>0);
 let avgMin=null;
 if(withRuntime.length){
   avgMin=Math.round(withRuntime.reduce((s,v)=>s+v,0)/withRuntime.length);
   badges.push({label:"Ortalama Film Süresi",value:formatTime(avgMin)});
 }

 const parts=[`${movies.length} film izlediniz.`];
 if(genreEntries.length){
   const top2=genreEntries.slice(0,2).map(g=>`${g.name} (%${Math.round(g.count/genreTagged*100)})`).join(" ve ");
   parts.push(`En çok ${top2} türlerini tercih ediyorsunuz.`);
 }
 if(topDec!=null) parts.push(`Ağırlıklı olarak ${decadeLabel(topDec)} yapımı filmler izliyorsunuz.`);
 if(avgMin!=null) parts.push(`Ortalama film süreniz ${formatTime(avgMin)}.`);
 const bothRated=movies.filter(m=>m.myRating!=null && m.myRating!=="" && m.imdbRating && m.imdbRating!=="N/A");
 if(bothRated.length>=5){
   const diffs=bothRated.map(m=>Number(m.myRating)-parseFloat(m.imdbRating));
   const avgDiff=diffs.reduce((s,v)=>s+v,0)/diffs.length;
   if(avgDiff>=0.3) parts.push(`IMDb ortalamasına göre puanlarınız ortalama +${avgDiff.toFixed(1)} daha yüksek.`);
   else if(avgDiff<=-0.3) parts.push(`IMDb ortalamasına göre puanlarınız ortalama ${avgDiff.toFixed(1)} daha düşük.`);
 }

 return `<div class="stats-section" id="stats-sec-dna">
  <div class="stats-section-head"><span class="stats-section-title">Film DNA</span></div>
  <div class="dna-wrap">
   ${radarSvg?`<div class="dna-radar-box">${radarSvg}<div class="dna-radar-legend"><span class="dna-legend-item"><span class="dna-legend-swatch dna-legend-actual"></span>Profiliniz</span><span class="dna-legend-item"><span class="dna-legend-swatch dna-legend-ref"></span>Ortalamanız</span></div></div>`:""}
   <div class="dna-badges">${badges.map(b=>`<div class="dna-badge"><span class="dna-badge-label">${escapeHtml(b.label)}</span><span class="dna-badge-value">${b.value}</span></div>`).join("")}</div>
  </div>
  <div class="dna-summary">${parts.join(" ")}</div>
 </div>`;
}

/* ---- Görünen oyuncu/yönetmen avatarları için TMDB'den fotoğraf ----
   Hem "En'ler/vitrin" bölümü (lazyLoadStatsPhotos, sırayla) hem de "Tüm
   Kişiler" listesi (lazyLoadStatsPhotosOnScroll, ekrana girdikçe) aynı isme
   AYNI ANDA istek atabiliyordu (ör. bir oyuncu hem vitrin kartında hem tam
   listede görünüyorsa). Ayrıca "Tüm Kişiler" açılışında ekrana bir anda
   giren onlarca avatar için IntersectionObserver hepsini TEK SEFERDE ateşleyip
   onlarca eşzamanlı ağ isteği + arka arkaya çok sayıda DOM güncellemesi
   (her biri innerHTML yazıyor) yapıyordu; zayıf telefonlarda bu ani yığılma
   sayfanın bir anlığına tepkisiz/donmuş gibi hissettirmesine yol açıyordu.
   Aşağıdaki tek merkezi fonksiyon: (1) aynı isim için mükerrer isteği
   engeller (in-flight kayıt), (2) aynı anda en fazla birkaç istek çalışmasını
   sağlar (basit bir eşzamanlılık sınırı/kuyruk). */
const _personPhotoInFlight={};
let _personPhotoActive=0;
const _personPhotoQueue=[];
const PERSON_PHOTO_MAX_CONCURRENT=3;
function _personPhotoPump(){
 while(_personPhotoActive<PERSON_PHOTO_MAX_CONCURRENT && _personPhotoQueue.length){
   const job=_personPhotoQueue.shift();
   _personPhotoActive++;
   job().finally(()=>{ _personPhotoActive--; _personPhotoPump(); });
 }
}
function fetchStatsPersonPhoto(name){
 if(statsPersonPhotoCache[name]!==undefined) return Promise.resolve(statsPersonPhotoCache[name]);
 if(_personPhotoInFlight[name]) return _personPhotoInFlight[name];
 const p=new Promise(resolve=>{
   _personPhotoQueue.push(async ()=>{
     let url=null;
     try{
       const d=await fetchJson(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}`);
       const person=d?.results?.[0];
       url=(person && person.profile_path) ? `https://image.tmdb.org/t/p/w185${person.profile_path}` : null;
     }catch(e){ url=null; }
     statsPersonPhotoCache[name]=url;
     delete _personPhotoInFlight[name];
     resolve(url);
   });
 });
 _personPhotoInFlight[name]=p;
 _personPhotoPump();
 return p;
}

let _statsPhotosRunning=false;
async function lazyLoadStatsPhotos(){
 if(_statsPhotosRunning) return;
 _statsPhotosRunning=true;
 const avatars=document.querySelectorAll('.people-avatar[data-person-name]');
 for(const el of avatars){
   const name=el.dataset.personName;
   if(!name) continue;
   if(statsPersonPhotoCache[name]!==undefined){
     if(statsPersonPhotoCache[name]) el.innerHTML=`<img src="${statsPersonPhotoCache[name]}" loading="lazy">`;
     continue;
   }
   const url=await fetchStatsPersonPhoto(name);
   if(url && el.isConnected) el.innerHTML=`<img src="${url}" loading="lazy">`;
 }
 _statsPhotosRunning=false;
}

/* ---- İstatistikler > Oyuncular/Yönetmenler başlığına tıklanınca açılan,
   TÜM filmlerdeki TÜM kişileri (üstteki bölümdeki gibi sadece ilk 18 değil)
   alfabetik sırayla listeleyen modal. Bir isme tıklanınca istatistikler
   kapanır ve ana sayfada, o kişinin filmleri ana ekrandaki oyuncu/yönetmen
   ismine tıklamışçasına filtrelenir (izlenen listesi üzerinde, çünkü
   istatistikler sadece izlenen filmlerden hesaplanıyor).

   İsimler harfe göre gruplanıyor; üstte tıklanabilir bir A-Z satırı o harfin
   grubuna direkt atlıyor, sağ altta sabit duran ▼/▲ düğmesi ise uzun listede
   hızlı aşağı/yukarı kaydırma sağlıyor. Fotoğraflar (TMDB'den) her isim için
   PEŞİNEN değil, sadece görünüme girdikçe (IntersectionObserver ile) çekiliyor
   - yüzlerce kişi olan hesaplarda tek seferde yüzlerce ağ isteği atılmasını
   önlüyor (bkz. lazyLoadStatsPhotosOnScroll). ---- */
const TR_ALPHABET=["A","B","C","Ç","D","E","F","G","H","I","İ","J","K","L","M","N","O","Ö","P","Q","R","S","Ş","T","U","Ü","V","W","X","Y","Z"];
function trFirstLetter(name){
 const ch=(name||"").trim().charAt(0).toLocaleUpperCase("tr-TR");
 return ch==="Ğ"?"G":ch;
}
/* Liste artık aranabilir ve iki şekilde sıralanabilir: A-Z (harf grupları) ya
   da film sayısı (çoktan aza). Böylece "şu oyuncu kaç filmde çıkıyor" sorusu
   tek tek bakmadan görülebiliyor; isme dokununca o kişinin sayılan filmleri
   listeleniyor. Arama kutusu yeniden çizilmediği için yazarken odak kaybolmaz. */
let _peopleListState={kind:"actor",sort:"az",query:""};
function openAllPeopleList(kind){
 _peopleListState={kind,sort:"az",query:""};
 const map=statsPeopleMoviesMap[kind]||{};
 const total=Object.keys(map).length;
 document.getElementById("statsPeopleListTitle").textContent=`${kind==="actor"?"Oyuncular":"Yönetmenler"} (${total})`;
 const body=document.getElementById("statsPeopleListBody");
 body.innerHTML=`<div class="people-toolbar">
   <input class="people-search" id="statsPeopleSearch" type="text" autocomplete="off" placeholder="İsim ara…" oninput="statsPeopleSearchInput(this.value)">
   <div class="people-sort">
    <span class="people-sort-btn active" id="peopleSortAz" onclick="statsPeopleSetSort('az')">A-Z</span>
    <span class="people-sort-btn" id="peopleSortCount" onclick="statsPeopleSetSort('count')">Film sayısı</span>
   </div>
  </div>
  <div id="statsPeopleListInner"></div>`;
 renderPeopleListInner();
 document.getElementById("statsPeopleOverlay").classList.add("open");
 document.getElementById("statsPeopleOverlay").scrollTop=0;
 positionPeopleAzNav();
 updateStatsPeopleScrollBtn();
 _lockBackgroundScroll();
}
function statsPeopleSearchInput(v){
 _peopleListState.query=v||"";
 renderPeopleListInner();
}
function statsPeopleSetSort(mode){
 _peopleListState.sort=mode;
 const azBtn=document.getElementById("peopleSortAz");
 const cBtn=document.getElementById("peopleSortCount");
 if(azBtn) azBtn.classList.toggle("active",mode==="az");
 if(cBtn) cBtn.classList.toggle("active",mode==="count");
 renderPeopleListInner();

function peopleItemHtml(kind,name,count){
 return `<div class="people-item" data-kind="${kind}" data-person-name="${escapeHtml(name)}">

   <div class="people-name">${escapeHtml(name)}</div>
   <div class="people-count">${count} film</div>
  </div>`;
}
function renderPeopleListInner(){
 const {kind,sort,query}=_peopleListState;
 const inner=document.getElementById("statsPeopleListInner");
 if(!inner) return;
 const map=statsPeopleMoviesMap[kind]||{};
 const q=normNameKey(query);
 let names=Object.keys(map);
 if(q) names=names.filter(n=>normNameKey(n).indexOf(q)>=0);

 if(!names.length){
   inner.innerHTML='<div class="stats-empty">'+(q?"Bu isimde kimse bulunamadı.":"Kişi bulunamadı.")+'</div>';
   return;
 }

 if(sort==="count"){
   const items=names.map(n=>({name:n,count:(map[n]||[]).length})).sort(statsByCountThenName);
   inner.innerHTML=`<div class="people-grid">`+items.map(x=>peopleItemHtml(kind,x.name,x.count)).join("")+`</div>`;
 }else{
   names=names.sort((a,b)=>a.localeCompare(b,"tr"));
   const groups={};
   names.forEach(name=>{
     const letter=trFirstLetter(name);
     const key=TR_ALPHABET.includes(letter)?letter:"#";
     (groups[key]=groups[key]||[]).push(name);
   });
   const presentLetters=TR_ALPHABET.filter(l=>groups[l]);
   if(groups["#"]) presentLetters.push("#");
   // A-Z şeridi sadece arama yokken anlamlı (aramada zaten az sonuç kalıyor).
   const navHtml = q ? "" : `<div class="people-az-nav">`+[...TR_ALPHABET,"#"].filter(l=>l!=="#"||groups["#"]).map(l=>{
     const has=!!groups[l];
     return `<span class="people-az-btn${has?"":" people-az-btn--disabled"}"${has?` onclick="statsScrollToLetter('${l}')"`:""}>${l}</span>`;
   }).join("")+`</div>`;
   const listHtml=presentLetters.map(letter=>`<div class="people-letter-group" id="people-letter-${letter}">
     <div class="people-letter-heading">${letter==="#"?"Diğer":letter}</div>
     <div class="people-grid">`+groups[letter].map(name=>peopleItemHtml(kind,name,(map[name]||[]).length)).join("")+`</div>
    </div>`).join("");
   inner.innerHTML=navHtml+listHtml;
   positionPeopleAzNav();
 }
 lazyLoadStatsPhotosOnScroll(document.getElementById("statsPeopleOverlay"));
 updateStatsPeopleScrollBtn();
}
/* ---- A-Z satırı, üstbardaki başlığın (Oyuncular/Yönetmenler) hemen altına
   yapışık kalsın diye "sticky" - ama sticky'nin doğru yerde durması için
   üstbarın gerçek yüksekliği kadar bir "top" boşluğu gerekiyor. Bu yükseklik
   ekran genişliğine göre değiştiğinden (mobilde farklı padding) sabit bir
   piksel yazmak yerine her açılışta ve pencere boyutu değiştiğinde ölçülüyor. ---- */
function positionPeopleAzNav(){
 const overlay=document.getElementById("statsPeopleOverlay");
 if(!overlay) return;
 const topbar=overlay.querySelector(".stats-list-topbar");
 const nav=overlay.querySelector(".people-az-nav");
 if(topbar && nav) nav.style.top=topbar.getBoundingClientRect().height+"px";
}

/* ---- "Oyuncular"/"Yönetmenler" başlığına tıklanınca listeyi en üste sarar. ---- */
function scrollStatsPeopleToTop(){
 const overlay=document.getElementById("statsPeopleOverlay");
 if(overlay) overlay.scrollTo({top:0,behavior:"smooth"});
}
function statsScrollToLetter(letter){
 const el=document.getElementById(`people-letter-${letter}`);
 const overlay=document.getElementById("statsPeopleOverlay");
 if(!el || !overlay) return;
 const topbar=overlay.querySelector(".stats-list-topbar");
 const topbarH=topbar?topbar.getBoundingClientRect().height:0;
 const offset=el.getBoundingClientRect().top-overlay.getBoundingClientRect().top+overlay.scrollTop-topbarH-10;
 overlay.scrollTo({top:Math.max(offset,0),behavior:"smooth"});
}

 document.getElementById("statsPeopleOverlay").classList.remove("open");

   olan hesaplarda tek seferde yüzlerce TMDB isteği atılmasını önlemek için. ---- */
function lazyLoadStatsPhotosOnScroll(rootEl){
 const io=new IntersectionObserver((entries,obs)=>{
   entries.forEach(entry=>{
     if(!entry.isIntersecting) return;
     const el=entry.target;
     obs.unobserve(el);
     const name=el.dataset.personName;
     if(!name) return;
     if(statsPersonPhotoCache[name]!==undefined){
       if(statsPersonPhotoCache[name]) el.innerHTML=`<img src="${statsPersonPhotoCache[name]}" loading="lazy">`;
       return;
     }
     // Ortak kuyruk/eşzamanlılık sınırlı yükleyici: aynı isim için mükerrer
     // istek atılmaz, aynı anda sadece birkaç istek çalışır (bkz. yukarıdaki
     // fetchStatsPersonPhoto tanımı).
     fetchStatsPersonPhoto(name).then(url=>{
       if(url && el.isConnected) el.innerHTML=`<img src="${url}" loading="lazy">`;
     });
   });
 },{root:rootEl,rootMargin:"120px"});
 rootEl.querySelectorAll('.people-avatar[data-person-name]').forEach(el=>io.observe(el));
}

function isTmdbKeyError(status,data){
 if(status===401) return true;
 if(status===429) return true; // TMDB hız sınırı - bu anahtarla devam etmenin anlamı yok, sıradakine geç
 if(data && data.success===false && (data.status_code===7 || /invalid api key/i.test(data.status_message||""))) return true;
 return false;
}

async function fetchJson(url,timeoutMs=12000){
 for(let attempt=0; attempt<TMDB_KEYS.length; attempt++){
   const controller=new AbortController();
   const t=setTimeout(()=>controller.abort(),timeoutMs);
   try{
     const r=await fetch(url,{signal:controller.signal});
     const data=await r.json();
     if(isTmdbKeyError(r.status,data) && attempt<TMDB_KEYS.length-1){
       const oldKey=TMDB_KEY;
       tmdbKeyIndex=(tmdbKeyIndex+1)%TMDB_KEYS.length;
       TMDB_KEY=TMDB_KEYS[tmdbKeyIndex];
       url=url.split(oldKey).join(TMDB_KEY);
       continue;
     }
     return data;
   }catch(e){
     if(attempt<TMDB_KEYS.length-1){
       const oldKey=TMDB_KEY;
       tmdbKeyIndex=(tmdbKeyIndex+1)%TMDB_KEYS.length;
       TMDB_KEY=TMDB_KEYS[tmdbKeyIndex];
       url=url.split(oldKey).join(TMDB_KEY);
       continue;
     }
     throw e;
   }finally{
     clearTimeout(t);
   }
 }
}

// Sayıyı TMDB'deki gibi tam rakamlı para birimi metnine çevirir: 150000000 -> "$150,000,000". 0/boş ise null döner.
function formatMoney(n){
 n=Number(n);
 if(!n||n<=0) return null;
 return "$"+Math.round(n).toLocaleString("en-US");
}

// OMDb'nin "BoxOffice" alanı ("$325,873,309" gibi) ham metnini sayıya çevirir.
function parseOmdbMoney(s){
 if(!s||s==="N/A") return null;
 const n=Number(String(s).replace(/[^0-9]/g,""));
 return n>0?n:null;
}

// Kart üzerinde gösterilecek bütçe/hasılat metinlerini AYRI AYRI üretir (alt
// alta iki satır olacak, PC sürümüyle birebir aynı). Bütçe SADECE TMDB'den
// gelir (OMDb bütçe bilgisi vermez). Hasılat için önce TMDB'nin (dünya
// geneli) revenue'su denenir, o yoksa OMDb'nin BoxOffice'i (genelde sadece
// ABD gişesi) yedek olarak kullanılır.
function moneyLines(omdbBoxOffice,info){
 const budget=formatMoney(info&&info.budget);
 const revenue=formatMoney(info&&info.revenue)||formatMoney(parseOmdbMoney(omdbBoxOffice));
 return {
   budget: budget?`<span class="meta-icon">💰</span> Bütçe: ${budget}`:"",
   revenue: revenue?`<span class="meta-icon">💵</span> Hasılat: ${revenue}`:""
 };
}

async function getTurkishInfo(imdbID,title,year){
 const cached=turkishCache[imdbID];
 // _v2: bu alanı SADECE tmdbId/oyuncu desteği eklenen yeni kod dolduruyor.
 // Eski (bu özellikten önceki) önbellek kayıtlarında _checked=true olsa
 // bile _v2 yok - bu yüzden TMDB butonu/oyuncular kalıcı olarak hiç
 // gelmiyordu. _v2 kontrolü, eski kayıtlar için bir kereliğine sessiz bir
 // yeniden-çekmeye (migrasyon) zorluyor; sonrasında normal şekilde önbellekten okunur.
 // _v8: tam kadro (credits) isteği ağ hatası/rate-limit yüzünden başarısız olursa
 // castNames boş kalıyor ama film yine de _v7=true ile "tamam" işaretleniyordu -
 // bu yüzden o film bir daha HİÇ denenmiyor ve oyuncu filtresinde sadece OMDb'nin
 // kısa (3-4 kişilik) "Actors" listesine sınırlı kalıyordu. _v8, credits isteği
 // gerçekten başarılı olduğunda set edilir; eksikse bir kereliğine yeniden denenir.
 if(cached && cached._checked && cached._v7 && cached._v8) return cached;
 const info={title:null,poster:null,genres:[],genreIds:[],budget:null,revenue:null,overview:null,backdrop:null,tmdbId:null,productionCompanies:[],castNames:[],directorNames:[],countryNames:[],originalLanguage:null};
 if(cached) Object.assign(info,cached); // eski önbellekte olan (başlık/poster/tür) alanları koru, eksikleri tamamlayacağız
 try{
   const data=await fetchJson(`https://api.themoviedb.org/3/find/${imdbID}?api_key=${TMDB_KEY}&external_source=imdb_id&language=tr-TR`);
   let movie=data.movie_results?.[0]||null;

   if(!movie && title){
     // IMDb ID ile bulunamadıysa başlığa göre arama yapıyoruz - ama bu arama
     // yanlış filmi (ör. aynı serideki, adı çok benzeyen ayrı bir yapım/kısa
     // film) döndürebilir. Bu yüzden bulduğumuz sonucun başlığının (Türkçe
     // değil orijinal başlığı) OMDb'deki başlıkla TAM eşleştiğini (ve varsa
     // yılın ±1 tolerans içinde olduğunu) doğrulamadan kabul etmiyoruz -
     // eşleşme güvenilir değilse (ör. "X" filmi yerine "X Reenactors" gibi
     // alakasız bir yapım) sonuç reddedilir ve OMDb'nin kendi (doğru) tür/
     // oyuncu/yönetmen bilgisine sessizce geri düşülür.
     const normTitle=s=>(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
     const wantedNorm=normTitle(title);
     const searchMatchOk=(cand)=>{
       if(!cand) return false;
       const candNorms=[normTitle(cand.title),normTitle(cand.original_title)];
       if(!candNorms.includes(wantedNorm)) return false;
       const y=parseInt(year,10);
       if(!isNaN(y) && cand.release_date){
         const cy=parseInt(String(cand.release_date).slice(0,4),10);
         if(!isNaN(cy) && Math.abs(cy-y)>1) return false;
       }
       return true;
     };
     const trySearch=async(withYear)=>{
       let url=`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=tr-TR&query=${encodeURIComponent(title)}`;
       const y=parseInt(year);
       if(withYear && !isNaN(y)) url+=`&year=${y}`;
       try{
         const d=await fetchJson(url);
         const cand=d.results?.[0]||null;
         return searchMatchOk(cand)?cand:null;
       }catch(e){return null;}
     };
     movie=await trySearch(true);
     if(!movie) movie=await trySearch(false);
   }

   if(movie){
     info.tmdbId=movie.id;
     if(movie.original_language) info.originalLanguage=movie.original_language; // logo seçiminde filmin kendi dili tercih edilsin
     if(movie.title) info.title=movie.title;
     if(movie.poster_path) info.poster=`https://image.tmdb.org/t/p/w200${movie.poster_path}`;
     if(movie.overview) info.overview=movie.overview;
     if(movie.backdrop_path) info.backdrop=`https://image.tmdb.org/t/p/w780${movie.backdrop_path}`;
     if(movie.genre_ids && movie.genre_ids.length){
       info.genreIds=movie.genre_ids;
       info.genres=movie.genre_ids.map(id=>genreMap[id]).filter(Boolean);
     }
     // Bütçe/hasılat/kadro: eskiden ayrı iki istek (detay + credits) sırayla
     // atılıyordu - her film için ekstra bir tam ağ gidiş-dönüşü demekti ve
     // özellikle oyuncu/yönetmen sayılarının tamamlanmasını yavaşlatıyordu.
     // TMDB'nin append_to_response desteğiyle ikisi TEK istekte birleştirildi -
     // aynı bilgi artık yarı sürede (bir istek daha az) geliyor.
     try{
       const det=await fetchJson(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TMDB_KEY}&language=tr-TR&append_to_response=credits`);
       if(det){
         if(det.budget) info.budget=det.budget;
         if(det.revenue) info.revenue=det.revenue;
         if(!info.overview && det.overview) info.overview=det.overview;
         if(!info.backdrop && det.backdrop_path) info.backdrop=`https://image.tmdb.org/t/p/w780${det.backdrop_path}`;
         if(det.production_companies && det.production_companies.length){
           info.productionCompanies=det.production_companies.map(c=>({id:c.id,name:c.name,logo_path:c.logo_path||null}));
         }
         // Yapım ülkesi (production_countries): OMDb'nin "Country" alanı bazen
         // eksik/farklı formatlı oluyor - TMDB'den geleni önceliklendiriyoruz.
         if(det.production_countries && det.production_countries.length){
           info.countryNames=det.production_countries.map(c=>c.name).filter(Boolean);
         }
         // Tam oyuncu kadrosu + yönetmen(ler): ana sayfa kartında ve istatistiklerde
         // OMDb'nin sınırlı "Actors"/"Director" alanı yerine bunlar kullanılır -
         // böylece başrolde olmayan ama filmde oynayan oyuncular da (TMDB'nin
         // billing sırasına göre geniş bir listesi) istatistiklere dahil olur.
         if(det.credits){
           info.castNames=(det.credits.cast||[]).map(c=>c.name).filter(Boolean);
           info.directorNames=(det.credits.crew||[]).filter(c=>c.job==="Director").map(c=>c.name).filter(Boolean);
           info._v8=true; // tam kadro isteği bu sefer başarıyla tamamlandı
         }
       }
     }catch(e){}
   }
   info._v7=true; // bu deneme (find/search) ağ hatası almadan tamamlandı - eski/yeni ayrımı için işaretle (v7: yanlış film eşleşmelerine karşı başlık/yıl doğrulaması eklendi)
   if(!movie) info._v8=true; // TMDB'de eşleşme yok - çekilecek kadro da yok, sonsuza kadar tekrar denenmesin
 }catch(e){}
 // sadece gerçekten bir sonuç bulduysak kalıcı olarak önbelleğe al (_checked=true) -
 // ki bir daha bu film için hiç istek atılmasın. Toptan başarısızlıkta (ağ hatası vb.)
 // _checked eklenmez, bir sonraki denemede tekrar denenir.
 if(info.title || info.poster || info.genres.length || info.overview || info.backdrop || info.tmdbId){
   info._checked=true;
   turkishCache[imdbID]=info;
   scheduleTmdbCacheSave(); // toplu yükleme dışında (ör. film detayı açılırken) gelen bilgiler de diske yazılsın
 }
 return info;
}

/* ---- TMDB bilgilerinin (tür/kadro/yönetmen/ülke/bütçe) tarayıcıda kalıcı
   önbelleği. Eskiden turkishCache sadece bellekte tutuluyordu: sayfa her
   yenilendiğinde sıfırlanıp TMDB'den yeniden çekiliyordu ve veri henüz
   tamamlanmadan istatistik açılınca sayılar eksik çıkıyordu. İstatistiklerin
   "her seferinde farklı" görünmesinin ana sebebi buydu. Artık önbellek diske
   (localStorage) yazılıyor, bir sonraki açılışta sayılar ANINDA ve aynı çıkıyor. ---- */
const TMDB_CACHE_KEY="filmarsivi_tmdb_cache";
function saveTmdbCache(){
 try{
   localStorage.setItem(TMDB_CACHE_KEY, JSON.stringify(turkishCache));
 }catch(e){
   // Kota dolduysa: yer kaplayan ama istatistikler için gerekmeyen alanları
   // (özet/arka plan görseli) atıp daha küçük bir sürümü yazmayı dene.
   try{
     const slim={};
     Object.keys(turkishCache).forEach(id=>{
       const c=turkishCache[id]||{};
       slim[id]=Object.assign({},c,{overview:null,backdrop:null});
     });
     localStorage.setItem(TMDB_CACHE_KEY, JSON.stringify(slim));
   }catch(e2){
     try{ localStorage.removeItem(TMDB_CACHE_KEY); }catch(e3){}
   }
 }
}
let _tmdbCacheSaveTimer=null;
function scheduleTmdbCacheSave(){
 clearTimeout(_tmdbCacheSaveTimer);
 _tmdbCacheSaveTimer=setTimeout(saveTmdbCache,1500); // arka arkaya çağrılarda tek yazma
}
function loadTmdbCache(){
 try{
   const raw=localStorage.getItem(TMDB_CACHE_KEY);
   if(!raw) return;
   const obj=JSON.parse(raw);
   if(obj && typeof obj==="object") turkishCache=obj;
 }catch(e){}
}

// İstatistik ekranı her partide (throttle'lı) yeniden çizilsin diye - tüm
// yükleme bitene kadar beklemek yerine, oyuncu/yönetmen sayıları veri
// geldikçe adım adım güncellenir. Her partide yeniden çizmek (büyük
// kitaplıklarda yüzlerce kez) gereksiz yere ağır olacağından en fazla
// ~900ms'de bir çalışır.
let _lastStatsRefreshAt=0;
let _lastFilterSelectRefreshAt=0;
function throttledRefreshStats(force){
 const now=Date.now();
 // İstatistik penceresi TMDB verisi akarken her partide (saniyede birkaç
 // kez) baştan çiziliyordu - bu, ekranın "sürekli yenileniyormuş" gibi
 // görünmesine ve büyük kütüphanelerde donmaya sebep oluyordu. Aralık
 // 900ms'den 2500ms'ye çıkarıldı; akış bittiğinde (force=true) yine de
 // hemen ve kesin doğru sayılarla güncellenir.
 if(!force && now-_lastStatsRefreshAt<2500) return;
 _lastStatsRefreshAt=now;
 refreshStatsIfOpen();
}

// Aynı anda birden fazla preloadInfo() çalışırsa (ör. yenileme sürerken
// istatistik penceresi açılırsa) aynı filmler için mükerrer TMDB isteği
// atılıyor ve sonuçlar birbirini eziyordu; tek bir çalışma paylaşılıyor.
let _preloadPromise=null;
function _pendingTmdbInfo(list){
 return (list||[]).filter(m=>{
   const c=turkishCache[m.imdbID];
   return !c || !c._checked || !c._v7 || !c._v8;
 });
}
async function _preloadRunList(list,batchSize){
 for(let i=0;i<list.length;i+=batchSize){
   const batch=list.slice(i,i+batchSize);
   await Promise.all(batch.map(m=>getTurkishInfo(m.imdbID,m.Title,m.Year)));
   refreshCardsInPlace();
   throttledRefreshStats();
   if(i+batchSize<list.length) await new Promise(res=>setTimeout(res,60));
 }
}
async function preloadInfo(){
 if(_preloadPromise) return _preloadPromise;
 const run=(async()=>{
   await loadGenreMap();
   // Önce SADECE "İzlenen" listesi çekilir - istatistikler yalnızca bu
   // listeden besleniyor, "İzlenecek" listesi ne kadar büyük olursa olsun
   // istatistik sayılarını bekletmemesi gerekiyor. Eskiden iki liste
   // birlikte (tek kuyrukta) işleniyordu; büyük bir izlenecekler listesi
   // varsa oyuncu/yönetmen sayıları TAMAMEN o da bitene kadar (dakikalarca)
   // hiç güncellenmiyordu. Artık izlenenler bitince sayılar hemen kesinleşir.
   const batchSize=8; // eskiden 5'ti - istek başına artık tek TMDB çağrısı (bkz. getTurkishInfo) olduğu için daha güvenli
   const watchedPending=_pendingTmdbInfo(allData.watched);
   if(watchedPending.length){
     await _preloadRunList(watchedPending,batchSize);
     saveTmdbCache();
     throttledRefreshStats(true); // izlenenler bitti - istatistikler artık kesin doğru, hemen göster
   }
   const watchlistPending=_pendingTmdbInfo(allData.watchlist);
   if(watchlistPending.length){
     await _preloadRunList(watchlistPending,batchSize);
     saveTmdbCache();
   }
 })();
 _preloadPromise=run.then(()=>{ throttledRefreshStats(true); }).catch(()=>{});
 _preloadPromise.finally(()=>{ _preloadPromise=null; });
 return _preloadPromise;
}

function searchMain(input,type){
 clearTimeout(searchTimer);
 searchGen[type]++;
 const myGen=searchGen[type];
 const raw=input.value.trim();
 // Not: burada eskiden reload() çağrılıyordu - bu, kutuya her harf yazıldığında
 // (kutu 3 karakterin altındayken) Firestore'dan TÜM listeyi yeniden çekip
 // tekrar çiziyordu. Elimizde zaten güncel veri (allData) varken bu gereksiz
 // ağ isteği, özellikle mobilde yazarken donmaya sebep oluyordu. Sadece yerel
 // veriyle normal görünüme dönmek (render) yeterli ve çok daha hızlı.
 if(raw.length<3){searchActive[type]=false;render();return;}
 searchActive[type]=true;
 searchTimer=setTimeout(()=>searchImmediate(raw,type,myGen),400);
}

async function searchTmdbTurkishImdbIds(query){
 try{
   const d=await fetchJson(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=tr-TR&query=${encodeURIComponent(query)}`);
   const results=(d.results||[]).slice(0,6);
   const ids=await Promise.all(results.map(async r=>{
     try{
       const ext=await fetchJson(`https://api.themoviedb.org/3/movie/${r.id}/external_ids?api_key=${TMDB_KEY}`);
       return ext.imdb_id||null;
     }catch(e){return null;}
   }));
   return ids.filter(Boolean);
 }catch(e){return [];}
}

async function searchImmediate(raw,type,myGen){
 const q=raw.toLowerCase();
 const list=type==="watched"?watchedList:watchList;
 list.innerHTML="Aranıyor...";

 if(q.startsWith("yönetmen:")){
   searchPerson(raw.split(":")[1].trim(),"Director",type,myGen);return;
 }
 if(q.startsWith("oyuncu:")){
   searchPerson(raw.split(":")[1].trim(),"Actor",type,myGen);return;
 }
 if(/^tt\d{7,9}$/.test(q)){
   searchByImdbId(q,type,myGen);return;
 }

 const [omdbRes,tmdbImdbIds]=await Promise.all([
   searchOmdb(raw),
   searchTmdbTurkishImdbIds(raw)
 ]);

 if(searchGen[type]!==myGen) return;

 const seen=new Set();
 const results=[];
 if(omdbRes && omdbRes.Search){
   omdbRes.Search.forEach(m=>{
     if(!seen.has(m.imdbID)){seen.add(m.imdbID);results.push(m);}
   });
 }

 const extraIds=tmdbImdbIds.filter(id=>!seen.has(id)).slice(0,5);
 if(extraIds.length){
   const extraMovies=await Promise.all(extraIds.map(id=>searchOmdb(id)));
   if(searchGen[type]!==myGen) return;
   extraMovies.forEach(m=>{
     if(m && m.Response!=="False" && !seen.has(m.imdbID)){
       seen.add(m.imdbID);
       results.push(m);
     }
   });
 }

 if(searchGen[type]!==myGen) return;
 list.innerHTML="";
 if(results.length){
   results.slice(0,8).forEach(m=>addSearchResultCard(m,type,myGen));
 }else{
   list.innerHTML="Sonuç bulunamadı";
 }
}

function searchByImdbId(id,type,myGen){
 searchOmdb(id).then(d=>{
   if(searchGen[type]!==myGen) return;
   const list=type==="watched"?watchedList:watchList;
   list.innerHTML="";
   if(d && d.Response!=="False"){
     addSearchResultCard(d,type,myGen);
   }
 });
}

function movieExists(imdbId){
 return allData.watched.some(m=>m.imdbID===imdbId) || allData.watchlist.some(m=>m.imdbID===imdbId);
}

function searchPerson(name,role,type,myGen){
 if(myGen===undefined){searchGen[type]++;myGen=searchGen[type];}
 fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}&language=tr-TR`)
 .then(r=>r.json())
 .then(d=>{
   if(searchGen[type]!==myGen) return;
   const person=d?.results?.[0];
   if(!person)return;
   fetch(`https://api.themoviedb.org/3/person/${person.id}/movie_credits?api_key=${TMDB_KEY}&language=tr-TR`)
   .then(r=>r.json())
   .then(credits=>{
     if(searchGen[type]!==myGen) return;
     const list=type==="watched"?watchedList:watchList;
     list.innerHTML="";
     const crew=Array.isArray(credits?.crew)?credits.crew:[];
     const cast=Array.isArray(credits?.cast)?credits.cast:[];
     let movies=role==="Director"?crew.filter(c=>c.job==="Director"):cast;
     // en popüler / bilinen filmler önce gelsin
     movies=movies.slice().sort((a,b)=>(b.popularity||0)-(a.popularity||0));
     let shown=0;
     movies.slice(0,20).forEach(m=>{
       if(!m.id || shown>=10)return;
       fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${TMDB_KEY}&append_to_response=external_ids`)
       .then(r=>r.json())
       .then(detail=>{
         if(searchGen[type]!==myGen) return;
         const imdbId=detail.external_ids?.imdb_id;
         if(imdbId && !movieExists(imdbId) && shown<10){
           searchOmdb(imdbId)
           .then(res=>{
             if(searchGen[type]!==myGen) return;
             if(res && res.Response!=="False" && !movieExists(imdbId)){
               shown++;
               addSearchResultCard(res,type,myGen);
             }
           });
         }
       })
       .catch(()=>{});
     });
   })
   .catch(()=>{});
 })
 .catch(()=>{});
}
