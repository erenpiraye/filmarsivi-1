<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<script>
// Telefonda HER ZAMAN sadece "İzlenen" ya da sadece "İzlenecek" listesi tam
// ekran gösterilir (ikisi birden dar telefon ekranında çok küçük kalıyordu).
// "İkisi birden" diye bir ara durum YOK - üstteki ⇄ butonu direkt diğerine geçirir.
// Seçim localStorage'da saklanır, bir dahaki açılışta hatırlanır.
(function(){
 var params=new URLSearchParams(location.search);
 var focus=localStorage.getItem("filmarsivi_focus");
 if(params.get("buyuk")==="izlenen") focus="watched"; // eski kısayol - hâlâ çalışır
 if(focus!=="watched" && focus!=="watchlist") focus="watched"; // varsayılan
 document.documentElement.classList.add("single-focus","focus-"+focus);
})();
</script>
<title>Film Arşivi</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#111;color:#eee;margin:0}
.container{display:flex;height:100vh}
.column{width:50%;padding:0;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.sticky-header{position:sticky;top:0;padding:20px 20px 10px 20px;background:#111;z-index:5;border-bottom:1px solid #222}
.list-wrap{padding:0 20px 20px 20px}
.column:first-child{border-right:2px solid #444}
h2{text-align:center;margin-bottom:10px;font-size:20px}
.list-header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.stat-card{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 8px;border-radius:10px;background:var(--acc-bg);border:1px solid var(--acc-border);cursor:pointer}
.stat-icon{width:28px;height:28px;border-radius:8px;background:var(--acc-solid);display:flex;align-items:center;justify-content:center;color:#161616;flex-shrink:0}
.stat-icon svg{width:16px;height:16px}
.stat-text{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.stat-label{font-size:12px;font-weight:700;color:var(--acc-text);letter-spacing:.2px}
.stat-count{font-size:17px;font-weight:800;color:#fff}
.time-pill{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;background:#1b1b1b;border:1px solid #333;color:#9d9d9d;font-size:12.5px;font-weight:600}
.time-pill svg{width:13px;height:13px;flex-shrink:0}
.list-header--watched{--acc-bg:rgba(217,164,65,0.14);--acc-border:rgba(217,164,65,0.4);--acc-solid:#e8c877;--acc-text:#f0d9a3}
.list-header--watchlist{--acc-bg:rgba(79,168,232,0.14);--acc-border:rgba(79,168,232,0.4);--acc-solid:#7ec1f2;--acc-text:#bcdff8}
.header-icons{display:inline-flex;align-items:center;gap:4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#1b1b1b;border:1px solid #333;color:#999;cursor:pointer;user-select:none;transition:background .15s ease,color .15s ease,border-color .15s ease}
.icon-btn:hover,.icon-btn:active{background:#262626;color:#e8c877;border-color:#4a4a4a}
.icon-btn svg{width:16px;height:16px;pointer-events:none}
.icon-btn.spinning svg{animation:icon-spin 0.8s linear infinite}
@keyframes icon-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.search{width:95%;padding:10px;margin:0 auto 8px auto;display:block;background:#333;color:#eee;border:1px solid #555;border-radius:4px;font-size:16px}
.sort-select{padding:6px 8px;font-size:13px;background:#222;color:#ccc;border:1px solid #444;border-radius:4px}
.movie{width:95%;display:flex;align-items:center;margin:0 auto 15px auto;background:#222;padding:12px 16px;border-radius:8px;position:relative}
.movie img{width:90px;height:135px;object-fit:cover;margin-right:15px;border-radius:4px}
.movie img.poster-link{cursor:pointer}
.number{font-size:2.2em;color:#555;width:80px;display:flex;justify-content:center;align-items:center;margin-right:20px}
.btn{margin-top:6px;padding:6px 12px;background:#555;color:#fff;border:none;border-radius:4px;cursor:pointer}
.add-poster{cursor:pointer}
.add-hint{font-size:11px;color:#888;margin-top:4px}
.movie{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.movie img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;user-drag:none;-webkit-touch-callout:none}
.dragging-source{opacity:0.35}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:0.9;box-shadow:0 6px 18px rgba(0,0,0,0.6);margin:0 !important}
.drop-indicator{width:95%;height:3px;margin:6px auto;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(217,164,65,0.25),#d9a441,#fff,#d9a441,rgba(217,164,65,0.25),transparent);background-size:200% 100%;animation:drop-shimmer 1.2s linear infinite;box-shadow:0 0 8px rgba(217,164,65,0.45)}
@keyframes drop-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.movie.drop-gap-before{margin-top:28px !important;transition:margin-top 0.12s ease}
.movie.drop-gap-after{margin-bottom:28px !important;transition:margin-bottom 0.12s ease}
.tick-btn{position:absolute;top:38px;right:10px;background:#333;color:#0f0;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.delete-btn{position:absolute;top:10px;right:10px;background:#333;color:#bbb;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.meta{font-size:13px;color:#bbb;margin-top:3px}
.money-budget,.money-revenue{color:#bbb}
.money-budget:empty,.money-revenue:empty{display:none}
.my-rating-line:empty{display:none}
.my-rating-line .my-star{color:#4fa8e8}
.meta-icon{display:inline-flex;width:16px;justify-content:center;align-items:center;vertical-align:-3px}
.tr-title{color:#888;font-size:13px;margin-top:2px}
.controls{width:95%;margin:0 auto 10px auto;display:flex;flex-wrap:wrap;gap:8px}
.controls .sort-select{flex:1 1 130px;min-width:110px}
.findbox{width:95%;padding:8px;margin:0 auto 12px auto;display:block;background:#222;color:#eee;border:1px solid #444;border-radius:4px;font-size:14px}
.movie.highlight{outline:3px solid #ffd700;box-shadow:0 0 14px #ffd700}
.person-link{color:inherit;text-decoration:none;cursor:pointer}
.person-link:hover{color:#d9a441;text-decoration:underline}

#watchedList.grid-view,#watchList.grid-view{width:95%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 15px;align-items:start}
.grid-view .movie{width:100%;margin:0;min-width:0;overflow:hidden}
.grid-view .movie .number{width:48px;font-size:1.3em;margin-right:10px;flex-shrink:0;flex-grow:0}
.grid-view .movie img{width:55px;height:82px;margin-right:10px;flex-shrink:0}
.grid-view .movie>div:not(.number){min-width:0;overflow-wrap:break-word}

.sync-bar{width:95%;margin:0 auto 10px auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-bar button{padding:6px 10px;background:#333;color:#eee;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:12px}
.sync-bar button:hover{opacity:0.8}
.sync-status{font-size:12px;color:#888}
@media (max-width:700px){
 .container{display:block;height:auto;min-height:100vh}
 .column{width:100%;overflow:visible}
 .column:first-child{border-right:none;border-bottom:2px solid #444}
 .sticky-header{padding:6px 12px 5px 12px}
 h2{font-size:13px;margin-bottom:4px}
 .search{padding:5px 8px;font-size:14px;margin-bottom:4px}
 .controls{gap:4px;margin-bottom:4px}
 .controls .sort-select{flex:1 1 47%;min-width:0;font-size:11px;padding:3px 5px}
 .findbox{padding:4px 8px;font-size:12px;margin-bottom:0}
 .list-wrap{padding:0 12px 12px 12px}
 .movie{padding:8px 10px;margin:0 auto 10px auto}
 .movie img{width:60px;height:90px;margin-right:10px}
 .number{font-size:1.3em;width:38px;margin-right:10px}
 .sync-bar{padding:5px 12px 0 12px!important;gap:6px}
 .sync-bar button{font-size:11px;padding:4px 7px}
 .sync-status{font-size:11px}
}
/* Yatay (landscape) telefon: dikey alan az, üst bloğu daha da sıkıştır */
@media (max-width:700px) and (orientation:landscape){
 .sticky-header{padding:4px 12px 3px 12px}
 h2{font-size:12px;margin-bottom:3px}
 .search{padding:3px 6px;font-size:13px;margin-bottom:3px}
 .controls{gap:3px;margin-bottom:3px}
 .controls .sort-select{font-size:10px;padding:2px 4px}
 .findbox{padding:3px 6px;font-size:11px}
 .sync-bar{padding:3px 12px 0 12px!important}
}
/* ===================== TEK LİSTE ODAK MODU (mobilde ikisi birden küçük kaldığında) ===================== */
/* header'daki ⇄ butonuna basınca ya da eski ?buyuk=izlenen linkiyle aktif olur */
html.focus-watched .column[data-type="watchlist"]{display:none}
html.focus-watchlist .column[data-type="watched"]{display:none}
html.single-focus .column{width:100%}
html.single-focus h2{font-size:22px}
html.single-focus .search{font-size:20px;padding:12px}
html.single-focus .findbox{font-size:18px;padding:10px}
html.single-focus .controls .sort-select{font-size:16px;padding:8px 10px}
html.single-focus .movie{padding:16px 14px}
html.single-focus .movie .number{font-size:2em;width:60px}
html.single-focus .movie img{width:85px;height:127px}
html.single-focus .movie b{font-size:19px}
html.single-focus .movie .meta{font-size:16px}
html.single-focus .movie .tr-title{font-size:16px}

/* ===================== DETAY MODALI (afişe/karta tıklayınca açılır) ===================== */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.detail-overlay.open{display:flex}
.detail-modal{position:relative;width:100%;max-width:820px;background:#181818;border:1px solid #3a3222;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);touch-action:pan-y}
.detail-backdrop{position:absolute;top:0;left:0;right:0;height:260px;background-size:cover;background-position:center;filter:blur(2px) brightness(0.5);z-index:0}
.detail-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,24,24,0.2) 0%,#181818 95%)}
.detail-close{position:absolute;top:14px;right:16px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.55);color:#eee;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.detail-close:hover{background:rgba(0,0,0,0.8)}
.detail-top{position:relative;z-index:1;display:flex;align-items:center;gap:20px;padding:24px}
.detail-poster{width:130px;height:195px;object-fit:cover;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,0.5);flex-shrink:0}
.detail-top-info{flex:1;min-width:0}
.detail-badges{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-bottom:8px}
.detail-badge{background:rgba(217,164,65,0.14);border:1px solid rgba(217,164,65,0.4);color:#e8c877;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center}
.detail-link-btn{background:none;text-decoration:none;cursor:pointer;min-width:56px}
.detail-imdb-link{border-color:#d9a441;color:#181818;background:#d9a441}
.detail-imdb-link:hover{background:#e8b955}
.detail-tmdb-link{border-color:#01b4e4;color:#01b4e4;background:rgba(1,180,228,0.12)}
.detail-tmdb-link:hover{background:rgba(1,180,228,0.22)}
.detail-trailer-link{border-color:#e85d4f;color:#ffb3a8;background:rgba(232,93,79,0.12)}
.detail-trailer-link:hover{background:rgba(232,93,79,0.22)}
.detail-title{margin:4px 0 2px 0;font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.6);text-align:left}
.detail-tr-title{color:#ccc;font-size:17px;margin-top:2px;min-height:21px;line-height:1.3}
.detail-body{position:relative;z-index:1;padding:0 24px 24px 24px}
.detail-ratings-row{display:flex;gap:14px;margin-bottom:16px}
.detail-rating-box{flex:1;display:flex;align-items:center;gap:10px;background:#222;border:1px solid #3a3222;border-radius:8px;padding:10px 14px}
.detail-rating-icon{font-size:20px;width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(217,164,65,0.14);color:#e8c877}
.detail-rating-icon.my-rating-icon{background:rgba(79,168,232,0.14);color:#4fa8e8}
.detail-rating-label{font-size:12px;color:#999}
.detail-rating-value{font-size:19px;font-weight:bold;color:#e8c877}
.detail-my-rating-col{flex:1;min-width:0}
.detail-my-rating-wrap{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.detail-my-rating{width:56px;background:#181818;color:#4fa8e8;border:1px solid #4fa8e8;border-radius:6px;padding:5px 6px;font-size:18px;font-weight:bold;text-align:center}
.detail-my-rating:focus{outline:none;border-color:#7cc3f0;box-shadow:0 0 0 2px rgba(79,168,232,0.3)}
.detail-my-rating::placeholder{color:#4a6a80;font-weight:normal}
.detail-my-rating::-webkit-inner-spin-button,.detail-my-rating::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.detail-my-rating-suffix{font-size:12px;color:#888}
.detail-added-date{color:#aaa;font-size:13px;margin-bottom:16px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:13px;color:#d9a441;font-weight:bold;margin-bottom:6px}
.detail-plot{background:#202020;border:1px solid #333;border-radius:8px;padding:12px 14px;color:#ddd;line-height:1.5;font-size:14px}
.detail-money-row{display:flex;gap:14px;margin-bottom:16px}
.detail-money-box{flex:1;background:#202020;border:1px solid #333;border-radius:8px;padding:10px 14px}
.detail-money-box:empty,.detail-money-row:has(#detailBudget:empty):has(#detailRevenue:empty){display:none}
.detail-people-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.detail-people-box{flex:1;min-width:180px;background:#202020;border:1px solid #333;border-radius:8px;padding:10px 14px;color:#ddd;font-size:13px}
.detail-people-box a.person-link:hover{color:#d9a441}
.detail-person-link{cursor:pointer}
.detail-person-link:hover{color:#d9a441;text-decoration:underline}
.detail-genres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.detail-genre-tag{background:rgba(217,164,65,0.14);border:1px solid rgba(217,164,65,0.35);color:#e8c877;padding:4px 10px;border-radius:5px;font-size:12px}
.detail-cast-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.person-photo-card{flex-shrink:0;width:140px;cursor:pointer;background:#202020;border:1px solid #333;border-radius:8px;overflow:hidden;transition:border-color .15s}
.person-photo-card:hover{border-color:#d9a441}
.person-photo-wrap{position:relative;width:140px;height:180px;overflow:hidden;background:#2a2a2a}
.person-photo{width:100%;height:100%;object-fit:cover;display:block}
.person-photo-info{padding:8px 10px}
.person-photo-name{font-size:13px;color:#eee;font-weight:bold;line-height:1.25}
.person-photo-character{font-size:12px;color:#999;margin-top:2px;line-height:1.2}
.detail-footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #2a2a2a;background:#151515}
.detail-cancel{color:#999;cursor:pointer;font-size:14px}
.detail-cancel:hover{color:#ccc}
.detail-save-btn{background:linear-gradient(135deg,#d9a441,#c98f2b);color:#181818;border:none;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px}
.detail-save-btn:hover{filter:brightness(1.08)}
/* Telefonda modal tam ekran, tek ekrana sığacak şekilde sıkıştırılmış boşluk/yazı boyutları */
@media (max-width:600px){
 .detail-overlay{padding:0}
 .detail-modal{max-width:none;border-radius:0;min-height:100vh}
 .detail-top{padding:14px;gap:12px}
 .detail-poster{width:80px;height:120px}
 .detail-title{font-size:19px;margin:2px 0 1px 0}
 .detail-tr-title{font-size:14px;min-height:18px}
 .detail-badge{font-size:11px;padding:3px 8px}
 .detail-body{padding:0 14px 14px 14px}
 .detail-ratings-row{gap:8px;margin-bottom:10px}
 .detail-rating-box{padding:7px 10px;gap:7px}
 .detail-rating-icon{width:28px;height:28px;font-size:15px}
 .detail-rating-label{font-size:10.5px}
 .detail-rating-value{font-size:16px}
 .detail-my-rating{width:46px;font-size:15px;padding:3px 5px}
 .detail-added-date{font-size:12px;margin-bottom:10px}
 .detail-section{margin-bottom:10px}
 .detail-section-title{font-size:12px;margin-bottom:4px}
 .detail-plot{padding:9px 11px;font-size:12.5px;line-height:1.4;max-height:88px;overflow-y:auto}
 .detail-money-row{gap:8px;margin-bottom:10px}
 .detail-money-box{padding:7px 10px}
 .detail-people-row{gap:8px;margin-bottom:10px}
 .detail-people-box{padding:7px 10px;font-size:12px;min-width:0}
 .detail-genres{margin-bottom:10px;gap:6px}
 .detail-genre-tag{font-size:11px;padding:3px 8px}
 .person-photo-card{width:112px}
 .person-photo-wrap{width:112px;height:148px}
 .person-photo-name{font-size:12px}
 .person-photo-character{font-size:11px}
 .detail-footer{padding:10px 14px}
}
</style>
</head>
<body>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
 <div class="detail-modal" id="detailModalBox">
  <div class="detail-backdrop" id="detailBackdrop"></div>
  <span class="detail-close" onclick="closeDetail()">✕</span>
  <div class="detail-top">
   <img class="detail-poster" id="detailPoster" src="">
   <div class="detail-top-info">
    <div class="detail-badges">
     <span class="detail-badge" id="detailYear"></span>
     <span class="detail-badge" id="detailRuntime"></span>
     <a class="detail-badge detail-link-btn detail-imdb-link" id="detailImdbLink" href="#" onclick="return false;">IMDb</a>
     <a class="detail-badge detail-link-btn detail-tmdb-link" id="detailTmdbLink" href="#" onclick="return false;">TMDB</a>
     <a class="detail-badge detail-link-btn detail-trailer-link" id="detailTrailerLink" href="#" onclick="return false;">▶ Fragman</a>
    </div>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="detail-tr-title" id="detailTrTitle"></div>
   </div>
  </div>

  <div class="detail-body">
   <div class="detail-ratings-row">
    <div class="detail-rating-box imdb-box">
     <span class="detail-rating-icon">⭐</span>
     <div>
      <div class="detail-rating-label">IMDb Puanı</div>
      <div class="detail-rating-value" id="detailImdbRating"></div>
     </div>
    </div>
    <div class="detail-rating-box my-box">
     <span class="detail-rating-icon my-rating-icon" id="detailMyRatingIcon"></span>
     <div class="detail-my-rating-col">
      <div class="detail-rating-label">Kendi Puanım</div>
      <div class="detail-my-rating-wrap">
       <input class="detail-my-rating" id="detailMyRating" type="text" inputmode="decimal" placeholder="–">
       <span class="detail-my-rating-suffix">/ 10</span>
      </div>
     </div>
    </div>
   </div>

   <div class="detail-added-date">📅 Eklenme Tarihi: <span id="detailAddedDate"></span></div>

   <div class="detail-section">
    <div class="detail-section-title">📄 Konusu / Özet</div>
    <div class="detail-plot" id="detailPlot"></div>
   </div>

   <div class="detail-money-row" id="detailMoneyRow">
    <div class="detail-money-box" id="detailBudgetBox">
     <div class="detail-section-title">💰 Bütçe</div>
     <div id="detailBudget"></div>
    </div>
    <div class="detail-money-box" id="detailRevenueBox">
     <div class="detail-section-title">💵 Hasılat</div>
     <div id="detailRevenue"></div>
    </div>
   </div>

   <div class="detail-people-row">
    <div class="detail-people-box">
     <div class="detail-section-title">🎬 Yönetmen</div>
     <div id="detailDirector">—</div>
    </div>
    <div class="detail-people-box">
     <div class="detail-section-title">✍️ Senaristler</div>
     <div id="detailWriter">—</div>
    </div>
   </div>

   <div class="detail-section">
    <div class="detail-section-title">🎭 Oyuncular</div>
    <div class="detail-cast-row" id="detailCastRow"></div>
   </div>

   <div class="detail-genres" id="detailGenres"></div>

/* ===================== TÜRKÇE BİLGİ (başlık / poster / kategori) ===================== */

async function loadGenreMap(){
 if(genreMapLoaded) return;
 try{
   const d=await fetchJson(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_KEY}&language=tr-TR`);
   (d.genres||[]).forEach(g=>genreMap[g.id]=g.name);
 }catch(e){}
 genreMapLoaded=true;
}

function isTmdbKeyError(status,data){
 if(status===401) return true;
 if(status===429) return true; // TMDB hız sınırı - bu anahtarla devam etmenin anlamı yok, sıradakine geç
 if(data && data.success===false && (data.status_code===7 || /invalid api key/i.test(data.status_message||""))) return true;
 return false;
}

async function fetchJson(url,timeoutMs=12000){
 for(let attempt=0; attempt<TMDB_KEYS.length; attempt++){
   const controller=new AbortController();
   const t=setTimeout(()=>controller.abort(),timeoutMs);
   try{
     const r=await fetch(url,{signal:controller.signal});
     const data=await r.json();
     if(isTmdbKeyError(r.status,data) && attempt<TMDB_KEYS.length-1){
       const oldKey=TMDB_KEY;
       tmdbKeyIndex=(tmdbKeyIndex+1)%TMDB_KEYS.length;
       TMDB_KEY=TMDB_KEYS[tmdbKeyIndex];
       url=url.split(oldKey).join(TMDB_KEY);
       continue;
     }
     return data;
   }catch(e){
     if(attempt<TMDB_KEYS.length-1){
       const oldKey=TMDB_KEY;
       tmdbKeyIndex=(tmdbKeyIndex+1)%TMDB_KEYS.length;
       TMDB_KEY=TMDB_KEYS[tmdbKeyIndex];
       url=url.split(oldKey).join(TMDB_KEY);
       continue;
     }
     throw e;
   }finally{
     clearTimeout(t);
   }
 }
}

// Sayıyı TMDB'deki gibi tam rakamlı para birimi metnine çevirir: 150000000 -> "$150,000,000". 0/boş ise null döner.
function formatMoney(n){
 n=Number(n);
 if(!n||n<=0) return null;
 return "$"+Math.round(n).toLocaleString("en-US");
}

// OMDb'nin "BoxOffice" alanı ("$325,873,309" gibi) ham metnini sayıya çevirir.
function parseOmdbMoney(s){
 if(!s||s==="N/A") return null;
 const n=Number(String(s).replace(/[^0-9]/g,""));
 return n>0?n:null;
}

// Kart üzerinde gösterilecek bütçe/hasılat metinlerini AYRI AYRI üretir (alt
// alta iki satır olacak, PC sürümüyle birebir aynı). Bütçe SADECE TMDB'den
// gelir (OMDb bütçe bilgisi vermez). Hasılat için önce TMDB'nin (dünya
// geneli) revenue'su denenir, o yoksa OMDb'nin BoxOffice'i (genelde sadece
// ABD gişesi) yedek olarak kullanılır.
function moneyLines(omdbBoxOffice,info){
 const budget=formatMoney(info&&info.budget);
 const revenue=formatMoney(info&&info.revenue)||formatMoney(parseOmdbMoney(omdbBoxOffice));
 return {
   budget: budget?`<span class="meta-icon">💰</span> Bütçe: ${budget}`:"",
   revenue: revenue?`<span class="meta-icon">💵</span> Hasılat: ${revenue}`:""
 };
}

async function getTurkishInfo(imdbID,title,year){
 const cached=turkishCache[imdbID];
 // _v2: bu alanı SADECE tmdbId/oyuncu desteği eklenen yeni kod dolduruyor.
 // Eski (bu özellikten önceki) önbellek kayıtlarında _checked=true olsa
 // bile _v2 yok - bu yüzden TMDB butonu/oyuncular kalıcı olarak hiç
 // gelmiyordu. _v2 kontrolü, eski kayıtlar için bir kereliğine sessiz bir
 // yeniden-çekmeye (migrasyon) zorluyor; sonrasında normal şekilde önbellekten okunur.
 if(cached && cached._checked && cached._v2) return cached;
 const info={title:null,poster:null,genres:[],budget:null,revenue:null,overview:null,backdrop:null,tmdbId:null};
 if(cached) Object.assign(info,cached); // eski önbellekte olan (başlık/poster/tür) alanları koru, eksikleri tamamlayacağız
 try{
   const data=await fetchJson(`https://api.themoviedb.org/3/find/${imdbID}?api_key=${TMDB_KEY}&external_source=imdb_id&language=tr-TR`);
   let movie=data.movie_results?.[0]||null;

   if(!movie && title){
     const trySearch=async(withYear)=>{
       let url=`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=tr-TR&query=${encodeURIComponent(title)}`;
       const y=parseInt(year);
       if(withYear && !isNaN(y)) url+=`&year=${y}`;
       try{
         const d=await fetchJson(url);
         return d.results?.[0]||null;
       }catch(e){return null;}
     };
     movie=await trySearch(true);
     if(!movie) movie=await trySearch(false);
   }

   if(movie){
     info.tmdbId=movie.id;
     if(movie.title) info.title=movie.title;
     if(movie.poster_path) info.poster=`https://image.tmdb.org/t/p/w200${movie.poster_path}`;
     if(movie.overview) info.overview=movie.overview;
     if(movie.backdrop_path) info.backdrop=`https://image.tmdb.org/t/p/w780${movie.backdrop_path}`;
     if(movie.genre_ids && movie.genre_ids.length){
       info.genres=movie.genre_ids.map(id=>genreMap[id]).filter(Boolean);
     }
     // Bütçe/hasılat (ve overview/backdrop find sonucunda gelmediyse onlar da) ayrı bir detay isteği gerektirir.
     try{
       const det=await fetchJson(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TMDB_KEY}&language=tr-TR`);
       if(det){
         if(det.budget) info.budget=det.budget;
         if(det.revenue) info.revenue=det.revenue;
         if(!info.overview && det.overview) info.overview=det.overview;
         if(!info.backdrop && det.backdrop_path) info.backdrop=`https://image.tmdb.org/t/p/w780${det.backdrop_path}`;
       }
     }catch(e){}
   }
   info._v2=true; // bu deneme (find/search) ağ hatası almadan tamamlandı - eski/yeni ayrımı için işaretle
 }catch(e){}
 // sadece gerçekten bir sonuç bulduysak kalıcı olarak önbelleğe al (_checked=true) -
 // ki bir daha bu film için hiç istek atılmasın. Toptan başarısızlıkta (ağ hatası vb.)
 // _checked eklenmez, bir sonraki denemede tekrar denenir.
 if(info.title || info.poster || info.genres.length || info.overview || info.backdrop || info.tmdbId){
   info._checked=true;
   turkishCache[imdbID]=info;
 }
 return info;
}

async function preloadInfo(){
 await loadGenreMap();
 const all=[...allData.watched,...allData.watchlist].filter(m=>{
   const c=turkishCache[m.imdbID];
   return !c || !c._checked || !c._v2;
 });
 const batchSize=5;
 for(let i=0;i<all.length;i+=batchSize){
   const batch=all.slice(i,i+batchSize);
   await Promise.all(batch.map(m=>getTurkishInfo(m.imdbID,m.Title,m.Year)));
   refreshCardsInPlace();
   if(i+batchSize<all.length) await new Promise(res=>setTimeout(res,150));
 }
}

/* ===================== ARAMA ===================== */

function searchMain(input,type){
 clearTimeout(searchTimer);
 searchGen[type]++;
 const myGen=searchGen[type];
 const raw=input.value.trim();
 if(raw.length<3){searchActive[type]=false;reload();return;}
 searchActive[type]=true;
 searchTimer=setTimeout(()=>searchImmediate(raw,type,myGen),400);
}

async function searchTmdbTurkishImdbIds(query){
 try{
   const d=await fetchJson(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=tr-TR&query=${encodeURIComponent(query)}`);
   const results=(d.results||[]).slice(0,6);
   const ids=await Promise.all(results.map(async r=>{
     try{
       const ext=await fetchJson(`https://api.themoviedb.org/3/movie/${r.id}/external_ids?api_key=${TMDB_KEY}`);
       return ext.imdb_id||null;
     }catch(e){return null;}
   }));
   return ids.filter(Boolean);
 }catch(e){return [];}
}

async function searchImmediate(raw,type,myGen){
 const q=raw.toLowerCase();
 const list=type==="watched"?watchedList:watchList;
 list.innerHTML="Aranıyor...";

 if(q.startsWith("yönetmen:")){
   searchPerson(raw.split(":")[1].trim(),"Director",type,myGen);return;
 }
 if(q.startsWith("oyuncu:")){
   searchPerson(raw.split(":")[1].trim(),"Actor",type,myGen);return;
 }
 if(/^tt\d{7,9}$/.test(q)){
   searchByImdbId(q,type,myGen);return;
 }

 const [omdbRes,tmdbImdbIds]=await Promise.all([
   searchOmdb(raw),
   searchTmdbTurkishImdbIds(raw)
 ]);

 if(searchGen[type]!==myGen) return;

 const seen=new Set();
 const results=[];
 if(omdbRes && omdbRes.Search){
   omdbRes.Search.forEach(m=>{
     if(!seen.has(m.imdbID)){seen.add(m.imdbID);results.push(m);}
   });
 }

 const extraIds=tmdbImdbIds.filter(id=>!seen.has(id)).slice(0,5);
 if(extraIds.length){
   const extraMovies=await Promise.all(extraIds.map(id=>searchOmdb(id)));
   if(searchGen[type]!==myGen) return;
   extraMovies.forEach(m=>{
     if(m && m.Response!=="False" && !seen.has(m.imdbID)){
       seen.add(m.imdbID);
       results.push(m);
     }
   });
 }

 if(searchGen[type]!==myGen) return;
 list.innerHTML="";
 if(results.length){
   results.slice(0,8).forEach(m=>addSearchResultCard(m,type,myGen));
 }else{
   list.innerHTML="Sonuç bulunamadı";
 }
}

function searchByImdbId(id,type,myGen){
 searchOmdb(id).then(d=>{
   if(searchGen[type]!==myGen) return;
   const list=type==="watched"?watchedList:watchList;
   list.innerHTML="";
   if(d && d.Response!=="False"){
     addSearchResultCard(d,type,myGen);
   }
 });
}

function movieExists(imdbId){
 return allData.watched.some(m=>m.imdbID===imdbId) || allData.watchlist.some(m=>m.imdbID===imdbId);
}

function searchPerson(name,role,type,myGen){
 if(myGen===undefined){searchGen[type]++;myGen=searchGen[type];}
 fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&query=${encodeURIComponent(name)}&language=tr-TR`)
 .then(r=>r.json())
 .then(d=>{
   if(searchGen[type]!==myGen) return;
   const person=d?.results?.[0];
   if(!person)return;
   fetch(`https://api.themoviedb.org/3/person/${person.id}/movie_credits?api_key=${TMDB_KEY}&language=tr-TR`)
   .then(r=>r.json())
   .then(credits=>{
     if(searchGen[type]!==myGen) return;
     const list=type==="watched"?watchedList:watchList;
     list.innerHTML="";
     const crew=Array.isArray(credits?.crew)?credits.crew:[];
     const cast=Array.isArray(credits?.cast)?credits.cast:[];
     let movies=role==="Director"?crew.filter(c=>c.job==="Director"):cast;
     // en popüler / bilinen filmler önce gelsin
     movies=movies.slice().sort((a,b)=>(b.popularity||0)-(a.popularity||0));
     let shown=0;
     movies.slice(0,20).forEach(m=>{
       if(!m.id || shown>=10)return;
       fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${TMDB_KEY}&append_to_response=external_ids`)
       .then(r=>r.json())
       .then(detail=>{
         if(searchGen[type]!==myGen) return;
         const imdbId=detail.external_ids?.imdb_id;
         if(imdbId && !movieExists(imdbId) && shown<10){
           searchOmdb(imdbId)
           .then(res=>{
             if(searchGen[type]!==myGen) return;
             if(res && res.Response!=="False" && !movieExists(imdbId)){
               shown++;
               addSearchResultCard(res,type,myGen);
             }
           });
         }
       })
       .catch(()=>{});
     });
   })
   .catch(()=>{});
 })
 .catch(()=>{});
}

/* ===================== SÜRÜKLE-BIRAK (kart taşıma) ===================== */
// SADECE FARE (masaüstü tarayıcı) ile çalışır. Telefonda/dokunmatikte kart
// sürükleme KAPATILDI: parmakla basılı tutup sürüklemeye çalışırken sayfanın
// aynı anda kayması (scroll ile çakışması) yüzünden verimsiz/kontrolsüz
// çalışıyordu, bu yüzden dokunmatik sürükleme tamamen devre dışı bırakıldı.
// Telefonda kartlar artık normal şekilde kaydırılabilir (scroll), taşıma
// işlemi yapılamaz; taşımak için "izlendi" (✔) veya "sil" (✕) butonları,
// ya da PC'den (fare ile) sürükleme kullanılabilir.
const LONG_PRESS_MS=300;
const DRAG_MOVE_THRESHOLD=8; // fare: düz tıkla sürüklemeyi ayırt etmek için (fare titremez, dar tutulabilir)
const TOUCH_CANCEL_THRESHOLD=20; // (artık kullanılmıyor, dokunmatik sürükleme kapalı)

function canReorderList(type){
 if(sortState[type]!=="added-desc" && sortState[type]!=="added-asc") return false;
 if(genreState[type]!=="all" || directorState[type]!=="all" || actorState[type]!=="all") return false;
 if(searchActive[type]) return false;
 return true;
}

function getSortedDisplayIds(type){
 let indexed=allData[type].map((m,i)=>({m,i}));
 indexed=sortIndexed(indexed,sortState[type]);
 return indexed.map(x=>x.m.imdbID);
}

// displayIds (o listede GÖRÜNECEK yeni sıra) dizisine göre allData[type]'ı
// fiilen o sıraya sokar (added-desc ise ters çevirip saklıyoruz, added-asc
// ise doğrudan - dizinin kendi konumu = sıralama anahtarı). movedId verilirse
// SADECE o filmin _addedAt/_updatedAt alanı newAddedAt ile güncellenir; diğer
// hiçbir filme dokunulmaz.
function applyDisplayOrder(type,displayIds,movedId,newAddedAt){
 const sort=sortState[type];
 const map=new Map(allData[type].map(m=>[m.imdbID,m]));
 let newArray=(sort==="added-desc")
   ?displayIds.slice().reverse().map(id=>map.get(id)).filter(Boolean)
   :displayIds.map(id=>map.get(id)).filter(Boolean);
 if(movedId!=null){
   const now=Date.now();
   newArray=newArray.map(m=>m.imdbID===movedId?{...m,_addedAt:newAddedAt,_updatedAt:now}:m);
 }
 allData[type]=newArray;
}

function getListEl(type){
 return type==="watchlist"?watchList:watchedList;
}

function getInsertIndex(listEl,clientY){
 const cards=Array.from(listEl.querySelectorAll(".movie:not(.dragging-source)"));
 for(let i=0;i<cards.length;i++){
   const rect=cards[i].getBoundingClientRect();
   if(clientY<rect.top+rect.height/2) return i;
 }
 return cards.length;
}

let dropIndicatorEl=null;
let dropGapEl=null;
let dropGapMode=null;

function clearDropVisuals(){
 if(dropIndicatorEl && dropIndicatorEl.parentNode) dropIndicatorEl.remove();
 dropIndicatorEl=null;
 if(dropGapEl){
   dropGapEl.classList.remove("drop-gap-before","drop-gap-after");
   dropGapEl=null;
   dropGapMode=null;
 }
}

function showDropVisual(listEl,insertIndex){
 clearDropVisuals();
 const cards=Array.from(listEl.querySelectorAll(".movie:not(.dragging-source)"));
 dropIndicatorEl=document.createElement("div");
 dropIndicatorEl.className="drop-indicator";
 if(insertIndex>=cards.length){
   listEl.appendChild(dropIndicatorEl);
   if(cards.length){
     dropGapEl=cards[cards.length-1];
     dropGapMode="after";
     dropGapEl.classList.add("drop-gap-after");
   }
 }else{
   listEl.insertBefore(dropIndicatorEl,cards[insertIndex]);
   dropGapEl=cards[insertIndex];
   dropGapMode="before";
   dropGapEl.classList.add("drop-gap-before");
 }
}

// Bırakılan yerdeki iki komşu arasına denk gelecek TEK bir _addedAt değeri
// hesaplar (idsExcludingMoved: sürüklenen film çıkarılmış hedef sıradaki id
// listesi, k: o listede bırakılacağı konum). Gerçek "şu an"ı ASLA geçmez -
// eskiden burada tüm listenin zaman damgası yeniden yazılıyordu ve üst
// sıradaki filmler dakikalarca "gelecek" bir tarihe sahip oluyordu; az sonra
// eklenen yeni bir film o yüzden en üste değil, onların altına düşüyordu.
function computeNeighborAddedAt(type,idsExcludingMoved,k){
 const mode=sortState[type];
 const map=new Map(allData[type].map(m=>[m.imdbID,m]));
 const getAt=m=>(m&&typeof m._addedAt==="number")?m._addedAt:0;
 const beforeM=k>0?map.get(idsExcludingMoved[k-1]):null;
 const afterM=k<idsExcludingMoved.length?map.get(idsExcludingMoved[k]):null;

 if(beforeM && afterM) return Math.round((getAt(beforeM)+getAt(afterM))/2);

 // "en yeni" ucu: added-desc'te üst uç (after var, before yok);
 // added-asc'te alt uç (before var, after yok).
 const becomesNewest=(mode==="added-desc"&&afterM&&!beforeM)||(mode==="added-asc"&&beforeM&&!afterM);
 if(becomesNewest) return Math.max(Date.now(),getAt(afterM||beforeM)+1);
 if(afterM) return getAt(afterM)-1000;
 if(beforeM) return getAt(beforeM)-1000;
 return Date.now();
}

function persistMovedItem(type,id,newAddedAt){
 saveToCache();
 db.collection(type).doc(id).update({_addedAt:newAddedAt,_updatedAt:Date.now()}).catch(e=>console.error(e));
}

function reorderInList(type,id,toDisplayIndex){
 if(!canReorderList(type)) return;
 const ids=getSortedDisplayIds(type);
 const fromIdx=ids.indexOf(id);
 if(fromIdx===-1) return;
 const adjustedIndex=fromIdx<toDisplayIndex?toDisplayIndex-1:toDisplayIndex;
 if(adjustedIndex===fromIdx) return;

 const others=ids.filter(x=>x!==id);
 const k=Math.max(0,Math.min(adjustedIndex,others.length));
 const newAddedAt=computeNeighborAddedAt(type,others,k);

 ids.splice(fromIdx,1);
 ids.splice(adjustedIndex,0,id);
 applyDisplayOrder(type,ids,id,newAddedAt);
 render();
 persistMovedItem(type,id,newAddedAt);
}

async function moveToListAt(id,fromType,toType,toDisplayIndex){
 const idx=allData[fromType].findIndex(m=>m.imdbID===id);
 if(idx===-1) return;
 const movie=allData[fromType][idx];

 let newAddedAt=Date.now();
 let targetIds=null;
 if(canReorderList(toType)){
   targetIds=getSortedDisplayIds(toType); // hedefte henüz "id" yok
   const k=Math.max(0,Math.min(toDisplayIndex,targetIds.length));
   newAddedAt=computeNeighborAddedAt(toType,targetIds,k);
   targetIds=targetIds.slice();
   targetIds.splice(k,0,id); // yeni film, bırakıldığı tam konuma ekleniyor
 }

 allData[fromType]=allData[fromType].filter(m=>m.imdbID!==id);
 const now=Date.now();
 allData[toType]=[...allData[toType],{...movie,_addedAt:newAddedAt,_updatedAt:now}];
 if(targetIds) applyDisplayOrder(toType,targetIds,null,null);
 render();
 saveToCache();

 try{
   const srcSnap=await db.collection(fromType).doc(id).get();
   if(!srcSnap.exists) return;
   const data=srcSnap.data();
   data._addedAt=newAddedAt;
   data._updatedAt=now;
   await db.collection(toType).doc(id).set(data);
   await db.collection(fromType).doc(id).delete();
 }catch(e){
   console.error(e);
   allData[toType]=allData[toType].filter(m=>m.imdbID!==id);
   allData[fromType]=[...allData[fromType],movie];
   render();
   saveToCache();
 }
}


document.addEventListener("dragstart",e=>{ if(e.target.closest(".movie")) e.preventDefault(); });

function attachDragHandlers(cardEl,id,type){
 let dragging=false, longPressTimer=null, ghost=null, startX=0, startY=0, capturedPointerId=null;
 let lastTargetType=null, lastInsertIndex=0, lastClientX=0, lastClientY=0;

 function positionGhost(x,y){
   if(!ghost) return;
   ghost.style.left=(x-ghost.offsetWidth/2)+"px";
   ghost.style.top=(y-ghost.offsetHeight/2)+"px";
 }

 function getColumnAt(x,y){
   if(ghost) ghost.style.visibility="hidden";
   const el=document.elementFromPoint(x,y);
   if(ghost) ghost.style.visibility="";
   const col=el&&el.closest(".column");
   return col?col.dataset.type:null;
 }

 function updateDropTarget(clientX,clientY){
   const targetType=getColumnAt(clientX,clientY);
   lastTargetType=targetType;
   if(!targetType){
     clearDropVisuals();
     return;
   }
   const sameColumn=targetType===type;
   const canPlace=sameColumn?canReorderList(type):canReorderList(targetType);
   if(!canPlace){
     clearDropVisuals();
     lastInsertIndex=0;
     return;
   }
   const listEl=getListEl(targetType);
   lastInsertIndex=getInsertIndex(listEl,clientY);
   showDropVisual(listEl,lastInsertIndex);
 }

 function startDrag(e){
   dragging=true;
   ghost=cardEl.cloneNode(true);
   ghost.className="movie drag-ghost";
   ghost.style.width=cardEl.offsetWidth+"px";
   document.body.appendChild(ghost);
   positionGhost(e.clientX,e.clientY);
   cardEl.classList.add("dragging-source");
   updateDropTarget(e.clientX,e.clientY);
 }

 function onMove(e){
   lastClientX=e.clientX; lastClientY=e.clientY;
   if(!dragging){
     const moved=Math.abs(e.clientX-startX)>DRAG_MOVE_THRESHOLD||Math.abs(e.clientY-startY)>DRAG_MOVE_THRESHOLD;
     if(!moved) return;
     // Fare: gerçekten birkaç piksel hareket etmeden sürükleme başlamasın -
     // yoksa düz bir TIK bile "sürükleme" sayılıp kartı yanlış yere taşıyordu.
     startDrag(e);
   }
   e.preventDefault();
   positionGhost(e.clientX,e.clientY);
   updateDropTarget(e.clientX,e.clientY);
 }

 function cleanup(){
   clearTimeout(longPressTimer);
   cardEl.removeEventListener("pointermove",onMove);
   cardEl.removeEventListener("pointerup",onUp);
   cardEl.removeEventListener("pointercancel",onUp);
   if(capturedPointerId!==null && cardEl.releasePointerCapture){
     try{ cardEl.releasePointerCapture(capturedPointerId); }catch(err){}
   }
   capturedPointerId=null;
   clearDropVisuals();
   cardEl.classList.remove("dragging-source");
   if(ghost){ ghost.remove(); ghost=null; }
 }

 function onUp(e){
   const wasDragging=dragging;
   const targetType=wasDragging?lastTargetType:null;
   const insertIndex=lastInsertIndex;
   dragging=false;
   cleanup();
   if(!wasDragging || !targetType) return;
   if(targetType===type){
     if(canReorderList(type)) reorderInList(type,id,insertIndex);
   }else if(canReorderList(targetType)){
     moveToListAt(id,type,targetType,insertIndex);
   }else if(targetType==="watched"){
     move(id);
   }else{
     moveToWatchlist(id);
   }
 }

 cardEl.addEventListener("pointerdown",e=>{
   if(e.pointerType && e.pointerType!=="mouse") return; // dokunmatikte sürükleme kapalı - sayfa normal kayar
   if(e.button!==undefined && e.button!==0) return;
   if(e.target.closest(".delete-btn,.tick-btn,.poster-link,.person-link")) return;
   e.preventDefault();
   startX=e.clientX; startY=e.clientY;
   lastClientX=e.clientX; lastClientY=e.clientY;
   lastTargetType=null;
   lastInsertIndex=0;
   capturedPointerId=e.pointerId;
   if(cardEl.setPointerCapture){
     try{ cardEl.setPointerCapture(capturedPointerId); }catch(err){}
   }
   cardEl.addEventListener("pointermove",onMove);
   cardEl.addEventListener("pointerup",onUp);
   cardEl.addEventListener("pointercancel",onUp);
   // Fare: sürükleme burada başlamıyor artık, sadece pointer kilitleniyor;
   // gerçek sürükleme onMove()'da eşik aşılınca başlar - düz tık artık taşımaz.
 });
}

/* ===================== SIRALAMA / KATEGORİ / YÖNETMEN / OYUNCU ===================== */

function sortIndexed(indexed,mode){
 const arr=indexed.slice();
 switch(mode){
   case "added-asc": arr.sort((a,b)=>a.i-b.i); break;
   case "az": arr.sort((a,b)=>(a.m.Title||"").localeCompare(b.m.Title||"","tr")); break;
   case "za": arr.sort((a,b)=>(b.m.Title||"").localeCompare(a.m.Title||"","tr")); break;
   case "year-desc": arr.sort((a,b)=>(parseInt(b.m.Year)||0)-(parseInt(a.m.Year)||0)); break;
   case "year-asc": arr.sort((a,b)=>(parseInt(a.m.Year)||0)-(parseInt(b.m.Year)||0)); break;
   case "rating-desc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.imdbRating); const ra=parseFloat(a.m.imdbRating);
     return (isNaN(rb)?-1:rb)-(isNaN(ra)?-1:ra);
   }); break;
   case "rating-asc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.imdbRating); const ra=parseFloat(a.m.imdbRating);
     return (isNaN(ra)?999:ra)-(isNaN(rb)?999:rb);
   }); break;
   case "myrating-desc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.myRating); const ra=parseFloat(a.m.myRating);
     return (isNaN(rb)?-1:rb)-(isNaN(ra)?-1:ra);
   }); break;
   case "myrating-asc": arr.sort((a,b)=>{
     const rb=parseFloat(b.m.myRating); const ra=parseFloat(a.m.myRating);
     return (isNaN(ra)?999:ra)-(isNaN(rb)?999:rb);
   }); break;
   case "added-desc":
   default: arr.sort((a,b)=>b.i-a.i); break;
 }
 return arr;
}

function movieGenres(m){
 return (m.Genre||"").split(",").map(g=>g.trim()).filter(g=>g&&g!=="N/A");
}
function movieGenresTr(m){
 const info=turkishCache[m.imdbID];
 if(info && info.genres && info.genres.length) return info.genres;
 return movieGenres(m);
}
function movieDirectors(m){
 return (m.Director||"").split(",").map(s=>s.trim()).filter(s=>s&&s!=="N/A");
}
function movieActors(m){
 return (m.Actors||"").split(",").map(s=>s.trim()).filter(s=>s&&s!=="N/A");
}

function populateGenreSelect(type){
 const sel=document.getElementById(type==="watchlist"?"genreWatch":"genreWatched");
 const current=genreState[type];
 const set=new Set();
 allData[type].forEach(m=>movieGenresTr(m).forEach(g=>set.add(g)));
 const genres=Array.from(set).sort((a,b)=>a.localeCompare(b,"tr"));
 sel.innerHTML='<option value="all">Kategori</option>'+genres.map(g=>`<option value="${g}">${g}</option>`).join("");
 if(current!=="all" && !genres.includes(current)) genreState[type]="all";
 sel.value=genreState[type];
}

function populateDirectorSelect(type){

 if(current!=="all" && !names.includes(current)) directorState[type]="all";

}

function populateActorSelect(type){

function findInList(input,type){
 const q=input.value.trim().toLowerCase();
 if(!q)return;

 let changed=false;
 if(genreState[type]!=="all"){genreState[type]="all";changed=true;}
 if(directorState[type]!=="all"){directorState[type]="all";changed=true;}
 if(actorState[type]!=="all"){actorState[type]="all";changed=true;}
 if(changed) renderColumn(type);

 const listEl=type==="watchlist"?watchList:watchedList;
 const cards=Array.from(listEl.querySelectorAll(".movie"));
 const match=cards.find(c=>{
   const titleEl=c.querySelector("b");
   const trEl=c.querySelector(".tr-title");
   const text=((titleEl?titleEl.textContent:"")+" "+(trEl?trEl.textContent:"")).toLowerCase();
   return text.includes(q);
 });
 if(match){
   match.classList.add("highlight");
   setTimeout(()=>match.classList.remove("highlight"),2000);

   requestAnimationFrame(()=>{
     const container=listEl.closest(".column");
     if(isScrollContainer(container)){
       const containerRect=container.getBoundingClientRect();
       const matchRect=match.getBoundingClientRect();
       const offset=matchRect.top-containerRect.top+container.scrollTop-(container.clientHeight/2)+(matchRect.height/2);
       const prevBehavior=container.style.scrollBehavior;
       container.style.scrollBehavior="auto";
       container.scrollTop=Math.max(offset,0);
       container.style.scrollBehavior=prevBehavior||"";
     } else {
       match.scrollIntoView({behavior:"auto",block:"center"});
     }
   });
 }
}

function renderColumn(type){
 if(searchActive[type]) return; // arama sonuçları ekranda gösteriliyor, üzerine yazma
 const isWatchlist=type==="watchlist";
 const listEl=isWatchlist?watchList:watchedList;
 const countEl=isWatchlist?watchCount:watchedCount;
 const timeEl=isWatchlist?watchTime:watchedTime;

 populateGenreSelect(type);
 populateDirectorSelect(type);
 populateActorSelect(type);

 let indexed=allData[type].map((m,i)=>({m,i}));
 if(genreState[type]!=="all"){
   indexed=indexed.filter(x=>movieGenresTr(x.m).includes(genreState[type]));
 }
 if(directorState[type]!=="all"){
   indexed=indexed.filter(x=>movieDirectors(x.m).includes(directorState[type]));
 }
 if(actorState[type]!=="all"){
   indexed=indexed.filter(x=>movieActors(x.m).includes(actorState[type]));
 }
 indexed=sortIndexed(indexed,sortState[type]);

 listEl.innerHTML="";
 listEl.classList.toggle("grid-view",viewState[type]==="grid");
 let totalMin=0;
 indexed.forEach((x,displayIdx)=>{
   totalMin+=runtimeMin(x.m.Runtime);
   listEl.appendChild(card(x.m,displayIdx,isWatchlist));
 });

 countEl.textContent=indexed.length;
 timeEl.textContent=formatTime(totalMin);
}

function render(){
 renderColumn("watched");
 renderColumn("watchlist");
}

function refreshCardsInPlace(){
 document.querySelectorAll(".movie[data-id]").forEach(el=>{
   const id=el.dataset.id;
   const info=turkishCache[id];
   if(!info) return;
   if(info.title){
     const trEl=el.querySelector(".tr-title");
     if(trEl && !trEl.textContent) trEl.textContent=info.title;
   }
   const budgetEl=el.querySelector(".money-budget");
   if(budgetEl){
     const lines=moneyLines(budgetEl.dataset.boxoffice,info);
     if(lines.budget) budgetEl.innerHTML=lines.budget;
     const revEl=el.querySelector(".money-revenue");
     if(revEl && lines.revenue) revEl.innerHTML=lines.revenue;
   }
 });
 populateGenreSelect("watched");
 populateGenreSelect("watchlist");
}

async function fetchOmdbById(imdbId){
 try{
   const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&i=${imdbId}&plot=short`);
   return await r.json();
 }catch(e){console.error("OMDb hata:",e);return {Response:"False"};}
}

async function searchOmdb(query){
 query=String(query).trim();
 if(query.length<2) return {Response:"False"};
 try{
   const url=query.toLowerCase().startsWith("tt")
     ? `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&i=${query}&plot=short`
     : `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(query)}&type=movie`;
   const r=await fetch(url);
   return await r.json();
 }catch(e){console.error("OMDb arama hatası:",e);return {Response:"False"};}
}

const LOCAL_CACHE_KEY="filmarsivi_cache";

function saveToCache(){
 try{
   localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({watched:allData.watched,watchlist:allData.watchlist}));
 }catch(e){}
}

function loadFromCache(){
 try{
   const raw=localStorage.getItem(LOCAL_CACHE_KEY);
   if(raw){
     const cached=JSON.parse(raw);
     if(cached && Array.isArray(cached.watched) && Array.isArray(cached.watchlist)){
       allData=cached;
       render();
       preloadInfo().then(()=>{ refreshCardsInPlace(); });
       return true;
     }
   }
 }catch(e){}
 return false;
}

let isReloading=false;
async function reload(){
 if(isReloading) return;
 isReloading=true;
 const statusEl=document.getElementById("syncStatus");
 const btns=document.querySelectorAll(".refresh-btn");
 btns.forEach(b=>{b.style.pointerEvents="none";b.style.opacity="0.4";});
 try{
   if(statusEl) statusEl.textContent="Yükleniyor…";
   const [watchedSnap,watchlistSnap]=await Promise.all([
     db.collection("watched").get(),
     db.collection("watchlist").get()
   ]);
   const sortByAdded=arr=>arr.slice().sort((a,b)=>(a._addedAt||0)-(b._addedAt||0));
   allData={
     watched: sortByAdded(watchedSnap.docs.map(d=>d.data())),
     watchlist: sortByAdded(watchlistSnap.docs.map(d=>d.data()))
   };
   render();
   if(statusEl) statusEl.textContent="";
   saveToCache();
   preloadInfo().then(()=>{ refreshCardsInPlace(); });
   backfillGenres();
 }catch(e){
   console.error(e);
   if(statusEl) statusEl.textContent="";
 }finally{
   isReloading=false;
   btns.forEach(b=>{b.style.pointerEvents="";b.style.opacity="";});
 }
}

const TR_MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function formatTrDate(ms){
 if(!ms) return "-";
 const d=new Date(ms);
 return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

let detailState={id:null,type:null};
const castCache={};              // tmdbMovieId -> {cast, director, writers}
const personExternalIdCache={};  // tmdb kişi id -> imdb kişi id ("nm...") ya da null

function fillDetailMoney(movie,info){
 const budget=formatMoney(info&&info.budget);
 const revenue=formatMoney(info&&info.revenue)||formatMoney(parseOmdbMoney(movie.BoxOffice));
 if(budget){document.getElementById("detailBudget").textContent=budget;document.getElementById("detailBudgetBox").style.display="";}
 else document.getElementById("detailBudgetBox").style.display="none";
 if(revenue){document.getElementById("detailRevenue").textContent=revenue;document.getElementById("detailRevenueBox").style.display="";}
 else document.getElementById("detailRevenueBox").style.display="none";
 document.getElementById("detailMoneyRow").style.display=(budget||revenue)?"":"none";
}

async function getPersonImdbId(personId){
 if(personExternalIdCache[personId]!==undefined) return personExternalIdCache[personId];
 try{
   const d=await fetchJson(`https://api.themoviedb.org/3/person/${personId}/external_ids?api_key=${TMDB_KEY}`);
   personExternalIdCache[personId]=d && d.imdb_id ? d.imdb_id : null;
 }catch(e){ personExternalIdCache[personId]=null; }
 return personExternalIdCache[personId];
}

async function openPersonPage(personId){
 // ÖNEMLİ: window.open() bir "await"ten SONRA çağrılırsa Safari (özellikle
 // ana ekrana eklenmiş PWA'da) bunu artık kullanıcı etkileşimiyle senkron
 // sayılan bir açılış olarak görmüyor - sekmeyi güvenilir açamıyor, bazen
 // uygulamanın kendi sayfasını tekrar tekrar yenilemeye çalışıyormuş gibi
 // takılıyor. Çözüm: sekmeyi HEMEN (senkron) boş olarak aç, adres bilgisini
 // async sorgu bitince yerleştir.
 const win=window.open("about:blank","_blank");
 const imdbId=await getPersonImdbId(personId);
 const url=imdbId?`https://www.imdb.com/name/${imdbId}/`:`https://www.themoviedb.org/person/${personId}`;
 if(win) win.location.href=url;
 else window.open(url,"_blank");
}

// Filmin oyuncu kadrosunu/yönetmen-senarist listesini TMDB'den çeker
// (SADECE bu film açıldığında, bir kereye mahsus - toplu ön-yüklemeye dahil değil).
async function loadCastForDetail(tmdbId){
 if(!tmdbId) return null;
 if(castCache[tmdbId]) return castCache[tmdbId];
 try{
   const data=await fetchJson(`https://api.themoviedb.org/3/movie/${tmdbId}/credits?api_key=${TMDB_KEY}&language=tr-TR`);
   const cast=(data.cast||[]).slice(0,12);
   const crew=data.crew||[];
   const director=crew.filter(c=>c.job==="Director");
   const writers=crew.filter(c=>["Screenplay","Writer","Story"].includes(c.job));
   const result={cast,director,writers};
   castCache[tmdbId]=result;
   return result;
 }catch(e){ return null; }
}

function personListHtml(people){
 if(!people||!people.length) return "—";
 return people.map(p=>`<span class="detail-person-link" data-person-id="${p.id}">${escapeHtml(p.name)}</span>`).join(", ");
}

function renderCastRow(cast){
 const wrap=document.getElementById("detailCastRow");
 if(!cast||!cast.length){ wrap.innerHTML=""; return; }
 wrap.innerHTML=cast.map(p=>{
   const photo=p.profile_path?`https://image.tmdb.org/t/p/w185${p.profile_path}`:"https://via.placeholder.com/92x92?text=%20";
   return `<div class="person-photo-card" data-person-id="${p.id}">
     <div class="person-photo-wrap">
       <img class="person-photo" src="${photo}" loading="lazy">
     </div>
     <div class="person-photo-info">
       <div class="person-photo-name">${escapeHtml(p.name)}</div>
       <div class="person-photo-character">${escapeHtml(p.character||"")}</div>
     </div>
   </div>`;
 }).join("");
}

function openDetail(id,type,fromHistory){
 const movie=(allData[type]||[]).find(m=>m.imdbID===id);
 if(!movie) return;
 detailState={id,type};
 const info=turkishCache[id]||{};

 const backdropUrl=info.backdrop||(movie.Poster&&movie.Poster!=="N/A"?movie.Poster:null);
 document.getElementById("detailBackdrop").style.backgroundImage=backdropUrl?`url('${backdropUrl}')`:"none";
 document.getElementById("detailPoster").src=(movie.Poster&&movie.Poster!=="N/A")?movie.Poster:(info.poster||"https://via.placeholder.com/130x195");
 document.getElementById("detailYear").textContent=movie.Year||"";
 document.getElementById("detailRuntime").textContent=(movie.Runtime&&movie.Runtime!=="N/A")?movie.Runtime:"";
 document.getElementById("detailImdbLink").onclick=()=>{openImdb(id);return false;};
 const tmdbLinkEl=document.getElementById("detailTmdbLink");
 tmdbLinkEl.style.display=info.tmdbId?"":"none";
 tmdbLinkEl.onclick=()=>{if(info.tmdbId) window.open(`https://www.themoviedb.org/movie/${info.tmdbId}`,"_blank");return false;};
 document.getElementById("detailTitle").textContent=movie.Title||"";
 document.getElementById("detailTrTitle").textContent=(info.title&&info.title!==movie.Title)?info.title:"";
 document.getElementById("detailMyRatingIcon").innerHTML=MY_STAR_SVG_BIG;
 document.getElementById("detailImdbRating").textContent=(movie.imdbRating&&movie.imdbRating!=="N/A")?`${movie.imdbRating} / 10`:"—";
 document.getElementById("detailTrailerLink").onclick=()=>{openTrailer(id);return false;};
 document.getElementById("detailMyRating").value=(movie.myRating!=null&&movie.myRating!=="")?Number(movie.myRating).toFixed(1):"";
 document.getElementById("detailAddedDate").textContent=formatTrDate(movie._addedAt);

 document.getElementById("detailPlot").textContent=info.overview||((movie.Plot&&movie.Plot!=="N/A")?movie.Plot:"Özet bulunamadı.");

 fillDetailMoney(movie,info);

 document.getElementById("detailDirector").textContent=(movie.Director&&movie.Director!=="N/A")?movie.Director:"—";
 document.getElementById("detailWriter").textContent=(movie.Writer&&movie.Writer!=="N/A")?movie.Writer:"—";
 document.getElementById("detailCastRow").innerHTML="";

 const genres=movieGenresTr(movie);
 document.getElementById("detailGenres").innerHTML=genres.length?genres.map(g=>`<span class="detail-genre-tag">${escapeHtml(g)}</span>`).join(""):"";

 document.getElementById("detailModalBox").style.transform="";
 document.getElementById("detailOverlay").classList.add("open");

 // Tarayıcı geçmişine bu kartın açık olduğunu kaydet - böylece kullanıcı
 // oyuncu/IMDb/TMDB sayfasına gidip GERİ döndüğünde (telefonun geri tuşu/
 // kaydırması ile) ana sayfaya değil, tam olarak bu açık karta dönsün.
 // (fromHistory=true ise zaten bir popstate'e cevaben açıyoruzdur, tekrar
 // pushState YAPMAYIZ - yoksa geçmiş sonsuz büyür.)
 if(!fromHistory){
   history.pushState({filmDetay:{id,type}}, "");
 }

 // TMDB bilgisi (Türkçe özet/backdrop/bütçe) önbellekte yoksa açılışta bir kere çek.
 const infoPromise=(!turkishCache[id] || !turkishCache[id]._checked)
   ? getTurkishInfo(id,movie.Title,movie.Year)
   : Promise.resolve(info);

 infoPromise.then(freshInfo=>{
   if(detailState.id!==id) return; // kullanıcı bu arada kapattı/başka filme geçti
   if(freshInfo.backdrop) document.getElementById("detailBackdrop").style.backgroundImage=`url('${freshInfo.backdrop}')`;
   if(freshInfo.overview) document.getElementById("detailPlot").textContent=freshInfo.overview;
   if(freshInfo.title && freshInfo.title!==movie.Title) document.getElementById("detailTrTitle").textContent=freshInfo.title;
   fillDetailMoney(movie,freshInfo);
   tmdbLinkEl.style.display=freshInfo.tmdbId?"":"none";
   tmdbLinkEl.onclick=()=>{if(freshInfo.tmdbId) window.open(`https://www.themoviedb.org/movie/${freshInfo.tmdbId}`,"_blank");return false;};

   if(!freshInfo.tmdbId) return;
   loadCastForDetail(freshInfo.tmdbId).then(castInfo=>{
     if(detailState.id!==id || !castInfo) return;
     document.getElementById("detailDirector").innerHTML=personListHtml(castInfo.director);
     document.getElementById("detailWriter").innerHTML=personListHtml(castInfo.writers);
     renderCastRow(castInfo.cast);
   });
 }).catch(()=>{});
}

// Kullanıcı Kapat/X/kaydırma ile kapatıyor: SADECE bir geri gidiyoruz,
// gerçek kapanma (arayüzü gizleme) popstate olayında, syncOverlaysToHistory
// içinde tek bir yerden yapılıyor - böylece "X'e basarak kapatma" ile
// "telefonun geri tuşuyla kapatma" arasında hiçbir fark kalmıyor, ikisi de
// aynı kod yolundan geçiyor.
function closeDetail(){
 if(history.state && history.state.filmDetay && history.state.filmDetay.id===detailState.id){
   history.back();
 }else{
   closeDetailUI();
 }
}

function closeDetailUI(){
 document.getElementById("detailOverlay").classList.remove("open");
 detailState={id:null,type:null};
 const modal=document.getElementById("detailModalBox");
 if(modal){ modal.style.transition="none"; modal.style.transform=""; modal.style.opacity=""; }
}

// Tarayıcı geçmişi ile açık kart arayüzünü senkronize eder. Hem telefonun
// geri tuşuna/kaydırmasına basıldığında hem de sayfa IMDb/TMDB ziyaretinden
// SONRA sıfırdan yeniden yüklendiğinde (bfcache kaçırıldığında) çalışır.
function syncOverlaysToHistory(){
 const wanted=history.state && history.state.filmDetay;
 if(wanted){
   if(detailState.id!==wanted.id){
     // Film verisi henüz gelmediyse (ör. Firestore/localStorage yüklenmeden
     // önce geri tuşuna basıldıysa) veri gelince tekrar denenecek - bkz. init.
     const exists=(allData[wanted.type]||[]).some(m=>m.imdbID===wanted.id);
     if(exists) openDetail(wanted.id, wanted.type, true);
   }
 }else if(document.getElementById("detailOverlay").classList.contains("open")){
   closeDetailUI();
 }
}
window.addEventListener("popstate", syncOverlaysToHistory);

 let myRating=null;
 if(rawRating){
   const r=parseFloat(rawRating.replace(",","."));

// iOS benzeri: detay ekranında sağa kaydırarak kapatma.
// Tamamen kendi JS'imizle yapılıyor ve yatay hareket kesinleşince
// preventDefault() ile tarayıcının/telefonun kendi "kenardan geri" jestini
// devre dışı bırakıyoruz - önceki sürümdeki kısa kararma/boşluk sıçraması
// bu iki animasyonun (bizimki + tarayıcının) aynı anda çalışmasından kaynaklanıyordu.
(function(){
 const modal=document.getElementById("detailModalBox");
 if(!modal) return;
 let startX=null,startY=null,dragging=false,horizontal=false;

 modal.addEventListener("touchstart",e=>{
   if(e.touches.length!==1) return;
   startX=e.touches[0].clientX; startY=e.touches[0].clientY;
   dragging=true; horizontal=false;
   modal.style.transition="none";
 },{passive:true});

 modal.addEventListener("touchmove",e=>{
   if(!dragging||startX===null) return;
   const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
   if(!horizontal && Math.abs(dx)>8){
     horizontal = Math.abs(dx)>Math.abs(dy);
   }
   if(horizontal && dx>0){
     e.preventDefault(); // native geri-kaydırma jestiyle çakışmayı önler
     const clamped=Math.min(dx,window.innerWidth);
     modal.style.transform=`translateX(${clamped}px)`;
     modal.style.opacity=String(Math.max(1-clamped/(window.innerWidth*0.9),0.15));
   }
 },{passive:false});

 modal.addEventListener("touchend",e=>{
   if(!dragging||startX===null){ dragging=false; return; }
   const dx=(e.changedTouches[0].clientX-startX);
   const dy=(e.changedTouches[0].clientY-startY);
   dragging=false; startX=null; startY=null;
   if(horizontal && dx>90 && Math.abs(dy)<120){
     closeDetail(); // anında kapat, ekstra animasyon/karartma yok
   }else{
     modal.style.transition="transform .18s ease,opacity .18s ease";
     modal.style.transform=""; modal.style.opacity="";
     setTimeout(()=>{ if(modal) modal.style.transition="none"; },200);
   }
   horizontal=false;
 },{passive:true});
})();

async function backfillGenres(){
 let changed=false;
 for(const type of ["watched","watchlist"]){
   for(const m of allData[type]){
     if((!m.Genre || m.Genre==="N/A") && m.imdbID){
       try{
         const info=await fetchOmdbById(m.imdbID);
         if(info.Response==="True" && info.Genre && info.Genre!=="N/A"){
           m.Genre=info.Genre;
           await db.collection(type).doc(m.imdbID).update({Genre: info.Genre});
           changed=true;
         }
       }catch(e){}
     }
   }
 }
 if(changed){ render(); saveToCache(); }
}

/* ===================== İÇE / DIŞA AKTAR ===================== */

async function handleImportFile(file){
 if(!file) return;
 const statusEl=document.getElementById("syncStatus");
 try{
   const text=await file.text();
   const data=JSON.parse(text);
   const items=[];
   for(const type of ["watched","watchlist"]){
     (data[type]||[]).forEach((m,i)=>{ if(m.imdbID) items.push({type,m,i}); });
   }
   const base=Date.now()-items.length*1000;
   let n=0;
   for(let i=0;i<items.length;i+=400){
     const chunk=items.slice(i,i+400);
     const batch=db.batch();
     chunk.forEach((item,idx)=>{
       item.m._addedAt=base+(i+idx)*1000;
       batch.set(db.collection(item.type).doc(item.m.imdbID), item.m);
     });
     await batch.commit();
     n+=chunk.length;
     if(statusEl) statusEl.textContent=`İçe aktarılıyor… ${n}/${items.length}`;
   }
   alert(`İçe aktarma tamamlandı: ${n} film eklendi.`);
   reload();
 }catch(e){
   console.error(e);
   alert("İçe aktarma başarısız oldu: "+e.message);
 }
}

function exportData(){
 const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url; a.download="movies_backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

function isScrollContainer(el){
 return el && el.scrollHeight > el.clientHeight + 2;
}

function scrollToTop(type){
 const container=(type==="watchlist"?watchList:watchedList).closest(".column");
 if(isScrollContainer(container)){
   container.scrollTo({top:0,behavior:"smooth"});
 } else {
   container.scrollIntoView({behavior:"smooth",block:"start"});
 }
}

// Tek liste odak modu: her zaman ya İzlenen ya da İzlenecek gösterilir,
// "ikisi birden" diye bir ara durum yok. Buton tek tıkla direkt diğerine geçirir.
function currentFocus(){
 const html=document.documentElement;
 if(html.classList.contains("focus-watchlist")) return "watchlist";
 return "watched"; // varsayılan / bilinmeyen durum
}

function toggleFocus(){
 const html=document.documentElement;
 const next=currentFocus()==="watched"?"watchlist":"watched";
 html.classList.remove("focus-watched","focus-watchlist");
 html.classList.add("single-focus","focus-"+next);
 localStorage.setItem("filmarsivi_focus",next);
}

function toggleView(type){
 viewState[type]=viewState[type]==="list"?"grid":"list";
 const listEl=type==="watchlist"?watchList:watchedList;
 listEl.classList.toggle("grid-view",viewState[type]==="grid");
}

// Açılışta önce önbellekten (localStorage) ANINDA göster - buluta hiç
// dokunmadan. Firestore okuma kotasını boşuna tüketmemek için otomatik
// yenileme tamamen kaldırıldı; buluta sadece 🔄'ye basınca dokunuluyor.
// (Hiç önbellek yoksa - ilk açılış - bir kereliğine buluttan çekiyoruz.)
if(!loadFromCache()){
 reload().then(()=>{ syncOverlaysToHistory(); });
}else{

 // ziyaretinden dönüşte) sıfırdan yeniden yüklenmiş olabilir - veri artık
 // hazır olduğuna göre ilgili kartı hemen geri aç.
 syncOverlaysToHistory();
}
